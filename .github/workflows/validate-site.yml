name: Validate site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check tools/build-site.mjs
          node --check tools/check-content.mjs
          node --check tools/randomize-topic.mjs

      - name: Check generated output
        run: node tools/build-site.mjs --check

      - name: Validate content and site integrity
        run: node tools/check-content.mjs
