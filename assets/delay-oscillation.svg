<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Delayed feedback creates overshoot</title>
  <desc id="desc">Repeated adjustments are made during a feedback delay. The result appears later, overshoots the target, and prompts a correction in the opposite direction.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1l10 5-10 5" fill="none" stroke="#18211d" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="190" y="90" width="350" height="540" rx="18" fill="#e9d17f" opacity=".34"/>
  <g stroke="#18211d" stroke-width="4" fill="none">
    <line x1="115" y1="626" x2="1110" y2="626" marker-end="url(#arrow)"/>
    <line x1="115" y1="100" x2="115" y2="626"/>
    <line x1="115" y1="366" x2="1110" y2="366" stroke-dasharray="14 12"/>
  </g>
  <text x="1120" y="638" font-family="Arial, sans-serif" font-size="26" fill="#18211d">time</text>
  <rect x="1000" y="292" width="110" height="52" rx="26" fill="#18211d"/>
  <text x="1055" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="white">target</text>
  <path d="M115 550C260 542 320 520 395 455C455 404 500 260 585 210C678 156 742 270 800 392C852 501 918 521 974 427C1020 350 1062 337 1110 366" fill="none" stroke="#d86136" stroke-width="10"/>
  <g fill="#fffdf8" stroke="#18211d" stroke-width="3">
    <circle cx="210" cy="540" r="13"/><circle cx="330" cy="505" r="13"/><circle cx="450" cy="373" r="13"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#18211d">
    <text x="365" y="142" text-anchor="middle" font-size="28" font-weight="700">FEEDBACK DELAY</text>
    <text x="365" y="178" text-anchor="middle" font-size="24">outcome is not visible yet</text>
    <rect x="150" y="650" width="120" height="54" rx="27" fill="#b8d5e5" stroke="#18211d" stroke-width="3"/>
    <rect x="290" y="650" width="168" height="54" rx="27" fill="#b8d5e5" stroke="#18211d" stroke-width="3"/>
    <rect x="478" y="650" width="168" height="54" rx="27" fill="#b8d5e5" stroke="#18211d" stroke-width="3"/>
    <text x="210" y="685" text-anchor="middle" font-size="24" font-weight="700">adjust</text>
    <text x="374" y="685" text-anchor="middle" font-size="24" font-weight="700">adjust again</text>
    <text x="562" y="685" text-anchor="middle" font-size="24" font-weight="700">adjust again</text>
    <text x="650" y="128" font-size="28" font-weight="700">result arrives late</text>
    <line x1="700" y1="143" x2="625" y2="204" stroke="#18211d" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="820" y="566" font-size="28" font-weight="700">late correction</text>
    <line x1="884" y1="535" x2="858" y2="492" stroke="#18211d" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
