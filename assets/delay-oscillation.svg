<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Delayed feedback creates overshoot and oscillation</title>
  <desc id="desc">Repeated adjustments continue while feedback is delayed, driving the result above a target before late corrections push it below again.</desc>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#18211d">Delayed feedback invites overcorrection</text>
  <g stroke="#18211d" stroke-width="3" fill="none">
    <line x1="110" y1="610" x2="1125" y2="610"/>
    <line x1="110" y1="150" x2="110" y2="610"/>
    <line x1="110" y1="365" x2="1125" y2="365" stroke-dasharray="12 10"/>
  </g>
  <text x="1135" y="372" font-family="Arial, sans-serif" font-size="20" fill="#18211d">target</text>
  <path d="M110 552 C255 540 285 515 350 475 C420 430 470 285 565 238 C665 188 728 290 785 385 C850 492 914 500 970 410 C1020 332 1070 328 1125 365" fill="none" stroke="#b54424" stroke-width="8"/>
  <g fill="#f5c79d" stroke="#18211d" stroke-width="3">
    <circle cx="220" cy="535" r="12"/><circle cx="350" cy="475" r="12"/><circle cx="475" cy="305" r="12"/><circle cx="690" cy="250" r="12"/><circle cx="850" cy="492" r="12"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#18211d" text-anchor="middle">
    <text x="350" y="682" font-size="21" font-weight="700">ADJUST AGAIN</text>
    <text x="565" y="172" font-size="21" font-weight="700">RESULT ARRIVES LATE</text>
    <text x="850" y="555" font-size="21" font-weight="700">CORRECTION OVERSHOOTS</text>
  </g>
  <path d="M250 520h165" stroke="#18211d" stroke-width="4" stroke-dasharray="10 8"/>
  <path d="m402 508 15 12-15 12" fill="none" stroke="#18211d" stroke-width="4"/>
  <text x="332" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#18211d">feedback delay</text>
  <text x="600" y="722" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#18211d">The right response depends on the delay relative to the system's rate of change—not on reacting fastest.</text>
</svg>
