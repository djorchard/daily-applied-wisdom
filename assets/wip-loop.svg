<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">A reinforcing work-in-progress loop</title>
  <desc id="desc">Deadline pressure leads a team to start more work. Work in progress rises, completion slows, and deadline pressure increases again.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5" fill="none" stroke="#18211d" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <g stroke="#18211d" stroke-width="4">
    <rect x="430" y="54" width="340" height="126" rx="24" fill="#f5c79d"/>
    <rect x="820" y="300" width="310" height="126" rx="24" fill="#e9d17f"/>
    <rect x="430" y="580" width="340" height="126" rx="24" fill="#d8cce8"/>
    <rect x="70" y="300" width="310" height="126" rx="24" fill="#b8d5e5"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#18211d" text-anchor="middle">
    <text x="600" y="128">Deadline pressure</text>
    <text x="975" y="374">Start more work</text>
    <text x="600" y="654">Work in progress rises</text>
    <text x="225" y="374">Completion slows</text>
  </g>
  <g fill="none" stroke="#18211d" stroke-width="5" marker-end="url(#arrow)">
    <path d="M770 144C875 166 945 216 969 288"/>
    <path d="M970 430C942 510 861 578 784 615"/>
    <path d="M416 636C326 607 246 525 226 442"/>
    <path d="M226 286C250 211 329 158 416 137"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">
    <g><circle cx="852" cy="188" r="21" fill="#d86136"/><text x="852" y="197" fill="white">+</text></g>
    <g><circle cx="874" cy="526" r="21" fill="#d86136"/><text x="874" y="535" fill="white">+</text></g>
    <g><circle cx="327" cy="531" r="21" fill="#d86136"/><text x="327" y="540" fill="white">+</text></g>
    <g><circle cx="343" cy="190" r="21" fill="#d86136"/><text x="343" y="199" fill="white">+</text></g>
  </g>
  <circle cx="600" cy="368" r="112" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <text x="600" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="70" font-weight="700" fill="#d86136">R</text>
  <text x="600" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18211d">REINFORCING</text>
  <text x="600" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18211d">LOOP</text>
</svg>
