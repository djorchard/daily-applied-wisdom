<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Four depths of intervention in a system</title>
  <desc id="desc">Changing numbers and targets is usually easier and narrower. Changes to information and rules, goals, or mindsets may reach more downstream decisions but are harder to understand and safer only after investigation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5" fill="none" stroke="#18211d" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <g font-family="Arial, sans-serif" fill="#18211d">
    <g stroke="#18211d" stroke-width="4">
      <rect x="245" y="70" width="710" height="125" rx="22" fill="#b8d5e5"/>
      <rect x="245" y="225" width="710" height="125" rx="22" fill="#bdd9bf"/>
      <rect x="245" y="380" width="710" height="125" rx="22" fill="#f5c79d"/>
      <rect x="245" y="535" width="710" height="125" rx="22" fill="#d8cce8"/>
    </g>
    <g font-size="30" font-weight="700">
      <text x="290" y="126">NUMBERS &amp; TARGETS</text>
      <text x="290" y="281">INFORMATION &amp; RULES</text>
      <text x="290" y="436">SYSTEM GOALS</text>
      <text x="290" y="591">MINDSETS &amp; PARADIGMS</text>
    </g>
    <g font-size="25">
      <text x="290" y="163">Change a visible value</text>
      <text x="290" y="318">Change what people see or may do</text>
      <text x="290" y="473">Change what the system optimises</text>
      <text x="290" y="628">Change what is considered possible</text>
    </g>
    <line x1="145" y1="625" x2="145" y2="100" stroke="#18211d" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="92" y="376" transform="rotate(-90 92 376)" text-anchor="middle" font-size="25" font-weight="700">EASIER TO CHANGE</text>
    <line x1="1055" y1="100" x2="1055" y2="625" stroke="#18211d" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="1110" y="376" transform="rotate(90 1110 376)" text-anchor="middle" font-size="25" font-weight="700">POTENTIAL SYSTEMIC REACH</text>
    <text x="600" y="716" text-anchor="middle" font-size="24" font-weight="700">Deeper intervention increases uncertainty as well as possible reach.</text>
  </g>
</svg>
