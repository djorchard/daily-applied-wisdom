<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="event-driven-retained-log-title event-driven-retained-log-desc">
  <title id="event-driven-retained-log-title">Retention and reader position are separate</title>
  <desc id="event-driven-retained-log-desc">Four events remain in one partition. Reader A has read two and Reader B four. Their separate progress pointers leave the records in place, subject to retention.</desc>
  <defs><marker id="event-driven-retained-log-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#18211d"/></marker><style>text {font-family: Arial, sans-serif; fill: #18211d;}</style></defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <text x="600" y="75" text-anchor="middle" font-size="34" font-weight="700">ONE PARTITION · RETAINED FACTS</text>
  <text x="600" y="125" text-anchor="middle" font-size="28" font-weight="400">Reading advances a position, not everyone else’s position.</text>
  <rect x="70" y="190" width="1060" height="170" rx="22" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <rect x="100" y="218" width="220" height="112" rx="14" fill="#a9c7df" stroke="#18211d" stroke-width="4"/>
  <text x="210" y="264" text-anchor="middle" font-size="30" font-weight="700">EVENT 1</text>
  <text x="210" y="307" text-anchor="middle" font-size="28" font-weight="400">created</text>
  <rect x="360" y="218" width="220" height="112" rx="14" fill="#bdd9bf" stroke="#18211d" stroke-width="4"/>
  <text x="470" y="264" text-anchor="middle" font-size="30" font-weight="700">EVENT 2</text>
  <text x="470" y="307" text-anchor="middle" font-size="28" font-weight="400">confirmed</text>
  <rect x="620" y="218" width="220" height="112" rx="14" fill="#e9d17f" stroke="#18211d" stroke-width="4"/>
  <text x="730" y="264" text-anchor="middle" font-size="30" font-weight="700">EVENT 3</text>
  <text x="730" y="307" text-anchor="middle" font-size="28" font-weight="400">packed</text>
  <rect x="880" y="218" width="220" height="112" rx="14" fill="#d8cce8" stroke="#18211d" stroke-width="4"/>
  <text x="990" y="264" text-anchor="middle" font-size="30" font-weight="700">EVENT 4</text>
  <text x="990" y="307" text-anchor="middle" font-size="28" font-weight="400">shipped</text>
  <rect x="70" y="412" width="290" height="100" rx="22" fill="#a9c7df" stroke="#18211d" stroke-width="4"/>
  <text x="215" y="453" text-anchor="middle" font-size="30" font-weight="700">READER A</text>
  <text x="215" y="488" text-anchor="middle" font-size="25" font-weight="400">read through event 2</text>
  <path d="M360 462H470V372" fill="none" stroke="#18211d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#event-driven-retained-log-arrow)"/>
  <rect x="650" y="540" width="320" height="100" rx="22" fill="#bdd9bf" stroke="#18211d" stroke-width="4"/>
  <text x="810" y="581" text-anchor="middle" font-size="30" font-weight="700">READER B</text>
  <text x="810" y="616" text-anchor="middle" font-size="25" font-weight="400">read through event 4</text>
  <path d="M970 590H1075V375" fill="none" stroke="#18211d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#event-driven-retained-log-arrow)"/>
  <text x="440" y="589" text-anchor="middle" font-size="32" font-weight="700">Same records.</text>
  <text x="440" y="631" text-anchor="middle" font-size="32" font-weight="700">Different progress.</text>
  <text x="600" y="714" text-anchor="middle" font-size="30" font-weight="700">Only retained history can be read again.</text>
</svg>
