<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="debugging-narrow-interval-title debugging-narrow-interval-desc">
  <title id="debugging-narrow-interval-title">A good midpoint observation narrows a suspect interval</title>
  <desc id="debugging-narrow-interval-desc">On a linear path A to B to C to D, output after A is known good and output after D is bad. Probing after B finds a good result, leaving stages C and D in the observed suspect interval. This brackets the checked property, not all possible faults.</desc>
  <defs><marker id="debugging-narrow-interval-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#18211d"/></marker><style>text {font-family: Arial, sans-serif; fill: #18211d;}</style></defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <text x="600" y="74" text-anchor="middle" font-size="34" font-weight="700">MOVE A BOUNDARY WITH EVIDENCE</text>
  <text x="300" y="140" text-anchor="middle" font-size="28" font-weight="700">GOOD</text>
  <text x="590" y="140" text-anchor="middle" font-size="28" font-weight="700">NEW: GOOD</text>
  <text x="1110" y="140" text-anchor="middle" font-size="28" font-weight="700">BAD</text>
  <rect x="55" y="205" width="200" height="125" rx="20" fill="#a9c7df" stroke="#18211d" stroke-width="4"/>
  <text x="155" y="282" text-anchor="middle" font-size="46" font-weight="700">A</text>
  <rect x="345" y="205" width="200" height="125" rx="20" fill="#a9c7df" stroke="#18211d" stroke-width="4"/>
  <text x="445" y="282" text-anchor="middle" font-size="46" font-weight="700">B</text>
  <rect x="635" y="205" width="200" height="125" rx="20" fill="#e8b89c" stroke="#18211d" stroke-width="4"/>
  <text x="735" y="282" text-anchor="middle" font-size="46" font-weight="700">C</text>
  <rect x="925" y="205" width="160" height="125" rx="20" fill="#e8b89c" stroke="#18211d" stroke-width="4"/>
  <text x="1005" y="282" text-anchor="middle" font-size="46" font-weight="700">D</text>
  <path d="M265 267H332" fill="none" stroke="#18211d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#debugging-narrow-interval-arrow)"/>
  <path d="M555 267H622" fill="none" stroke="#18211d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#debugging-narrow-interval-arrow)"/>
  <path d="M845 267H912" fill="none" stroke="#18211d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#debugging-narrow-interval-arrow)"/>
  <path d="M1094 267H1150" fill="none" stroke="#18211d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#debugging-narrow-interval-arrow)"/>
  <path d="M300 157V235" fill="none" stroke="#18211d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M590 157V235" fill="none" stroke="#18211d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1110 157V235" fill="none" stroke="#18211d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="300" cy="267" r="10" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
  <circle cx="590" cy="267" r="10" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
  <text x="150" y="425" text-anchor="middle" font-size="28" font-weight="700">BEFORE</text>
  <path d="M300 392V420H1120V392" fill="none" stroke="#18211d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="710" y="467" text-anchor="middle" font-size="32" font-weight="400">Search B + C + D</text>
  <text x="150" y="555" text-anchor="middle" font-size="28" font-weight="700">AFTER</text>
  <path d="M590 522V550H1120V522" fill="none" stroke="#18211d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="855" y="597" text-anchor="middle" font-size="32" font-weight="700">Search C + D</text>
  <rect x="90" y="648" width="1020" height="70" rx="20" fill="#bdd9bf" stroke="#18211d" stroke-width="4"/>
  <text x="600" y="693" text-anchor="middle" font-size="28" font-weight="400">One input. One checked property. A smaller next search.</text>
</svg>
