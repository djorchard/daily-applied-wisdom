<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="money-buffer-title money-buffer-desc">
  <title id="money-buffer-title">A buffer changes the failure path of a financial plan</title>
  <desc id="money-buffer-desc">Two plans face the same surprise. The exact-fit plan depends on every assumption and breaks, while the buffered plan absorbs the shock, buys time and continues after an adjustment.</desc>
  <defs>
    <marker id="money-buffer-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 24px; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .card { stroke: #18211d; stroke-width: 4; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>

  <rect class="card" x="60" y="72" width="1080" height="116" rx="24" fill="#f5c79d"/>
  <text class="heading" x="600" y="121" text-anchor="middle">SAME SURPRISE</text>
  <text class="body" x="600" y="158" text-anchor="middle">income arrives later while an essential expense arrives now</text>

  <text class="heading" x="305" y="245" text-anchor="middle">EXACT-FIT PLAN</text>
  <rect class="card" x="80" y="278" width="250" height="122" rx="20" fill="#fffdf8"/>
  <text class="body" x="205" y="326" text-anchor="middle">Every assumption</text>
  <text class="body" x="205" y="361" text-anchor="middle">must be right</text>
  <path class="line" d="M330 339H430" marker-end="url(#money-buffer-arrow)"/>
  <path d="M456 288L530 390M530 288L456 390" stroke="#b54424" stroke-width="14" stroke-linecap="round"/>
  <text class="heading" x="430" y="447" text-anchor="middle" fill="#b54424">FORCED RESPONSE</text>
  <text class="body" x="430" y="485" text-anchor="middle">sell, borrow or abandon</text>

  <line x1="600" y1="232" x2="600" y2="620" stroke="#18211d" stroke-width="3" stroke-dasharray="12 12"/>

  <text class="heading" x="895" y="245" text-anchor="middle">BUFFERED PLAN</text>
  <rect class="card" x="660" y="278" width="220" height="122" rx="20" fill="#fffdf8"/>
  <text class="body" x="770" y="326" text-anchor="middle">Core plan</text>
  <text class="body" x="770" y="361" text-anchor="middle">can continue</text>
  <rect class="card" x="900" y="278" width="220" height="122" rx="20" fill="#bdd9bf"/>
  <text class="body" x="1010" y="326" text-anchor="middle">ROOM FOR</text>
  <text class="body" x="1010" y="361" text-anchor="middle">ERROR</text>
  <path class="line" d="M770 400V440H1010V410"/>
  <path class="line" d="M890 440V505" marker-end="url(#money-buffer-arrow)"/>
  <rect class="card" x="690" y="515" width="400" height="104" rx="22" fill="#b8d5e5"/>
  <text class="heading" x="890" y="557" text-anchor="middle">ADJUST, THEN CONTINUE</text>
  <text class="body" x="890" y="592" text-anchor="middle">time and choice remain</text>

  <rect class="card" x="130" y="650" width="940" height="70" rx="35" fill="#e4cf8e"/>
  <text class="heading" x="600" y="695" text-anchor="middle">BUFFER = A RANGE OF SURVIVABLE OUTCOMES</text>
</svg>
