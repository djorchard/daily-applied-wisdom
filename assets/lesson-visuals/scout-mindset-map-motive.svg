<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="scout-map-title scout-map-desc">
  <title id="scout-map-title">The goal of reasoning changes how evidence is inspected</title>
  <desc id="scout-map-desc">The same inconvenient evidence enters two paths. A defend-the-position goal filters for support and preserves a preferred story. An improve-the-map goal asks what fits and conflicts, then revises the map.</desc>
  <defs>
    <marker id="scout-map-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="298" y="28" width="604" height="62" rx="31" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="600" y="68" text-anchor="middle">SAME EVIDENCE, DIFFERENT GOAL</text>

  <rect class="card" x="370" y="120" width="460" height="92" rx="24" fill="#e9d17f"/>
  <text class="heading" x="600" y="160" text-anchor="middle">INCONVENIENT EVIDENCE</text>
  <text class="body" x="600" y="193" text-anchor="middle">cost rose · user signal weakened</text>
  <path class="line" d="M600 212V256"/>
  <path class="line" d="M600 256H304V292" marker-end="url(#scout-map-arrow)"/>
  <path class="line" d="M600 256H896V292" marker-end="url(#scout-map-arrow)"/>

  <rect class="card" x="54" y="300" width="500" height="328" rx="28" fill="#f3a8a0"/>
  <rect x="112" y="330" width="384" height="58" rx="29" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="304" y="368" text-anchor="middle">DEFEND THE POSITION</text>
  <rect x="112" y="420" width="384" height="94" rx="20" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="heading" x="304" y="459" text-anchor="middle">FILTER FOR SUPPORT</text>
  <text class="body" x="304" y="493" text-anchor="middle">discount the friction</text>
  <path class="line" d="M304 514V548" marker-end="url(#scout-map-arrow)"/>
  <text class="heading" x="304" y="590" text-anchor="middle">PREFERRED STORY</text>
  <text class="small" x="304" y="617" text-anchor="middle">MAP STAYS STILL</text>

  <rect class="card" x="646" y="300" width="500" height="328" rx="28" fill="#bdd9bf"/>
  <rect x="704" y="330" width="384" height="58" rx="29" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="896" y="368" text-anchor="middle">IMPROVE THE MAP</text>
  <rect x="704" y="420" width="384" height="94" rx="20" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="heading" x="896" y="459" text-anchor="middle">INSPECT BOTH SIDES</text>
  <text class="body" x="896" y="493" text-anchor="middle">what fits? what conflicts?</text>
  <path class="line" d="M896 514V548" marker-end="url(#scout-map-arrow)"/>
  <text class="heading" x="896" y="590" text-anchor="middle">REVISED PICTURE</text>
  <text class="small" x="896" y="617" text-anchor="middle">MAP CAN MOVE</text>

  <rect x="258" y="664" width="684" height="62" rx="31" fill="#d8cce8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="704" text-anchor="middle" font-weight="700">ASK WHAT WOULD CHANGE THE CURRENT VIEW</text>
</svg>
