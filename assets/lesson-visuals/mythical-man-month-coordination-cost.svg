<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="mmm-coordination-title mmm-coordination-desc">
  <title id="mmm-coordination-title">Added people help only when useful parallel work exceeds coordination cost</title>
  <desc id="mmm-coordination-desc">The left panel shows three independent work lanes producing useful parallel progress. The right panel shows a tightly coupled late project where two newcomers first require onboarding and add communication paths among the existing team. A bottom decision gate asks whether new capacity can change the critical path after those costs.</desc>
  <defs>
    <marker id="mmm-coordination-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #18211d; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="324" y="28" width="552" height="62" rx="31" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="600" y="68" text-anchor="middle">ADDING PEOPLE CHANGES THE SYSTEM</text>
  <line x1="600" y1="118" x2="600" y2="586" stroke="#18211d" stroke-width="3" stroke-dasharray="10 12"/>

  <rect x="50" y="118" width="500" height="60" rx="30" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="300" y="157" text-anchor="middle">STABLE, INDEPENDENT WORK</text>
  <rect class="card" x="60" y="226" width="142" height="76" rx="18" fill="#b8d5e5"/>
  <rect class="card" x="60" y="338" width="142" height="76" rx="18" fill="#e9d17f"/>
  <rect class="card" x="60" y="450" width="142" height="76" rx="18" fill="#d8cce8"/>
  <text class="heading" x="131" y="274" text-anchor="middle">LANE A</text>
  <text class="heading" x="131" y="386" text-anchor="middle">LANE B</text>
  <text class="heading" x="131" y="498" text-anchor="middle">LANE C</text>
  <path class="line" d="M202 264H326" marker-end="url(#mmm-coordination-arrow)"/>
  <path class="line" d="M202 376H326" marker-end="url(#mmm-coordination-arrow)"/>
  <path class="line" d="M202 488H326" marker-end="url(#mmm-coordination-arrow)"/>
  <rect class="card" x="330" y="226" width="190" height="76" rx="18" fill="#fffdf8"/>
  <rect class="card" x="330" y="338" width="190" height="76" rx="18" fill="#fffdf8"/>
  <rect class="card" x="330" y="450" width="190" height="76" rx="18" fill="#fffdf8"/>
  <text class="body" x="425" y="274" text-anchor="middle">useful output</text>
  <text class="body" x="425" y="386" text-anchor="middle">useful output</text>
  <text class="body" x="425" y="498" text-anchor="middle">useful output</text>
  <text class="small" x="300" y="568" text-anchor="middle">CAPACITY CHANGES THE DATE</text>

  <rect x="650" y="118" width="500" height="60" rx="30" fill="#f5c79d" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="900" y="157" text-anchor="middle">LATE, TIGHTLY COUPLED WORK</text>
  <text class="small" x="744" y="226" text-anchor="middle">CURRENT TEAM</text>
  <circle cx="704" cy="292" r="42" fill="#b8d5e5" stroke="#18211d" stroke-width="4"/>
  <circle cx="822" cy="292" r="42" fill="#b8d5e5" stroke="#18211d" stroke-width="4"/>
  <circle cx="763" cy="398" r="42" fill="#b8d5e5" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="704" y="302" text-anchor="middle">A</text>
  <text class="heading" x="822" y="302" text-anchor="middle">B</text>
  <text class="heading" x="763" y="408" text-anchor="middle">C</text>
  <path class="thin" d="M746 292H780M725 328L742 363M801 328L784 363"/>

  <text class="small" x="1020" y="226" text-anchor="middle">NEW PEOPLE</text>
  <circle cx="966" cy="292" r="42" fill="#e9d17f" stroke="#18211d" stroke-width="4"/>
  <circle cx="1076" cy="292" r="42" fill="#e9d17f" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="966" y="302" text-anchor="middle">D</text>
  <text class="heading" x="1076" y="302" text-anchor="middle">E</text>
  <path class="thin" d="M847 292H924M864 314L933 365M864 270L1037 270M805 430L941 324M805 430L1046 324M1008 292H1034"/>
  <rect class="card" x="914" y="376" width="214" height="110" rx="22" fill="#f3a8a0"/>
  <text class="heading" x="1021" y="418" text-anchor="middle">ONBOARD</text>
  <text class="body" x="1021" y="454" text-anchor="middle">before output</text>
  <path class="line" d="M966 334V368" marker-end="url(#mmm-coordination-arrow)"/>
  <path class="line" d="M1076 334V368" marker-end="url(#mmm-coordination-arrow)"/>
  <text class="small" x="900" y="568" text-anchor="middle">LEARNING + MORE CONNECTIONS</text>

  <rect x="132" y="620" width="936" height="104" rx="28" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="600" y="664" text-anchor="middle">TEST THE CRITICAL PATH</text>
  <text class="body" x="600" y="704" text-anchor="middle">Can independent output exceed onboarding and coordination before the deadline?</text>
</svg>
