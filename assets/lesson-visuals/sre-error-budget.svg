<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="sre-budget-title sre-budget-desc">
  <title id="sre-budget-title">An error budget turns a reliability target into a change policy</title>
  <desc id="sre-budget-desc">A service level indicator measures user-visible behaviour. A service level objective sets the target over a window. The objective implies an error budget, which is the tolerated unreliability. Tracking budget consumption against team policy leads either to controlled change when there is headroom or to reliability work when consumption is too fast or the budget is exhausted.</desc>
  <defs>
    <marker id="sre-budget-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0L12 6L0 12z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="242" y="24" width="716" height="58" rx="29" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="62" text-anchor="middle" font-weight="700">MEASURE, SET A TARGET, THEN CHOOSE HOW TO ACT</text>

  <path class="line" d="M345 196H420" marker-end="url(#sre-budget-arrow)"/>
  <path class="line" d="M780 196H855" marker-end="url(#sre-budget-arrow)"/>

  <rect class="card" x="45" y="112" width="300" height="168" rx="22" fill="#b8d5e5"/>
  <text class="heading" x="195" y="162" text-anchor="middle">SLI</text>
  <text class="small" x="195" y="202" text-anchor="middle">MEASURED BEHAVIOUR</text>
  <text class="body" x="195" y="238" text-anchor="middle">User-visible availability,</text>
  <text class="body" x="195" y="268" text-anchor="middle">latency or correctness</text>

  <rect class="card" x="420" y="112" width="360" height="168" rx="22" fill="#d8cce8"/>
  <text class="heading" x="600" y="162" text-anchor="middle">SLO</text>
  <text class="small" x="600" y="202" text-anchor="middle">TARGET OVER A WINDOW</text>
  <text class="body" x="600" y="238" text-anchor="middle">Reliability level the service</text>
  <text class="body" x="600" y="268" text-anchor="middle">aims to meet</text>

  <rect class="card" x="855" y="112" width="300" height="168" rx="22" fill="#e9d17f"/>
  <text class="compact" x="1005" y="158" text-anchor="middle">ERROR BUDGET</text>
  <text class="small" x="1005" y="202" text-anchor="middle">IMPLIED BY THE SLO</text>
  <text class="body" x="1005" y="238" text-anchor="middle">Tolerated unreliability</text>
  <text class="body" x="1005" y="268" text-anchor="middle">within that window</text>

  <path class="line" d="M1005 280V316H600V344" marker-end="url(#sre-budget-arrow)"/>
  <rect class="card" x="370" y="344" width="460" height="92" rx="22" fill="#fffdf8"/>
  <text class="compact" x="600" y="382" text-anchor="middle">TRACK ACTUAL CONSUMPTION</text>
  <text class="body" x="600" y="416" text-anchor="middle">Compare the trend with the team's policy</text>

  <path class="line" d="M600 436V470" marker-end="url(#sre-budget-arrow)"/>
  <path d="M600 470L770 534L600 598L430 534z" fill="#f5c79d" stroke="#18211d" stroke-width="4"/>
  <text class="compact" x="600" y="524" text-anchor="middle">BUDGET USE</text>
  <text class="compact" x="600" y="556" text-anchor="middle">WITHIN POLICY?</text>

  <path class="line" d="M430 534H270V612" marker-end="url(#sre-budget-arrow)"/>
  <text class="small" x="270" y="510" text-anchor="middle">YES, WITH HEADROOM</text>
  <rect class="card" x="55" y="612" width="430" height="116" rx="22" fill="#bdd9bf"/>
  <text class="compact" x="270" y="656" text-anchor="middle">CAPACITY TO CHANGE</text>
  <text class="small" x="270" y="690" text-anchor="middle" font-weight="400">Release in small steps</text>
  <text class="small" x="270" y="718" text-anchor="middle" font-weight="400">Keep measuring the SLI</text>

  <path class="line" d="M770 534H930V612" marker-end="url(#sre-budget-arrow)"/>
  <text class="small" x="930" y="510" text-anchor="middle">NO, TOO FAST OR EXHAUSTED</text>
  <rect x="715" y="612" width="430" height="116" rx="22" fill="#f5c79d" stroke="#d86136" stroke-width="4"/>
  <text class="compact" x="930" y="656" text-anchor="middle" fill="#d86136">RELIABILITY TAKES PRIORITY</text>
  <text class="small" x="930" y="690" text-anchor="middle" font-weight="400">Reduce risky change</text>
  <text class="small" x="930" y="718" text-anchor="middle" font-weight="400">Invest in reliability work</text>
</svg>
