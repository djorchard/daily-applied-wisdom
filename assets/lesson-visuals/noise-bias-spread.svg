<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="noise-bias-title noise-bias-desc">
<title id="noise-bias-title">Bias shifts the centre while noise widens the spread</title>
<desc id="noise-bias-desc">Three conceptual targets compare judgements that are accurate and consistent, biased but consistent, and centred on average but noisy. The noisy target shows that a reasonable average can conceal inconsistent individual outcomes.</desc>
<defs>
  <style>text {font-family: Arial, sans-serif; fill: #18211d;}</style>
</defs>
<rect width="1200" height="760" fill="#faf7f0"/>
<text x="600" y="62" text-anchor="middle" font-size="34" font-weight="700">LOOK AT CENTRE AND SPREAD</text>
<g transform="translate(200 310)">
  <circle r="142" fill="#ffffff" stroke="#18211d" stroke-width="3"/>
  <circle r="96" fill="none" stroke="#a9c7df" stroke-width="22"/>
  <circle r="48" fill="#e9d17f" stroke="#18211d" stroke-width="3"/>
  <path d="M-142 0H142M0-142V142" stroke="#18211d" stroke-width="2" opacity="0.45"/>
  <circle cx="-13" cy="-8" r="10" fill="#7b4f83"/>
  <circle cx="15" cy="10" r="10" fill="#7b4f83"/>
  <circle cx="8" cy="-16" r="10" fill="#7b4f83"/>
  <circle cx="-5" cy="17" r="10" fill="#7b4f83"/>
  <circle cx="17" cy="-2" r="10" fill="#7b4f83"/>
</g>
<g transform="translate(600 310)">
  <circle r="142" fill="#ffffff" stroke="#18211d" stroke-width="3"/>
  <circle r="96" fill="none" stroke="#a9c7df" stroke-width="22"/>
  <circle r="48" fill="#e9d17f" stroke="#18211d" stroke-width="3"/>
  <path d="M-142 0H142M0-142V142" stroke="#18211d" stroke-width="2" opacity="0.45"/>
  <circle cx="72" cy="-67" r="10" fill="#c75b39"/>
  <circle cx="91" cy="-52" r="10" fill="#c75b39"/>
  <circle cx="75" cy="-43" r="10" fill="#c75b39"/>
  <circle cx="100" cy="-70" r="10" fill="#c75b39"/>
  <circle cx="88" cy="-84" r="10" fill="#c75b39"/>
</g>
<g transform="translate(1000 310)">
  <circle r="142" fill="#ffffff" stroke="#18211d" stroke-width="3"/>
  <circle r="96" fill="none" stroke="#a9c7df" stroke-width="22"/>
  <circle r="48" fill="#e9d17f" stroke="#18211d" stroke-width="3"/>
  <path d="M-142 0H142M0-142V142" stroke="#18211d" stroke-width="2" opacity="0.45"/>
  <circle cx="-90" cy="-74" r="10" fill="#2f6f62"/>
  <circle cx="94" cy="-47" r="10" fill="#2f6f62"/>
  <circle cx="-65" cy="91" r="10" fill="#2f6f62"/>
  <circle cx="78" cy="77" r="10" fill="#2f6f62"/>
  <circle cx="-18" cy="-10" r="10" fill="#2f6f62"/>
</g>
<text x="200" y="500" text-anchor="middle" font-size="27" font-weight="700">CLOSE CENTRE</text>
<text x="200" y="535" text-anchor="middle" font-size="25">Narrow spread</text>
<text x="600" y="500" text-anchor="middle" font-size="27" font-weight="700">SHIFTED CENTRE</text>
<text x="600" y="535" text-anchor="middle" font-size="25">Bias</text>
<text x="1000" y="500" text-anchor="middle" font-size="27" font-weight="700">WIDE SPREAD</text>
<text x="1000" y="535" text-anchor="middle" font-size="25">Noise</text>
<rect x="195" y="595" width="810" height="108" rx="20" fill="#d7c4df" stroke="#18211d" stroke-width="3"/>
<text x="600" y="640" text-anchor="middle" font-size="27" font-weight="700">AN ACCEPTABLE AVERAGE CAN STILL HIDE</text>
<text x="600" y="678" text-anchor="middle" font-size="27">inconsistent outcomes for individual cases.</text>
</svg>
