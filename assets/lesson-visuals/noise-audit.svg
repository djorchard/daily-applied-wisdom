<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="noise-audit-title noise-audit-desc">
<title id="noise-audit-title">A noise audit reveals hidden disagreement</title>
<desc id="noise-audit-desc">Four connected stages show shared realistic cases, independent judgements, a revealed spread of scores, and examination of the widest gap. A warning path shows that discussion before scoring can conceal the original disagreement.</desc>
<defs>
  <style>text {font-family: Arial, sans-serif; fill: #18211d;}</style>
  <marker id="noise-audit-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#18211d"/></marker>
</defs>
<rect width="1200" height="760" fill="#faf7f0"/>
<text x="600" y="62" text-anchor="middle" font-size="34" font-weight="700">MEASURE BEFORE DISCUSSION</text>
<path d="M282 278H335M585 278H638M888 278H941" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#noise-audit-arrow)"/>
<rect x="40" y="145" width="240" height="265" rx="20" fill="#a9c7df" stroke="#18211d" stroke-width="3"/>
<text x="160" y="188" text-anchor="middle" font-size="24" font-weight="700">1. SHARED CASES</text>
<rect x="82" y="222" width="156" height="116" rx="10" fill="#ffffff" stroke="#18211d" stroke-width="3"/>
<line x1="106" y1="251" x2="214" y2="251" stroke="#18211d" stroke-width="4"/>
<line x1="106" y1="280" x2="214" y2="280" stroke="#18211d" stroke-width="4"/>
<line x1="106" y1="309" x2="184" y2="309" stroke="#18211d" stroke-width="4"/>
<text x="160" y="377" text-anchor="middle" font-size="23">One shared prompt</text>
<rect x="345" y="145" width="240" height="265" rx="20" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
<text x="465" y="188" text-anchor="middle" font-size="24" font-weight="700">2. SCORE ALONE</text>
<circle cx="400" cy="270" r="34" fill="#ffffff" stroke="#18211d" stroke-width="3"/>
<circle cx="465" cy="270" r="34" fill="#ffffff" stroke="#18211d" stroke-width="3"/>
<circle cx="530" cy="270" r="34" fill="#ffffff" stroke="#18211d" stroke-width="3"/>
<text x="400" y="279" text-anchor="middle" font-size="27" font-weight="700">2</text>
<text x="465" y="279" text-anchor="middle" font-size="27" font-weight="700">5</text>
<text x="530" y="279" text-anchor="middle" font-size="27" font-weight="700">8</text>
<text x="465" y="362" text-anchor="middle" font-size="22">Private first</text>
<text x="465" y="391" text-anchor="middle" font-size="22">views</text>
<rect x="650" y="145" width="240" height="265" rx="20" fill="#e9d17f" stroke="#18211d" stroke-width="3"/>
<text x="770" y="188" text-anchor="middle" font-size="24" font-weight="700">3. SHOW SPREAD</text>
<line x1="700" y1="285" x2="840" y2="285" stroke="#18211d" stroke-width="5"/>
<line x1="700" y1="265" x2="700" y2="305" stroke="#18211d" stroke-width="5"/>
<line x1="840" y1="265" x2="840" y2="305" stroke="#18211d" stroke-width="5"/>
<circle cx="700" cy="285" r="12" fill="#7b4f83"/>
<circle cx="770" cy="285" r="12" fill="#7b4f83"/>
<circle cx="840" cy="285" r="12" fill="#7b4f83"/>
<text x="770" y="362" text-anchor="middle" font-size="22">Reveal the</text>
<text x="770" y="391" text-anchor="middle" font-size="22">range</text>
<rect x="955" y="145" width="205" height="265" rx="20" fill="#e8b89c" stroke="#18211d" stroke-width="3"/>
<text x="1058" y="188" text-anchor="middle" font-size="24" font-weight="700">4. EXPLAIN GAP</text>
<text x="1058" y="247" text-anchor="middle" font-size="25">Evidence?</text>
<text x="1058" y="292" text-anchor="middle" font-size="25">Rule?</text>
<text x="1058" y="337" text-anchor="middle" font-size="25">Scale?</text>
<text x="1058" y="362" text-anchor="middle" font-size="22">Then test</text>
<text x="1058" y="391" text-anchor="middle" font-size="22">one remedy</text>
<path d="M465 425V504H770" fill="none" stroke="#c75b39" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#noise-audit-arrow)"/>
<rect x="330" y="520" width="610" height="143" rx="20" fill="#ffffff" stroke="#c75b39" stroke-width="4"/>
<text x="635" y="563" text-anchor="middle" font-size="27" font-weight="700">AVOID THE CONSENSUS SHORTCUT</text>
<text x="635" y="604" text-anchor="middle" font-size="25">Discussion before scoring can pull answers together</text>
<text x="635" y="638" text-anchor="middle" font-size="25">and erase evidence of the original spread.</text>
<text x="600" y="723" text-anchor="middle" font-size="22">The audit diagnoses a process. It does not rank the people in it.</text>
</svg>
