<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="measurement-calibration-title measurement-calibration-desc">
  <title id="measurement-calibration-title">Build calibration through repeated feedback</title>
  <desc id="measurement-calibration-desc">A loop moves from setting a confidence range to revealing the outcome, scoring whether it fell inside, adjusting estimation habits and repeating across comparable questions.</desc>
  <defs>
    <marker id="measurement-calibration-arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0 0 L18 9 L0 18 Z" fill="#356987"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: .04em; }
      .body { font-size: 24px; }
      .small { font-size: 22px; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #356987; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="36" fill="#f5f1e8"/>
  <text x="70" y="68" class="label">CALIBRATION IS A REPEATED PRACTICE</text>

  <rect class="card" x="55" y="135" width="320" height="150" rx="24" fill="#e8e0f2"/>
  <text x="215" y="180" class="label" text-anchor="middle">1 · SET A RANGE</text>
  <text x="215" y="225" class="small" text-anchor="middle">State confidence</text>
  <text x="215" y="257" class="small" text-anchor="middle">before lookup</text>

  <rect class="card" x="440" y="135" width="320" height="150" rx="24" fill="#ead9cb"/>
  <text x="600" y="180" class="label" text-anchor="middle">2 · REVEAL OUTCOME</text>
  <text x="600" y="225" class="small" text-anchor="middle">Use comparable</text>
  <text x="600" y="257" class="small" text-anchor="middle">real results</text>

  <rect class="card" x="825" y="135" width="320" height="150" rx="24" fill="#f2d6a2"/>
  <text x="985" y="180" class="label" text-anchor="middle">3 · SCORE IT</text>
  <text x="985" y="225" class="small" text-anchor="middle">Inside or outside</text>
  <text x="985" y="257" class="small" text-anchor="middle">the interval?</text>

  <path class="line" d="M375 210 H424" marker-end="url(#measurement-calibration-arrow)"/>
  <path class="line" d="M760 210 H809" marker-end="url(#measurement-calibration-arrow)"/>

  <rect class="card" x="635" y="345" width="370" height="130" rx="24" fill="#dbe8e2"/>
  <text x="820" y="395" class="label" text-anchor="middle">4 · ADJUST HABITS</text>
  <text x="820" y="437" class="small" text-anchor="middle">Widen, narrow or decompose</text>

  <rect class="card" x="195" y="345" width="370" height="130" rx="24" fill="#d9e7f0"/>
  <text x="380" y="395" class="label" text-anchor="middle">5 · REPEAT</text>
  <text x="380" y="437" class="small" text-anchor="middle">Build a long-run record</text>

  <path class="line" d="M985 285 V320 Q985 330 955 340" marker-end="url(#measurement-calibration-arrow)"/>
  <path class="line" d="M635 410 H581" marker-end="url(#measurement-calibration-arrow)"/>
  <path class="line" d="M195 410 H130 Q95 410 95 375 V320 Q95 300 120 300 H175" marker-end="url(#measurement-calibration-arrow)"/>

  <rect class="card" x="115" y="555" width="970" height="130" rx="28" fill="#fffdf8"/>
  <text x="600" y="603" class="label" text-anchor="middle">A 90% RANGE IS NOT A GUARANTEE</text>
  <text x="600" y="645" class="small" text-anchor="middle">Across many comparable estimates, the containment rate</text>
  <text x="600" y="676" class="small" text-anchor="middle">should match the stated confidence.</text>
</svg>
