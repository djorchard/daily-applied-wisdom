<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="ftw-efficiency-title ftw-efficiency-desc">
  <title id="ftw-efficiency-title">Efficiency needs a boundary to create room</title>
  <desc id="ftw-efficiency-desc">The top flow shows an efficiency treadmill where faster completion draws an even larger queue into active work and loops back to pressure. The lower flow shows a fixed-volume system where an admission gate caps active work and sends recovered capacity toward quality, recovery or a chosen priority.</desc>
  <defs>
    <marker id="ftw-efficiency-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="324" y="26" width="552" height="62" rx="31" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="600" y="66" text-anchor="middle">SPEED DOES NOT CHOOSE THE LOAD</text>

  <text class="label" x="54" y="132">EFFICIENCY TREADMILL</text>
  <rect class="card" x="54" y="158" width="244" height="116" rx="24" fill="#f5c79d"/>
  <text class="heading" x="176" y="204" text-anchor="middle">QUEUE</text>
  <text class="body" x="176" y="242" text-anchor="middle">more arrives</text>
  <path class="line" d="M298 216H408" marker-end="url(#ftw-efficiency-arrow)"/>
  <rect class="card" x="430" y="158" width="282" height="116" rx="24" fill="#b8d5e5"/>
  <text class="heading" x="571" y="204" text-anchor="middle">FASTER FLOW</text>
  <text class="body" x="571" y="242" text-anchor="middle">higher throughput</text>
  <path class="line" d="M712 216H822" marker-end="url(#ftw-efficiency-arrow)"/>
  <rect class="card" x="844" y="158" width="302" height="116" rx="24" fill="#e9d17f"/>
  <text class="heading" x="995" y="204" text-anchor="middle">STILL FULL</text>
  <text class="body" x="995" y="242" text-anchor="middle">no lasting done</text>
  <path class="line" d="M995 274C995 332 176 332 176 278" marker-end="url(#ftw-efficiency-arrow)"/>
  <text class="small" x="600" y="350" text-anchor="middle">GAINED CAPACITY PULLS IN MORE DEMAND</text>

  <line x1="54" y1="392" x2="1146" y2="392" stroke="#18211d" stroke-width="3" stroke-dasharray="12 10"/>
  <text class="label" x="54" y="438">FIXED-VOLUME SYSTEM</text>
  <rect class="card" x="54" y="466" width="244" height="124" rx="24" fill="#fffdf8"/>
  <text class="heading" x="176" y="512" text-anchor="middle">DEMAND</text>
  <text class="body" x="176" y="550" text-anchor="middle">more is possible</text>
  <path class="line" d="M298 528H384" marker-end="url(#ftw-efficiency-arrow)"/>
  <rect class="card" x="406" y="448" width="238" height="160" rx="24" fill="#d7c4e8"/>
  <text class="small" x="525" y="490" text-anchor="middle">ADMISSION GATE</text>
  <text class="heading" x="525" y="536" text-anchor="middle">CAP ACTIVE</text>
  <text class="body" x="525" y="574" text-anchor="middle">choose what enters</text>
  <path class="line" d="M644 528H730" marker-end="url(#ftw-efficiency-arrow)"/>
  <rect class="card" x="752" y="466" width="394" height="124" rx="24" fill="#bdd9bf"/>
  <text class="heading" x="949" y="512" text-anchor="middle">RECOVERED CAPACITY</text>
  <text class="body" x="949" y="550" text-anchor="middle">quality · recovery · chosen work</text>

  <rect x="214" y="654" width="772" height="72" rx="26" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <text class="label" x="600" y="686" text-anchor="middle">BOUND INTAKE BEFORE INCREASING SPEED</text>
  <text class="body" x="600" y="714" text-anchor="middle">Then decide what the gain is for.</text>
</svg>
