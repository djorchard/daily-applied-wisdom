<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="crucial-test-your-story-title crucial-test-your-story-desc"><title id="crucial-test-your-story-title">TEST THE STORY BETWEEN EVENT AND REACTION</title><desc id="crucial-test-your-story-desc">An observed event branches into two possible interpretations, then both lead to an open question and an updated view.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#18211d}</style><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#18211d"/></marker></defs><rect width="1200" height="760" fill="#faf7f0"/><text x="600" y="65" text-anchor="middle" font-size="34">TEST THE STORY BETWEEN EVENT AND REACTION</text><rect x="40" y="225" width="285" height="170" rx="18" fill="#a9c7df" stroke="#18211d" stroke-width="3"/><text x="182" y="270" text-anchor="middle" font-size="25">OBSERVATION</text><text x="182" y="320" text-anchor="middle" font-size="26">Two demos</text><text x="182" y="357" text-anchor="middle" font-size="26">were cancelled</text><path d="M325 290H365V175H409" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#arrow)"/><path d="M365 290V410H409" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#arrow)"/><rect x="420" y="115" width="335" height="135" rx="18" fill="#e8b89c" stroke="#18211d" stroke-width="3"/><text x="587" y="160" text-anchor="middle" font-size="24">INTERPRETATION A</text><text x="587" y="207" text-anchor="middle" font-size="26">Support is fading</text><rect x="420" y="350" width="335" height="135" rx="18" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/><text x="587" y="395" text-anchor="middle" font-size="24">INTERPRETATION B</text><text x="587" y="442" text-anchor="middle" font-size="26">Schedule conflict</text><path d="M755 183H790V295H835" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#arrow)"/><path d="M755 418H790V295" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#arrow)"/><rect x="845" y="220" width="315" height="175" rx="18" fill="#e9d17f" stroke="#18211d" stroke-width="3"/><text x="1002" y="265" text-anchor="middle" font-size="24">ASK AND LISTEN</text><text x="1002" y="311" text-anchor="middle" font-size="26">What changed?</text><text x="1002" y="355" text-anchor="middle" font-size="24">What am I missing?</text><path d="M1002 395V554H690" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#arrow)"/><rect x="335" y="515" width="345" height="100" rx="18" fill="#ffffff" stroke="#18211d" stroke-width="3"/><text x="507" y="555" text-anchor="middle" font-size="25">UPDATE YOUR VIEW</text><text x="507" y="591" text-anchor="middle" font-size="24">Use the new evidence</text><text x="600" y="687" text-anchor="middle" font-size="25">Treat certainty about a motive as a prompt to investigate,</text><text x="600" y="721" text-anchor="middle" font-size="25">not as evidence that the motive is known.</text></svg>
