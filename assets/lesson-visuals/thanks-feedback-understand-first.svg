<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="tff-understand-title tff-understand-desc">
  <title id="tff-understand-title">Turn two partial stories into a shared feedback map</title>
  <desc id="tff-understand-desc">The receiver's story of intention and context and the giver's story of impact and context feed into a four-part map: observation, interpretation, requested change and expected effect. The map then leads to four legitimate choices: adopt, test, seek another view or set a boundary. A bottom band states that understanding precedes agreement.</desc>
  <defs>
    <marker id="tff-understand-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="290" y="28" width="620" height="62" rx="31" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="600" y="68" text-anchor="middle">MOVE FROM A LABEL TO A SHARED MAP</text>

  <rect class="card" x="38" y="142" width="282" height="178" rx="26" fill="#b8d5e5"/>
  <text class="heading" x="179" y="188" text-anchor="middle">MY STORY</text>
  <text class="body" x="179" y="234" text-anchor="middle">intent I know</text>
  <text class="body" x="179" y="272" text-anchor="middle">context I noticed</text>
  <text class="small" x="179" y="304" text-anchor="middle">PARTIAL VIEW</text>

  <rect class="card" x="38" y="372" width="282" height="178" rx="26" fill="#f5c79d"/>
  <text class="heading" x="179" y="418" text-anchor="middle">THEIR STORY</text>
  <text class="body" x="179" y="464" text-anchor="middle">impact they saw</text>
  <text class="body" x="179" y="502" text-anchor="middle">context they noticed</text>
  <text class="small" x="179" y="534" text-anchor="middle">PARTIAL VIEW</text>

  <path class="line" d="M320 231H374V266H416" marker-end="url(#tff-understand-arrow)"/>
  <path class="line" d="M320 461H374V426H416" marker-end="url(#tff-understand-arrow)"/>

  <rect class="card" x="420" y="116" width="410" height="474" rx="30" fill="#fffdf8"/>
  <text class="label" x="625" y="158" text-anchor="middle">UNDERSTANDING MAP</text>
  <rect x="452" y="188" width="346" height="74" rx="18" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
  <text class="heading" x="625" y="220" text-anchor="middle">OBSERVATION</text>
  <text class="body" x="625" y="248" text-anchor="middle">What happened?</text>
  <rect x="452" y="282" width="346" height="74" rx="18" fill="#d8cce8" stroke="#18211d" stroke-width="3"/>
  <text class="heading" x="625" y="314" text-anchor="middle">INTERPRETATION</text>
  <text class="body" x="625" y="342" text-anchor="middle">What did it mean?</text>
  <rect x="452" y="376" width="346" height="74" rx="18" fill="#b8d5e5" stroke="#18211d" stroke-width="3"/>
  <text class="heading" x="625" y="408" text-anchor="middle">REQUESTED CHANGE</text>
  <text class="body" x="625" y="436" text-anchor="middle">Do what differently?</text>
  <rect x="452" y="470" width="346" height="74" rx="18" fill="#e9d17f" stroke="#18211d" stroke-width="3"/>
  <text class="heading" x="625" y="502" text-anchor="middle">EXPECTED EFFECT</text>
  <text class="body" x="625" y="530" text-anchor="middle">What should improve?</text>

  <path class="line" d="M830 353H868" marker-end="url(#tff-understand-arrow)"/>
  <rect class="card" x="872" y="142" width="290" height="408" rx="28" fill="#bdd9bf"/>
  <text class="label" x="1017" y="188" text-anchor="middle">DECIDE AFTERWARD</text>
  <rect x="888" y="220" width="258" height="56" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <rect x="888" y="294" width="258" height="56" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <rect x="888" y="368" width="258" height="56" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <rect x="888" y="442" width="258" height="56" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="heading" x="1017" y="257" text-anchor="middle">ADOPT</text>
  <text class="heading" x="1017" y="331" text-anchor="middle">TEST</text>
  <text class="small" x="1017" y="402" text-anchor="middle">SEEK SECOND VIEW</text>
  <text class="small" x="1017" y="476" text-anchor="middle">SET A BOUNDARY</text>
  <text class="body" x="1017" y="528" text-anchor="middle">Agreement is a choice</text>

  <rect x="170" y="636" width="860" height="88" rx="28" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="600" y="674" text-anchor="middle">UNDERSTANDING PRECEDES AGREEMENT</text>
  <text class="body" x="600" y="706" text-anchor="middle">Make the data and requested future visible before deciding.</text>
</svg>
