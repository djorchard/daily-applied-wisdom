<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="make-stick-spacing-title make-stick-spacing-desc">
  <title id="make-stick-spacing-title">Compare blocked practice with spaced and mixed practice</title>
  <desc id="make-stick-spacing-desc">A blocked lane repeats one labelled method in one session and feels fluent. A spaced and mixed lane returns on later days, mixes related cases and requires the learner to choose a method from the cues before executing it. The comparison is qualitative rather than a claim about effect size.</desc>
  <defs>
    <marker id="make-stick-spacing-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="170" y="18" width="860" height="72" rx="36" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="62" text-anchor="middle" font-weight="700">PRACTISE THE FUTURE DECISION, NOT ONLY THE FAMILIAR MOVE</text>

  <text class="small" x="45" y="132">BLOCKED IN ONE SESSION</text>
  <rect class="card" x="45" y="150" width="1110" height="220" rx="30" fill="#f5c79d"/>
  <rect x="90" y="198" width="180" height="112" rx="24" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="compact" x="180" y="240" text-anchor="middle">LABEL: A</text>
  <text class="body" x="180" y="278" text-anchor="middle">Method supplied</text>
  <path class="line" d="M270 254H340" marker-end="url(#make-stick-spacing-arrow)"/>
  <circle cx="400" cy="254" r="48" fill="#b8d5e5" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="400" y="264" text-anchor="middle">A</text>
  <circle cx="530" cy="254" r="48" fill="#b8d5e5" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="530" y="264" text-anchor="middle">A</text>
  <circle cx="660" cy="254" r="48" fill="#b8d5e5" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="660" y="264" text-anchor="middle">A</text>
  <path class="line" d="M708 254H790" marker-end="url(#make-stick-spacing-arrow)"/>
  <rect x="810" y="198" width="300" height="112" rx="24" fill="#fffdf8" stroke="#d86136" stroke-width="4"/>
  <text class="compact" x="960" y="240" text-anchor="middle">SMOOTH EXECUTION</text>
  <text class="body" x="960" y="278" text-anchor="middle">Selection was not tested</text>

  <text class="small" x="45" y="430">SPACED AND MIXED ACROSS LATER SESSIONS</text>
  <rect class="card" x="45" y="448" width="1110" height="250" rx="30" fill="#bdd9bf"/>

  <text class="small" x="95" y="493">DAY 1</text>
  <circle cx="150" cy="550" r="42" fill="#b8d5e5" stroke="#18211d" stroke-width="4"/>
  <text class="compact" x="150" y="559" text-anchor="middle">A</text>
  <circle cx="250" cy="550" r="42" fill="#e9d17f" stroke="#18211d" stroke-width="4"/>
  <text class="compact" x="250" y="559" text-anchor="middle">B</text>

  <path class="line" d="M300 550H355" marker-end="url(#make-stick-spacing-arrow)"/>
  <text class="small" x="370" y="493">LATER</text>
  <circle cx="430" cy="550" r="42" fill="#d8cce8" stroke="#18211d" stroke-width="4"/>
  <text class="compact" x="430" y="559" text-anchor="middle">C</text>
  <circle cx="530" cy="550" r="42" fill="#e9d17f" stroke="#18211d" stroke-width="4"/>
  <text class="compact" x="530" y="559" text-anchor="middle">B</text>

  <path class="line" d="M580 550H635" marker-end="url(#make-stick-spacing-arrow)"/>
  <text class="small" x="650" y="493">LATER</text>
  <circle cx="710" cy="550" r="42" fill="#b8d5e5" stroke="#18211d" stroke-width="4"/>
  <text class="compact" x="710" y="559" text-anchor="middle">A</text>
  <circle cx="810" cy="550" r="42" fill="#d8cce8" stroke="#18211d" stroke-width="4"/>
  <text class="compact" x="810" y="559" text-anchor="middle">C</text>

  <path class="line" d="M860 550H915" marker-end="url(#make-stick-spacing-arrow)"/>
  <rect x="930" y="495" width="180" height="112" rx="24" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <text class="compact" x="1020" y="535" text-anchor="middle">CHOOSE</text>
  <text class="body" x="1020" y="569" text-anchor="middle">Read cues, then</text>
  <text class="body" x="1020" y="598" text-anchor="middle">apply a method</text>

  <rect x="310" y="626" width="580" height="48" rx="24" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="658" text-anchor="middle" font-weight="700">RETURN AFTER A GAP + MIX RELATED CASES</text>

  <text class="small" x="600" y="735" text-anchor="middle">QUALITATIVE MECHANISM: THE USEFUL GAP DEPENDS ON THE LEARNING GOAL</text>
</svg>
