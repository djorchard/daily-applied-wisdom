<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="index-policy-title index-policy-desc">
  <title id="index-policy-title">A one-card policy filters financial noise before money moves</title>
  <desc id="index-policy-desc">Headlines, product pitches and social pressure enter from the left. A central index card tests each input against a goal, action threshold, evidence requirement and review trigger. The card then routes the decision to act, defer or seek qualified advice.</desc>
  <defs>
    <marker id="policy-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .label { font-size: 25px; font-weight: 700; }
      .body { font-size: 23px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="214" y="20" width="772" height="64" rx="32" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="61" text-anchor="middle">NEW INFORMATION MUST PASS THE HOUSEHOLD'S OWN TEST</text>

  <text class="small" x="163" y="130" text-anchor="middle">CONTINUOUS INPUTS</text>
  <rect class="card" x="40" y="160" width="246" height="106" rx="24" fill="#f8e0d2"/>
  <text class="label" x="163" y="205" text-anchor="middle">HEADLINES</text>
  <text class="body" x="163" y="239" text-anchor="middle">fear · excitement</text>
  <rect class="card" x="40" y="316" width="246" height="106" rx="24" fill="#e9d17f"/>
  <text class="label" x="163" y="361" text-anchor="middle">PRODUCT PITCH</text>
  <text class="body" x="163" y="395" text-anchor="middle">urgency · complexity</text>
  <rect class="card" x="40" y="472" width="246" height="106" rx="24" fill="#d8cce8"/>
  <text class="label" x="163" y="517" text-anchor="middle">SOCIAL PROOF</text>
  <text class="body" x="163" y="551" text-anchor="middle">everyone is doing it</text>

  <path class="line" d="M286 213H350" marker-end="url(#policy-arrow)"/>
  <path class="line" d="M286 369H350" marker-end="url(#policy-arrow)"/>
  <path class="line" d="M286 525H350" marker-end="url(#policy-arrow)"/>

  <path d="M370 117H784L842 175V642H370Z" fill="#fffdf8" stroke="#18211d" stroke-width="5" stroke-linejoin="round"/>
  <path d="M784 117V175H842" fill="#f5c79d" stroke="#18211d" stroke-width="5" stroke-linejoin="round"/>
  <rect x="402" y="145" width="348" height="50" rx="25" fill="#c35f43"/>
  <text class="small" x="576" y="178" text-anchor="middle" fill="#fffdf8">ONE-CARD POLICY</text>

  <text class="small" x="416" y="242">GOAL</text>
  <line x1="416" y1="260" x2="792" y2="260" stroke="#9aaaa1" stroke-width="3"/>
  <text class="body" x="416" y="295">What job must this money do?</text>

  <text class="small" x="416" y="354">ACTION THRESHOLD</text>
  <line x1="416" y1="372" x2="792" y2="372" stroke="#9aaaa1" stroke-width="3"/>
  <text class="body" x="416" y="407">What condition would justify action?</text>

  <text class="small" x="416" y="458">EVIDENCE</text>
  <line x1="416" y1="476" x2="792" y2="476" stroke="#9aaaa1" stroke-width="3"/>
  <text class="body" x="416" y="509">Which official document or fact</text>
  <text class="body" x="416" y="538">must be checked?</text>

  <text class="small" x="416" y="578">REVIEW TRIGGER</text>
  <line x1="416" y1="596" x2="792" y2="596" stroke="#9aaaa1" stroke-width="3"/>
  <text class="body" x="416" y="631">When does the rule deserve revision?</text>

  <path class="line" d="M842 255H905" marker-end="url(#policy-arrow)"/>
  <path class="line" d="M842 379H905" marker-end="url(#policy-arrow)"/>
  <path class="line" d="M842 503H905" marker-end="url(#policy-arrow)"/>
  <text class="small" x="1033" y="130" text-anchor="middle">VISIBLE OUTCOMES</text>
  <rect class="card" x="920" y="194" width="240" height="106" rx="24" fill="#dcead9"/>
  <text class="heading" x="1040" y="246" text-anchor="middle">ACT</text>
  <text class="body" x="1040" y="278" text-anchor="middle">criteria met</text>
  <rect class="card" x="920" y="332" width="240" height="106" rx="24" fill="#b8d5e5"/>
  <text class="heading" x="1040" y="384" text-anchor="middle">DEFER</text>
  <text class="body" x="1040" y="416" text-anchor="middle">evidence missing</text>
  <rect class="card" x="920" y="470" width="240" height="126" rx="24" fill="#e9d17f"/>
  <text class="label" x="1040" y="516" text-anchor="middle">SEEK ADVICE</text>
  <text class="body" x="1040" y="551" text-anchor="middle">complexity exceeds</text>
  <text class="body" x="1040" y="580" text-anchor="middle">the card's scope</text>

  <rect class="card" x="156" y="692" width="888" height="50" rx="25" fill="#fffdf8"/>
  <text class="small" x="600" y="725" text-anchor="middle">THE POLICY CAN CHANGE; THE PITCH CANNOT CHANGE IT SILENTLY</text>
</svg>
