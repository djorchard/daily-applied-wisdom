<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="accelerate-information-title accelerate-information-desc">
  <title id="accelerate-information-title">Compare blocked and generative information flow</title>
  <desc id="accelerate-information-desc">One bad-news signal follows two paths. In the blocked path, the messenger is blamed, the risk is hidden and the failure repeats. In the generative path, the messenger is supported, the risk receives shared inquiry and a safer experiment changes the system.</desc>
  <defs>
    <marker id="accelerate-information-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="365" y="22" width="470" height="88" rx="28" fill="#e9d17f" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="600" y="61" text-anchor="middle">BAD NEWS ARRIVES</text>
  <text class="body" x="600" y="94" text-anchor="middle">A flaky test signals release risk</text>

  <path class="line" d="M530 110V145H300V175" marker-end="url(#accelerate-information-arrow)"/>
  <path class="line" d="M670 110V145H900V175" marker-end="url(#accelerate-information-arrow)"/>

  <text class="small" x="55" y="165">BLOCKED FLOW</text>
  <rect class="card" x="55" y="180" width="490" height="405" rx="30" fill="#f5c79d"/>
  <rect x="95" y="222" width="410" height="82" rx="20" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="compact" x="300" y="257" text-anchor="middle">MESSENGER BLAMED</text>
  <text class="body" x="300" y="287" text-anchor="middle">Reporting becomes costly</text>
  <path class="line" d="M300 304V340" marker-end="url(#accelerate-information-arrow)"/>
  <rect x="95" y="345" width="410" height="82" rx="20" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="compact" x="300" y="380" text-anchor="middle">RISK GOES QUIET</text>
  <text class="body" x="300" y="410" text-anchor="middle">The dashboard looks cleaner</text>
  <path class="line" d="M300 427V463" marker-end="url(#accelerate-information-arrow)"/>
  <rect x="95" y="468" width="410" height="82" rx="20" fill="#fffdf8" stroke="#d86136" stroke-width="4"/>
  <text class="compact" x="300" y="503" text-anchor="middle">FAILURE REPEATS</text>
  <text class="body" x="300" y="533" text-anchor="middle">The system did not learn</text>

  <text class="small" x="655" y="165">GENERATIVE FLOW</text>
  <rect class="card" x="655" y="180" width="490" height="405" rx="30" fill="#bdd9bf"/>
  <rect x="695" y="222" width="410" height="82" rx="20" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="compact" x="900" y="257" text-anchor="middle">MESSENGER SUPPORTED</text>
  <text class="body" x="900" y="287" text-anchor="middle">The weak signal stays visible</text>
  <path class="line" d="M900 304V340" marker-end="url(#accelerate-information-arrow)"/>
  <rect x="695" y="345" width="410" height="82" rx="20" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="compact" x="900" y="380" text-anchor="middle">SHARED INQUIRY</text>
  <text class="body" x="900" y="410" text-anchor="middle">Risk becomes a system question</text>
  <path class="line" d="M900 427V463" marker-end="url(#accelerate-information-arrow)"/>
  <rect x="695" y="468" width="410" height="82" rx="20" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="compact" x="900" y="503" text-anchor="middle">SAFER EXPERIMENT</text>
  <text class="body" x="900" y="533" text-anchor="middle">Learning changes the path</text>

  <rect class="card" x="120" y="630" width="960" height="88" rx="26" fill="#d8cce8"/>
  <text class="heading" x="600" y="671" text-anchor="middle">CULTURE IS VISIBLE IN WHAT HAPPENS NEXT</text>
  <text class="body" x="600" y="706" text-anchor="middle">The response determines whether risk becomes learning or goes underground</text>
</svg>
