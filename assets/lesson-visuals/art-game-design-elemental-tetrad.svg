<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="art-game-tetrad-title art-game-tetrad-desc">
  <title id="art-game-tetrad-title">Four game elements support one player experience</title>
  <desc id="art-game-tetrad-desc">Mechanics, story, aesthetics and technology connect around one intended player experience. Two-way arrows show that changing one element can reshape the possibilities and constraints of the other three.</desc>
  <defs>
    <marker id="art-game-tetrad-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="165" y="18" width="870" height="70" rx="35" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="61" text-anchor="middle" font-weight="700">COHERENCE LIVES BETWEEN ELEMENTS, NOT INSIDE ONE DEPARTMENT</text>

  <path class="line" d="M350 215L450 305" marker-start="url(#art-game-tetrad-arrow)" marker-end="url(#art-game-tetrad-arrow)"/>
  <path class="line" d="M850 215L750 305" marker-start="url(#art-game-tetrad-arrow)" marker-end="url(#art-game-tetrad-arrow)"/>
  <path class="line" d="M350 555L450 465" marker-start="url(#art-game-tetrad-arrow)" marker-end="url(#art-game-tetrad-arrow)"/>
  <path class="line" d="M850 555L750 465" marker-start="url(#art-game-tetrad-arrow)" marker-end="url(#art-game-tetrad-arrow)"/>

  <rect class="card" x="45" y="122" width="305" height="186" rx="28" fill="#f5c79d"/>
  <text class="heading" x="197" y="174" text-anchor="middle">MECHANICS</text>
  <text class="body" x="197" y="218" text-anchor="middle">Rules · goals · actions</text>
  <rect x="60" y="243" width="275" height="38" rx="19" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="197" y="270" text-anchor="middle">WHAT CAN HAPPEN?</text>

  <rect class="card" x="850" y="122" width="305" height="186" rx="28" fill="#d8cce8"/>
  <text class="heading" x="1002" y="174" text-anchor="middle">STORY</text>
  <text class="body" x="1002" y="218" text-anchor="middle">Events · roles · meaning</text>
  <rect x="865" y="243" width="275" height="38" rx="19" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="1002" y="270" text-anchor="middle">WHY DOES IT MATTER?</text>

  <rect class="card" x="45" y="462" width="305" height="186" rx="28" fill="#e9d17f"/>
  <text class="heading" x="197" y="514" text-anchor="middle">AESTHETICS</text>
  <text class="body" x="197" y="558" text-anchor="middle">Sight · sound · feel</text>
  <rect x="60" y="583" width="275" height="38" rx="19" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="197" y="610" text-anchor="middle">WHAT IS PERCEIVED?</text>

  <rect class="card" x="850" y="462" width="305" height="186" rx="28" fill="#b8d5e5"/>
  <text class="heading" x="1002" y="514" text-anchor="middle">TECHNOLOGY</text>
  <text class="body" x="1002" y="558" text-anchor="middle">Medium · input · capability</text>
  <rect x="865" y="583" width="275" height="38" rx="19" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="1002" y="610" text-anchor="middle">WHAT ENABLES IT?</text>

  <rect class="card" x="450" y="260" width="300" height="250" rx="42" fill="#bdd9bf"/>
  <circle cx="600" cy="340" r="42" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <circle cx="600" cy="340" r="13" fill="#d86136"/>
  <text class="compact" x="600" y="414" text-anchor="middle">PLAYER EXPERIENCE</text>
  <text class="body" x="600" y="454" text-anchor="middle">The shared design target</text>
  <text class="small" x="600" y="486" text-anchor="middle">NOT A FIFTH SILO</text>

  <rect x="180" y="687" width="840" height="56" rx="28" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="723" text-anchor="middle">CHANGE ONE ELEMENT · TRACE THE RIPPLE THROUGH THE OTHER THREE</text>
</svg>
