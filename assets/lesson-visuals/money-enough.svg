<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="money-enough-title money-enough-desc">
  <title id="money-enough-title">A defined stopping rule protects the purpose of money</title>
  <desc id="money-enough-desc">The upper path shows a goalpost repeatedly moving toward more comparison and escalating risk. The lower path sets an enough boundary and directs money toward security, time and choice.</desc>
  <defs>
    <marker id="money-enough-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 24px; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .card { stroke: #18211d; stroke-width: 4; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>

  <text class="heading" x="72" y="76">GOALPOST SET BY COMPARISON</text>
  <path class="line" d="M80 170H1080" marker-end="url(#money-enough-arrow)"/>
  <rect class="card" x="100" y="112" width="190" height="116" rx="18" fill="#b8d5e5"/>
  <text class="heading" x="195" y="160" text-anchor="middle">TARGET</text>
  <text class="body" x="195" y="196" text-anchor="middle">met</text>
  <rect class="card" x="385" y="112" width="190" height="116" rx="18" fill="#d8cce8"/>
  <text class="heading" x="480" y="160" text-anchor="middle">PEER</text>
  <text class="body" x="480" y="196" text-anchor="middle">has more</text>
  <rect class="card" x="640" y="112" width="250" height="116" rx="18" fill="#f5c79d"/>
  <text x="765" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#18211d">NEW TARGET</text>
  <text class="body" x="765" y="196" text-anchor="middle">moves again</text>
  <path d="M920 115L1060 225" stroke="#b54424" stroke-width="12" stroke-linecap="round"/>
  <path d="M1060 115L920 225" stroke="#b54424" stroke-width="12" stroke-linecap="round"/>
  <text class="heading" x="990" y="270" text-anchor="middle" fill="#b54424">MORE RISK</text>

  <line x1="60" y1="320" x2="1140" y2="320" stroke="#18211d" stroke-width="3" stroke-dasharray="12 12"/>

  <text class="heading" x="72" y="382">GOALPOST SET BY PURPOSE</text>
  <rect class="card" x="72" y="425" width="310" height="138" rx="22" fill="#e4cf8e"/>
  <text class="heading" x="227" y="477" text-anchor="middle">ENOUGH LINE</text>
  <text class="body" x="227" y="516" text-anchor="middle">reviewed deliberately</text>
  <path class="line" d="M382 494H520" marker-end="url(#money-enough-arrow)"/>
  <rect class="card" x="530" y="406" width="590" height="176" rx="24" fill="#bdd9bf"/>
  <text class="heading" x="825" y="450" text-anchor="middle">WHAT MONEY PROTECTS</text>
  <rect x="568" y="480" width="150" height="68" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="643" y="523" text-anchor="middle">SECURITY</text>
  <rect x="750" y="480" width="150" height="68" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="825" y="523" text-anchor="middle">TIME</text>
  <rect x="932" y="480" width="150" height="68" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="1007" y="523" text-anchor="middle">CHOICE</text>

  <rect class="card" x="205" y="633" width="790" height="80" rx="24" fill="#fffdf8"/>
  <text class="heading" x="600" y="682" text-anchor="middle">DECLINE UPSIDE THAT THREATENS THE PURPOSE</text>
</svg>
