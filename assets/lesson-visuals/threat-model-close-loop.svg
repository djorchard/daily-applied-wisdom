<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="threat-loop-title threat-loop-desc">
  <title id="threat-loop-title">A threat closes only through a governed and testable decision</title>
  <desc id="threat-loop-desc">A replayed refund threat enters a response gate with four choices: mitigate, eliminate, transfer or accept. It then moves to a closure record containing an owner, observable evidence and a revisit trigger. A return path shows that changed data, exposure or design reopens the model.</desc>
  <defs>
    <marker id="threat-loop-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .loop { fill: none; stroke: #c35f43; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="165" y="18" width="870" height="70" rx="35" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="61" text-anchor="middle">WHAT WILL WE DO? · HOW WILL WE KNOW?</text>

  <text class="small" x="145" y="160" text-anchor="middle">CREDIBLE THREAT</text>
  <rect class="card" x="30" y="185" width="230" height="320" rx="30" fill="#f5c79d"/>
  <circle cx="145" cy="270" r="48" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <path d="M124 270H166M145 249V291" stroke="#c35f43" stroke-width="6" stroke-linecap="round"/>
  <text class="compact" x="145" y="365" text-anchor="middle">REPLAYED</text>
  <text class="compact" x="145" y="403" text-anchor="middle">REFUND</text>
  <text class="body" x="145" y="455" text-anchor="middle">Valid request</text>
  <text class="body" x="145" y="487" text-anchor="middle">used twice</text>
  <path class="line" d="M260 345H325" marker-end="url(#threat-loop-arrow)"/>

  <text class="small" x="555" y="135" text-anchor="middle">CHOOSE AN EXPLICIT RESPONSE</text>
  <rect class="card" x="350" y="160" width="410" height="370" rx="32" fill="#fffdf8"/>
  <rect class="card" x="385" y="205" width="155" height="110" rx="22" fill="#bdd9bf"/>
  <text class="small" x="462" y="252" text-anchor="middle">MITIGATE</text>
  <text class="body" x="462" y="286" text-anchor="middle">Reduce risk</text>
  <rect class="card" x="570" y="205" width="155" height="110" rx="22" fill="#b8d5e5"/>
  <text class="small" x="647" y="252" text-anchor="middle">ELIMINATE</text>
  <text class="body" x="647" y="286" text-anchor="middle">Remove path</text>
  <rect class="card" x="385" y="350" width="155" height="110" rx="22" fill="#e9d17f"/>
  <text class="small" x="462" y="397" text-anchor="middle">TRANSFER</text>
  <text class="body" x="462" y="431" text-anchor="middle">Shift duty</text>
  <rect class="card" x="570" y="350" width="155" height="110" rx="22" fill="#d8cce8"/>
  <text class="small" x="647" y="397" text-anchor="middle">ACCEPT</text>
  <text class="body" x="647" y="431" text-anchor="middle">Own the risk</text>
  <text class="small" x="555" y="500" text-anchor="middle">NO SILENT FIFTH OPTION</text>
  <path class="line" d="M760 345H825" marker-end="url(#threat-loop-arrow)"/>

  <text class="small" x="1000" y="135" text-anchor="middle">CLOSURE RECORD</text>
  <rect class="card" x="850" y="160" width="320" height="370" rx="32" fill="#fffdf8"/>
  <rect class="card" x="885" y="205" width="250" height="78" rx="22" fill="#b8d5e5"/>
  <text class="small" x="1010" y="238" text-anchor="middle">OWNER</text>
  <text class="body" x="1010" y="268" text-anchor="middle">Who decides?</text>
  <rect class="card" x="885" y="305" width="250" height="78" rx="22" fill="#bdd9bf"/>
  <text class="small" x="1010" y="338" text-anchor="middle">EVIDENCE</text>
  <text class="body" x="1010" y="368" text-anchor="middle">What can be tested?</text>
  <rect class="card" x="885" y="405" width="250" height="78" rx="22" fill="#e9d17f"/>
  <text class="small" x="1010" y="438" text-anchor="middle">REVISIT</text>
  <text class="body" x="1010" y="468" text-anchor="middle">What reopens it?</text>

  <path class="loop" d="M1010 530V625H145V520" marker-end="url(#threat-loop-arrow)"/>
  <rect x="205" y="594" width="750" height="62" rx="24" fill="#fffdf8" stroke="#c35f43" stroke-width="4"/>
  <text class="small" x="580" y="634" text-anchor="middle">NEW DATA, EXPOSURE OR DESIGN REOPENS THE MODEL</text>

  <rect class="card" x="170" y="680" width="860" height="58" rx="27" fill="#fffdf8"/>
  <text class="compact" x="600" y="718" text-anchor="middle">A THREAT LIST IS NOT THE FINISH LINE</text>
</svg>
