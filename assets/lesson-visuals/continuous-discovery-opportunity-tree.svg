<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="cdh-tree-title cdh-tree-desc">
  <title id="cdh-tree-title">Opportunity solution tree from outcome to competing solutions</title>
  <desc id="cdh-tree-desc">A desired product outcome branches into three customer opportunities. One opportunity is selected as the target and branches into three competing solutions. A note explains that evidence can redraw every branch.</desc>
  <defs>
    <marker id="cdh-tree-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#18211d" />
    </marker>
    <filter id="cdh-tree-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#18211d" flood-opacity="0.14" />
    </filter>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#faf7f0" />
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#18211d">Map the decision before the feature</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="26" fill="#4f5e57">Keep the reasoning chain visible, then let evidence change it.</text>

  <path d="M600 244 V300 H230 V336" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#cdh-tree-arrow)" />
  <path d="M600 244 V336" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#cdh-tree-arrow)" />
  <path d="M600 300 H970 V336" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#cdh-tree-arrow)" />
  <path d="M600 476 V508 H270 V576" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#cdh-tree-arrow)" />
  <path d="M600 476 V576" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#cdh-tree-arrow)" />
  <path d="M600 508 H930 V576" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#cdh-tree-arrow)" />

  <g filter="url(#cdh-tree-shadow)">
    <rect x="390" y="144" width="420" height="100" rx="20" fill="#3f6f8f" stroke="#18211d" stroke-width="4" />
    <text x="600" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="2" fill="#faf7f0">DESIRED PRODUCT OUTCOME</text>
    <text x="600" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Fewer abandoned requests</text>
  </g>

  <rect x="60" y="252" width="350" height="42" rx="12" fill="#faf7f0" />
  <text x="70" y="282" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="2" fill="#4f5e57">OPPORTUNITY SPACE</text>
  <g filter="url(#cdh-tree-shadow)" font-family="Arial, sans-serif">
    <rect x="80" y="340" width="300" height="136" rx="18" fill="#ffffff" stroke="#5f7f6b" stroke-width="4" />
    <text x="230" y="378" text-anchor="middle" font-size="22" font-weight="700" fill="#5f7f6b">NEED</text>
    <text x="230" y="417" text-anchor="middle" font-size="26" font-weight="700" fill="#18211d">I cannot tell what</text>
    <text x="230" y="450" text-anchor="middle" font-size="26" font-weight="700" fill="#18211d">is required</text>

    <rect x="450" y="340" width="300" height="136" rx="18" fill="#fff4d6" stroke="#d5a63a" stroke-width="6" />
    <text x="600" y="378" text-anchor="middle" font-size="22" font-weight="700" fill="#8b6514">TARGET OPPORTUNITY</text>
    <text x="600" y="417" text-anchor="middle" font-size="26" font-weight="700" fill="#18211d">I lose work</text>
    <text x="600" y="450" text-anchor="middle" font-size="26" font-weight="700" fill="#18211d">between steps</text>

    <rect x="820" y="340" width="300" height="136" rx="18" fill="#ffffff" stroke="#75618d" stroke-width="4" />
    <text x="970" y="378" text-anchor="middle" font-size="22" font-weight="700" fill="#75618d">PAIN</text>
    <text x="970" y="417" text-anchor="middle" font-size="26" font-weight="700" fill="#18211d">I do not know</text>
    <text x="970" y="450" text-anchor="middle" font-size="26" font-weight="700" fill="#18211d">who decides</text>
  </g>

  <g filter="url(#cdh-tree-shadow)" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#18211d">
    <rect x="120" y="580" width="300" height="88" rx="16" fill="#ffffff" stroke="#3f6f8f" stroke-width="4" />
    <text x="270" y="633" text-anchor="middle">Autosave the draft</text>
    <rect x="450" y="580" width="300" height="88" rx="16" fill="#ffffff" stroke="#3f6f8f" stroke-width="4" />
    <text x="600" y="633" text-anchor="middle">Use one page</text>
    <rect x="780" y="580" width="300" height="88" rx="16" fill="#ffffff" stroke="#3f6f8f" stroke-width="4" />
    <text x="930" y="633" text-anchor="middle">Guide the next step</text>
  </g>

  <text x="70" y="716" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#c46a3a">Evidence can redraw the outcome, opportunities or solution branches.</text>
</svg>
