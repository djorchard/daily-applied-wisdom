<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="shape-appetite-title shape-appetite-desc">
  <title id="shape-appetite-title">An appetite constrains the solution before scope hardens</title>
  <desc id="shape-appetite-desc">A raw request enters an appetite envelope containing a specific problem, fixed time budget and quality floor. Three solution footprints are compared: one is too large, one coherently fits and one does not solve enough. Peripheral scope stays outside the accepted footprint.</desc>
  <defs>
    <marker id="shape-appetite-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .muted { fill: none; stroke: #53615a; stroke-width: 4; stroke-dasharray: 12 10; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="180" y="18" width="840" height="70" rx="35" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="61" text-anchor="middle" font-weight="700">TIME BUDGET FIRST · SOLUTION FOOTPRINT SECOND</text>

  <rect class="card" x="35" y="165" width="275" height="305" rx="30" fill="#f5c79d"/>
  <text class="small" x="172" y="207" text-anchor="middle">RAW REQUEST</text>
  <text class="heading" x="172" y="257" text-anchor="middle">"BUILD THE</text>
  <text class="heading" x="172" y="294" text-anchor="middle">FULL SUITE"</text>
  <rect x="65" y="330" width="215" height="88" rx="22" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="172" y="365" text-anchor="middle">Scope implied</text>
  <text class="body" x="172" y="398" text-anchor="middle">Value unclear</text>
  <path class="line" d="M310 318H370" marker-end="url(#shape-appetite-arrow)"/>

  <path d="M400 125H785L840 180V565L785 620H400L360 565V180Z" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="600" y="170" text-anchor="middle">APPETITE ENVELOPE</text>
  <rect class="card" x="415" y="205" width="370" height="88" rx="22" fill="#b8d5e5"/>
  <text class="small" x="600" y="239" text-anchor="middle">SPECIFIC PROBLEM</text>
  <text class="body" x="600" y="272" text-anchor="middle">Which workflow is failing?</text>
  <rect class="card" x="415" y="318" width="370" height="88" rx="22" fill="#e9d17f"/>
  <text class="small" x="600" y="352" text-anchor="middle">FIXED TIME BUDGET</text>
  <text class="body" x="600" y="385" text-anchor="middle">How much is it worth?</text>
  <rect class="card" x="415" y="431" width="370" height="88" rx="22" fill="#d8cce8"/>
  <text class="small" x="600" y="465" text-anchor="middle">QUALITY FLOOR</text>
  <text class="body" x="600" y="498" text-anchor="middle">What must not be traded?</text>
  <text class="small" x="600" y="570" text-anchor="middle">DESIGN INSIDE THESE BOUNDARIES</text>

  <path class="line" d="M840 318H885" marker-end="url(#shape-appetite-arrow)"/>
  <text class="small" x="1022" y="132" text-anchor="middle">SOLUTION FOOTPRINTS</text>
  <rect class="card" x="890" y="155" width="275" height="125" rx="26" fill="#fffdf8"/>
  <text class="small" x="1027" y="196" text-anchor="middle">TOO LARGE</text>
  <rect x="935" y="220" width="185" height="34" rx="17" fill="#f5c79d" stroke="#18211d" stroke-width="3"/>
  <path class="muted" d="M1120 237H1150"/>
  <rect class="card" x="890" y="305" width="275" height="125" rx="26" fill="#bdd9bf"/>
  <text class="small" x="1027" y="346" text-anchor="middle">COHERENT FIT</text>
  <rect x="935" y="370" width="135" height="34" rx="17" fill="#b8d5e5" stroke="#18211d" stroke-width="3"/>
  <path class="line" d="M1070 387H1118" marker-end="url(#shape-appetite-arrow)"/>
  <rect class="card" x="890" y="455" width="275" height="125" rx="26" fill="#fffdf8"/>
  <text class="small" x="1027" y="496" text-anchor="middle">UNDER-SOLVES</text>
  <rect x="935" y="520" width="62" height="34" rx="17" fill="#e9d17f" stroke="#18211d" stroke-width="3"/>

  <rect class="card" x="125" y="650" width="950" height="82" rx="28" fill="#fffdf8"/>
  <text class="compact" x="600" y="686" text-anchor="middle">HOLD THE QUALITY FLOOR · FLEX PERIPHERAL SCOPE</text>
  <text class="small" x="600" y="716" text-anchor="middle">THE APPETITE INVITES A DIFFERENT DESIGN, NOT A RUSHED VERSION</text>
</svg>
