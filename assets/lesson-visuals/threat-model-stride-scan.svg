<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="threat-stride-title threat-stride-desc">
  <title id="threat-stride-title">STRIDE scans one boundary-crossing flow through six distinct questions</title>
  <desc id="threat-stride-desc">An external service sends a webhook across a trust boundary to a handler. Six numbered cards ask about spoofing, tampering, repudiation, information disclosure, denial of service and elevation of privilege. The cards feed one review list while a note warns that structured coverage is not proof of completeness.</desc>
  <defs>
    <marker id="threat-stride-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .boundary { fill: none; stroke: #c35f43; stroke-width: 5; stroke-dasharray: 13 10; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="180" y="18" width="840" height="70" rx="35" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="61" text-anchor="middle">WHAT CAN GO WRONG? · SCAN ONE FLOW SIX WAYS</text>

  <rect class="card" x="90" y="118" width="230" height="82" rx="22" fill="#b8d5e5"/>
  <text class="body" x="205" y="168" text-anchor="middle">External service</text>
  <path class="line" d="M320 159H865" marker-end="url(#threat-stride-arrow)"/>
  <text class="small" x="590" y="139" text-anchor="middle">BOUNDARY-CROSSING WEBHOOK</text>
  <path class="boundary" d="M700 102V216"/>
  <rect class="card" x="880" y="118" width="230" height="82" rx="22" fill="#bdd9bf"/>
  <text class="body" x="995" y="168" text-anchor="middle">Webhook handler</text>

  <rect class="card" x="40" y="250" width="350" height="145" rx="26" fill="#b8d5e5"/>
  <circle cx="80" cy="290" r="23" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="80" y="298" text-anchor="middle">1</text>
  <text class="compact" x="215" y="295" text-anchor="middle">SPOOFING</text>
  <text class="body" x="215" y="345" text-anchor="middle">Who really sent it?</text>

  <rect class="card" x="425" y="250" width="350" height="145" rx="26" fill="#e9d17f"/>
  <circle cx="465" cy="290" r="23" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="465" y="298" text-anchor="middle">2</text>
  <text class="compact" x="600" y="295" text-anchor="middle">TAMPERING</text>
  <text class="body" x="600" y="345" text-anchor="middle">Was the payload changed?</text>

  <rect class="card" x="810" y="250" width="350" height="145" rx="26" fill="#d8cce8"/>
  <circle cx="850" cy="290" r="23" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="850" y="298" text-anchor="middle">3</text>
  <text class="compact" x="985" y="295" text-anchor="middle">REPUDIATION</text>
  <text class="body" x="985" y="345" text-anchor="middle">What proves handling?</text>

  <rect class="card" x="40" y="430" width="350" height="145" rx="26" fill="#f5c79d"/>
  <circle cx="80" cy="470" r="23" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="80" y="478" text-anchor="middle">4</text>
  <text class="compact" x="215" y="475" text-anchor="middle">DISCLOSURE</text>
  <text class="body" x="215" y="525" text-anchor="middle">Who can read it?</text>

  <rect class="card" x="425" y="430" width="350" height="145" rx="26" fill="#bdd9bf"/>
  <circle cx="465" cy="470" r="23" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="465" y="478" text-anchor="middle">5</text>
  <text class="small" x="620" y="475" text-anchor="middle">DENIAL OF SERVICE</text>
  <text class="body" x="600" y="525" text-anchor="middle">What can exhaust it?</text>

  <rect class="card" x="810" y="430" width="350" height="145" rx="26" fill="#e9d17f"/>
  <circle cx="850" cy="470" r="23" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="850" y="478" text-anchor="middle">6</text>
  <text class="compact" x="985" y="475" text-anchor="middle">ELEVATION</text>
  <text class="body" x="985" y="525" text-anchor="middle">What authority follows?</text>

  <rect class="card" x="140" y="625" width="920" height="108" rx="30" fill="#fffdf8"/>
  <text class="compact" x="600" y="670" text-anchor="middle">STRUCTURED COVERAGE IS NOT A CERTIFICATE</text>
  <text class="small" x="600" y="708" text-anchor="middle">ADD DOMAIN KNOWLEDGE, VARIED VIEWPOINTS AND OTHER LENSES</text>
</svg>
