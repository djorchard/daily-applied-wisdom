<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="refactoring-steps-title refactoring-steps-desc">
  <title id="refactoring-steps-title">Small verified transformations form a safe refactoring loop</title>
  <desc id="refactoring-steps-desc">A green baseline leads to one small structural change and then a behavior check. If behavior is unchanged, the loop continues. If behavior changed, the last step is diagnosed or reversed before more work begins.</desc>
  <defs>
    <marker id="refactoring-steps-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
      .heading { font-size: 32px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="274" y="28" width="652" height="62" rx="31" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="600" y="68" text-anchor="middle">STRUCTURE CHANGES, BEHAVIOR STAYS</text>

  <rect class="card" x="70" y="210" width="250" height="260" rx="28" fill="#bdd9bf"/>
  <circle cx="195" cy="280" r="38" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <path d="M176 281L190 295L217 265" fill="none" stroke="#18211d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="heading" x="195" y="354" text-anchor="middle">GREEN</text>
  <text class="heading" x="195" y="392" text-anchor="middle">BASELINE</text>
  <text class="body" x="195" y="438" text-anchor="middle">known output</text>

  <path class="line" d="M320 340H425" marker-end="url(#refactoring-steps-arrow)"/>
  <rect class="card" x="430" y="170" width="340" height="340" rx="28" fill="#b8d5e5"/>
  <text class="label" x="600" y="222" text-anchor="middle">ONE TRANSFORMATION</text>
  <rect x="492" y="256" width="216" height="82" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="600" y="308" text-anchor="middle">RENAME</text>
  <rect x="492" y="358" width="216" height="82" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="600" y="410" text-anchor="middle">EXTRACT</text>
  <text class="body" x="600" y="478" text-anchor="middle">small, reviewable diff</text>

  <path class="line" d="M770 340H875" marker-end="url(#refactoring-steps-arrow)"/>
  <rect class="card" x="880" y="210" width="250" height="260" rx="28" fill="#e9d17f"/>
  <text class="label" x="1005" y="274" text-anchor="middle">CHECK</text>
  <text class="heading" x="1005" y="334" text-anchor="middle">SAME</text>
  <text class="heading" x="1005" y="374" text-anchor="middle">BEHAVIOR?</text>
  <text class="body" x="1005" y="426" text-anchor="middle">test and inspect</text>

  <path class="line" d="M1005 470V584H600V520" marker-end="url(#refactoring-steps-arrow)"/>
  <rect x="746" y="552" width="170" height="54" rx="27" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="831" y="587" text-anchor="middle">YES: CONTINUE</text>

  <path class="line" d="M1005 584V668H195V478" marker-end="url(#refactoring-steps-arrow)"/>
  <rect x="430" y="636" width="340" height="56" rx="28" fill="#f3a8a0" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="672" text-anchor="middle">NO: DIAGNOSE OR REVERSE</text>
</svg>
