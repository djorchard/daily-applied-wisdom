<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="range-analogy-title range-analogy-desc">
  <title id="range-analogy-title">Compare distant cases to reveal transferable structure</title>
  <desc id="range-analogy-desc">Two cases with different surface details are compared for their shared relationship. That relationship becomes a provisional principle, which is then tested against a new problem rather than copied by appearance.</desc>
  <defs>
    <marker id="range-analogy-arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0 0 L18 9 L0 18 Z" fill="#5f4b8b"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: .04em; }
      .body { font-size: 24px; }
      .small { font-size: 22px; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #5f4b8b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="36" fill="#f5f1e8"/>
  <text x="70" y="68" class="label">TRANSFER THE RELATIONSHIP, NOT THE DECORATION</text>

  <rect class="card" x="70" y="125" width="310" height="210" rx="26" fill="#dce8f2"/>
  <text x="225" y="172" class="label" text-anchor="middle">CASE A</text>
  <circle cx="155" cy="238" r="32" fill="#356987"/>
  <circle cx="295" cy="238" r="32" fill="#8a6116"/>
  <path d="M190 238 H258" class="line" marker-end="url(#range-analogy-arrow)"/>
  <text x="225" y="305" class="small" text-anchor="middle">Different surface details</text>

  <rect class="card" x="70" y="425" width="310" height="210" rx="26" fill="#f5dfc2"/>
  <text x="225" y="472" class="label" text-anchor="middle">CASE B</text>
  <rect x="125" y="510" width="60" height="60" rx="12" fill="#b55d12"/>
  <rect x="265" y="510" width="60" height="60" rx="12" fill="#2f6f5e"/>
  <path d="M190 540 H258" class="line" marker-end="url(#range-analogy-arrow)"/>
  <text x="225" y="605" class="small" text-anchor="middle">Same relation underneath</text>

  <path class="line" d="M380 230 H470 V310" marker-end="url(#range-analogy-arrow)"/>
  <path class="line" d="M380 530 H470 V450" marker-end="url(#range-analogy-arrow)"/>
  <rect class="card" x="490" y="270" width="300" height="220" rx="28" fill="#e8e0f2"/>
  <text x="640" y="318" class="label" text-anchor="middle">COMPARE</text>
  <text x="640" y="365" class="body" text-anchor="middle">Name what stays true</text>
  <text x="640" y="405" class="body" text-anchor="middle">when objects change</text>
  <rect x="525" y="438" width="230" height="36" rx="18" fill="#5f4b8b"/>
  <text x="640" y="464" class="small" text-anchor="middle" style="fill:#ffffff">Provisional principle</text>

  <path class="line" d="M790 380 H855" marker-end="url(#range-analogy-arrow)"/>
  <rect class="card" x="875" y="240" width="255" height="280" rx="28" fill="#bdd9bf"/>
  <text x="1002" y="290" class="label" text-anchor="middle">NEW PROBLEM</text>
  <path d="M930 350 C955 320 985 410 1010 380 C1035 350 1065 440 1090 390" class="line"/>
  <text x="1002" y="452" class="body" text-anchor="middle">Test the relation</text>
  <text x="1002" y="486" class="small" text-anchor="middle">against real evidence</text>

  <rect class="card" x="220" y="650" width="760" height="64" rx="20" fill="#fffdf8"/>
  <text x="600" y="691" class="small" text-anchor="middle">Reject the analogy when the causal structure does not match.</text>
</svg>
