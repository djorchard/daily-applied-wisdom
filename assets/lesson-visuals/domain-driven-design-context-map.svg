<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="ddd-map-title ddd-map-desc">
  <title id="ddd-map-title">A context map makes ownership, dependency and translation explicit</title>
  <desc id="ddd-map-desc">An upstream policy context owns eligibility meaning and a downstream fulfilment context depends on an accepted decision. Between them, a translation boundary records contract ownership, change direction, compatibility evidence and failure behaviour before a transport is chosen.</desc>
  <defs>
    <marker id="map-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .label { font-size: 25px; font-weight: 700; }
      .body { font-size: 23px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="188" y="20" width="824" height="64" rx="32" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="61" text-anchor="middle">MAP THE RELATIONSHIP BEFORE CHOOSING THE TRANSPORT</text>

  <rect class="card" x="40" y="148" width="320" height="382" rx="34" fill="#d8cce8"/>
  <rect x="72" y="176" width="256" height="54" rx="27" fill="#73568e"/>
  <text class="small" x="200" y="211" text-anchor="middle" fill="#fffdf8">UPSTREAM</text>
  <text class="heading" x="200" y="286" text-anchor="middle">POLICY</text>
  <text class="body" x="200" y="322" text-anchor="middle">owns eligibility meaning</text>
  <line x1="84" y1="352" x2="316" y2="352" stroke="#8b799e" stroke-width="3"/>
  <text class="small" x="200" y="398" text-anchor="middle">SETS</text>
  <text class="body" x="200" y="434" text-anchor="middle">decision terms</text>
  <text class="body" x="200" y="464" text-anchor="middle">accepted versions</text>
  <text class="body" x="200" y="494" text-anchor="middle">change notice</text>

  <path class="line" d="M360 334H420" marker-end="url(#map-arrow)"/>

  <rect class="card" x="430" y="120" width="340" height="438" rx="34" fill="#e9d17f"/>
  <rect x="466" y="148" width="268" height="54" rx="27" fill="#9b7b13"/>
  <text class="small" x="600" y="183" text-anchor="middle" fill="#fffdf8">CONTEXT RELATIONSHIP</text>
  <circle cx="486" cy="254" r="22" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="486" y="262" text-anchor="middle">1</text>
  <text class="label" x="524" y="247">MEANING OWNER</text>
  <text class="body" x="524" y="279">who defines the fact?</text>
  <line x1="470" y1="310" x2="730" y2="310" stroke="#a98d2e" stroke-width="3"/>
  <circle cx="486" cy="354" r="22" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="486" y="362" text-anchor="middle">2</text>
  <text class="label" x="524" y="347">TRANSLATOR</text>
  <text class="body" x="524" y="379">who adapts local models?</text>
  <line x1="470" y1="410" x2="730" y2="410" stroke="#a98d2e" stroke-width="3"/>
  <circle cx="486" cy="454" r="22" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="486" y="462" text-anchor="middle">3</text>
  <text class="label" x="524" y="447">EVIDENCE</text>
  <text class="body" x="524" y="479">compatibility + failure test</text>
  <rect x="476" y="506" width="248" height="34" rx="17" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="531" text-anchor="middle">THEN CHOOSE HOW</text>

  <path class="line" d="M770 334H830" marker-end="url(#map-arrow)"/>

  <rect class="card" x="840" y="148" width="320" height="382" rx="34" fill="#dcead9"/>
  <rect x="872" y="176" width="256" height="54" rx="27" fill="#4f7d67"/>
  <text class="small" x="1000" y="211" text-anchor="middle" fill="#fffdf8">DOWNSTREAM</text>
  <text class="heading" x="1000" y="286" text-anchor="middle">FULFILMENT</text>
  <text class="body" x="1000" y="322" text-anchor="middle">depends on accepted facts</text>
  <line x1="884" y1="352" x2="1116" y2="352" stroke="#86a294" stroke-width="3"/>
  <text class="small" x="1000" y="398" text-anchor="middle">DECIDES</text>
  <text class="body" x="1000" y="434" text-anchor="middle">local naming</text>
  <text class="body" x="1000" y="464" text-anchor="middle">fallback behaviour</text>
  <text class="body" x="1000" y="494" text-anchor="middle">upgrade timing</text>

  <rect class="card" x="48" y="576" width="254" height="126" rx="24" fill="#fffdf8"/>
  <text class="small" x="175" y="614" text-anchor="middle">OWNERSHIP</text>
  <text class="body" x="175" y="650" text-anchor="middle">who can change</text>
  <text class="body" x="175" y="680" text-anchor="middle">the meaning?</text>
  <rect class="card" x="331" y="576" width="254" height="126" rx="24" fill="#fffdf8"/>
  <text class="small" x="458" y="614" text-anchor="middle">DIRECTION</text>
  <text class="body" x="458" y="650" text-anchor="middle">who depends</text>
  <text class="body" x="458" y="680" text-anchor="middle">on whom?</text>
  <rect class="card" x="614" y="576" width="254" height="126" rx="24" fill="#fffdf8"/>
  <text class="small" x="741" y="614" text-anchor="middle">TRANSLATION</text>
  <text class="body" x="741" y="650" text-anchor="middle">where does</text>
  <text class="body" x="741" y="680" text-anchor="middle">meaning change?</text>
  <rect class="card" x="897" y="576" width="254" height="126" rx="24" fill="#fffdf8"/>
  <text class="small" x="1024" y="614" text-anchor="middle">PROOF</text>
  <text class="body" x="1024" y="650" text-anchor="middle">what catches</text>
  <text class="body" x="1024" y="680" text-anchor="middle">a break?</text>

  <text class="small" x="600" y="731" text-anchor="middle">TECHNOLOGY SERVES THE RELATIONSHIP; IT DOES NOT DEFINE IT</text>
</svg>
