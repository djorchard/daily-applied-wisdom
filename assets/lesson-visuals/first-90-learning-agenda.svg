<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="first-90-learning-agenda-title first-90-learning-agenda-desc">
<title id="first-90-learning-agenda-title">A learning agenda closes a decision gap</title><desc id="first-90-learning-agenda-desc">A decision about the first priority prompts a question about delay. A colleague and a work record supply evidence. The plan is updated on a named date, and remaining uncertainty feeds the next learning pass.</desc>
<defs><style>text {font-family: Arial, sans-serif; fill: #18211d;}</style><marker id="first-90-learning-agenda-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#18211d"/></marker></defs>
<rect width="1200" height="760" fill="#faf7f0"/>
<text x="600" y="62" text-anchor="middle" font-size="34" font-weight="700">MAKE EACH INQUIRY USEFUL</text>
<rect x="180" y="105" width="840" height="105" rx="18" fill="#a9c7df" stroke="#18211d" stroke-width="3"/>
<text x="220" y="145" text-anchor="start" font-size="24" font-weight="700">DECISION</text>
<text x="600" y="185" text-anchor="middle" font-size="32" font-weight="400">Which delay should we tackle first?</text>
<path d="M600 218V249" fill="none" stroke="#18211d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#first-90-learning-agenda-arrow)"/>
<rect x="180" y="260" width="840" height="105" rx="18" fill="#e9d17f" stroke="#18211d" stroke-width="3"/>
<text x="220" y="300" text-anchor="start" font-size="24" font-weight="700">QUESTION</text>
<text x="600" y="340" text-anchor="middle" font-size="32" font-weight="400">Where does a real item wait?</text>
<path d="M600 373V409" fill="none" stroke="#18211d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#first-90-learning-agenda-arrow)"/>
<rect x="180" y="420" width="390" height="115" rx="18" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
<text x="375" y="463" text-anchor="middle" font-size="26" font-weight="700">ASK THE OWNER</text>
<text x="375" y="506" text-anchor="middle" font-size="30" font-weight="400">What happened?</text>
<rect x="630" y="420" width="390" height="115" rx="18" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
<text x="825" y="463" text-anchor="middle" font-size="26" font-weight="700">CHECK THE RECORD</text>
<text x="825" y="506" text-anchor="middle" font-size="30" font-weight="400">When did it move?</text>
<path d="M375 544V565H600V594" fill="none" stroke="#18211d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#first-90-learning-agenda-arrow)"/>
<path d="M825 544V565H620" fill="none" stroke="#18211d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#first-90-learning-agenda-arrow)"/>
<rect x="180" y="605" width="840" height="92" rx="18" fill="#e8b89c" stroke="#18211d" stroke-width="3"/>
<text x="600" y="642" text-anchor="middle" font-size="28" font-weight="700">UPDATE THE PLAN ON FRIDAY</text>
<text x="600" y="679" text-anchor="middle" font-size="28" font-weight="400">Keep the next unknown visible.</text>
<path d="M170 651H95V312H169" fill="none" stroke="#18211d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#first-90-learning-agenda-arrow)"/>
<text x="77" y="475" text-anchor="middle" font-size="22" font-weight="700">NEXT</text>
<text x="77" y="502" text-anchor="middle" font-size="22" font-weight="700">PASS</text>
<text x="600" y="741" text-anchor="middle" font-size="24" font-weight="400">One case starts the inquiry; it does not establish the whole pattern.</text>
</svg>
