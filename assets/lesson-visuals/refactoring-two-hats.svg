<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="refactoring-hats-title refactoring-hats-desc">
  <title id="refactoring-hats-title">Two programming hats separate structural and behavioral intent</title>
  <desc id="refactoring-hats-desc">An intent switch directs work to a refactoring side where observable behavior stays the same and tests remain green, or to an adding-function side where behavior changes and tests describe the new result. The developer may switch often but each step has one intent.</desc>
  <defs>
    <marker id="refactoring-hats-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
      .heading { font-size: 34px; font-weight: 700; }
      .body { font-size: 25px; }
      .small { font-size: 22px; font-weight: 700; }
      .inverse { fill: #fffdf8; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="380" y="28" width="440" height="62" rx="31" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="600" y="68" text-anchor="middle">WHAT SHOULD THIS STEP DO?</text>

  <circle cx="600" cy="188" r="74" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <path d="M571 178H629M571 200H629" stroke="#18211d" stroke-width="7" stroke-linecap="round"/>
  <text class="small" x="600" y="292" text-anchor="middle">INTENT SWITCH</text>
  <path class="line" d="M536 228L394 324" marker-end="url(#refactoring-hats-arrow)"/>
  <path class="line" d="M664 228L806 324" marker-end="url(#refactoring-hats-arrow)"/>

  <rect class="card" x="70" y="320" width="470" height="300" rx="30" fill="#b8d5e5"/>
  <path d="M210 414C220 356 390 356 400 414L420 444H190z" fill="#fffdf8" stroke="#18211d" stroke-width="4" stroke-linejoin="round"/>
  <text class="label" x="305" y="486" text-anchor="middle">REFACTORING HAT</text>
  <text class="heading" x="305" y="536" text-anchor="middle">BEHAVIOR STAYS</text>
  <text class="body" x="305" y="580" text-anchor="middle">existing checks stay green</text>

  <rect class="card" x="660" y="320" width="470" height="300" rx="30" fill="#f5c79d"/>
  <path d="M800 414C810 356 980 356 990 414L1010 444H780z" fill="#fffdf8" stroke="#18211d" stroke-width="4" stroke-linejoin="round"/>
  <text class="label" x="895" y="486" text-anchor="middle">ADDING-FUNCTION HAT</text>
  <text class="heading" x="895" y="536" text-anchor="middle">BEHAVIOR CHANGES</text>
  <text class="body" x="895" y="580" text-anchor="middle">tests describe the new result</text>

  <rect x="260" y="660" width="680" height="62" rx="31" fill="#18211d"/>
  <text class="label inverse" x="600" y="700" text-anchor="middle">SWITCH OFTEN · ONE STEP, ONE INTENT</text>
</svg>
