<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="measurement-information-title measurement-information-desc">
  <title id="measurement-information-title">Filter measurements by decision value</title>
  <desc id="measurement-information-desc">A three-question filter checks whether plausible values can change the choice, whether a wrong choice has meaningful consequences, and whether expected improvement exceeds study cost before recommending measurement.</desc>
  <defs>
    <marker id="measurement-information-arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0 0 L18 9 L0 18 Z" fill="#356987"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: .04em; }
      .body { font-size: 24px; }
      .small { font-size: 22px; }
      .inverse { fill: #fffdf8; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #356987; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="36" fill="#f5f1e8"/>
  <text x="70" y="66" class="label">SPEND MEASUREMENT EFFORT WHERE LEARNING CAN PAY</text>

  <rect class="card" x="55" y="120" width="320" height="190" rx="26" fill="#e8e0f2"/>
  <text x="215" y="165" class="label" text-anchor="middle">CAN THE CHOICE</text>
  <text x="215" y="197" class="label" text-anchor="middle">FLIP?</text>
  <text x="215" y="244" class="small" text-anchor="middle">Test plausible low and high</text>
  <text x="215" y="276" class="small" text-anchor="middle">values before collecting more</text>

  <rect class="card" x="440" y="120" width="320" height="190" rx="26" fill="#f2d6a2"/>
  <text x="600" y="165" class="label" text-anchor="middle">DOES BEING WRONG</text>
  <text x="600" y="197" class="label" text-anchor="middle">MATTER?</text>
  <text x="600" y="244" class="small" text-anchor="middle">Compare consequences, delay</text>
  <text x="600" y="276" class="small" text-anchor="middle">and reversibility</text>

  <rect class="card" x="825" y="120" width="320" height="190" rx="26" fill="#dbe8e2"/>
  <text x="985" y="165" class="label" text-anchor="middle">IS LEARNING</text>
  <text x="985" y="197" class="label" text-anchor="middle">WORTH IT?</text>
  <text x="985" y="244" class="small" text-anchor="middle">Expected improvement must</text>
  <text x="985" y="276" class="small" text-anchor="middle">exceed study cost</text>

  <path class="line" d="M375 215 H424" marker-end="url(#measurement-information-arrow)"/>
  <path class="line" d="M760 215 H809" marker-end="url(#measurement-information-arrow)"/>
  <text x="400" y="200" class="small" text-anchor="middle">YES</text>
  <text x="785" y="200" class="small" text-anchor="middle">YES</text>

  <path class="line" d="M215 310 V370" marker-end="url(#measurement-information-arrow)"/>
  <path class="line" d="M600 310 V370" marker-end="url(#measurement-information-arrow)"/>
  <path class="line" d="M985 310 V370" marker-end="url(#measurement-information-arrow)"/>

  <rect class="card" x="55" y="390" width="320" height="145" rx="24" fill="#ead9cb"/>
  <text x="215" y="432" class="label" text-anchor="middle">DEFER IT</text>
  <text x="215" y="476" class="small" text-anchor="middle">Precision will not alter</text>
  <text x="215" y="508" class="small" text-anchor="middle">the action</text>

  <rect class="card" x="440" y="390" width="320" height="145" rx="24" fill="#ead9cb"/>
  <text x="600" y="432" class="label" text-anchor="middle">KEEP IT LIGHT</text>
  <text x="600" y="476" class="small" text-anchor="middle">Use a rough bound</text>
  <text x="600" y="508" class="small" text-anchor="middle">or quick check</text>

  <rect class="card" x="825" y="390" width="320" height="145" rx="24" fill="#356987"/>
  <text x="985" y="432" class="label inverse" text-anchor="middle">MEASURE NEXT</text>
  <text x="985" y="476" class="small inverse" text-anchor="middle">Choose the cheapest</text>
  <text x="985" y="508" class="small inverse" text-anchor="middle">credible test</text>

  <text x="150" y="354" class="small" text-anchor="middle">NO</text>
  <text x="535" y="354" class="small" text-anchor="middle">NO</text>
  <text x="920" y="354" class="small" text-anchor="middle">YES</text>

  <rect class="card" x="150" y="595" width="900" height="105" rx="26" fill="#fffdf8"/>
  <text x="600" y="636" class="label" text-anchor="middle">PERFECT INFORMATION SETS AN UPPER BOUND</text>
  <text x="600" y="677" class="body" text-anchor="middle">Real evidence is imperfect, so its expected value is lower.</text>
</svg>
