<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="refactoring-path-title refactoring-path-desc">
  <title id="refactoring-path-title">Preparatory refactoring clears the path for an imminent feature</title>
  <desc id="refactoring-path-desc">The direct route from the current code shape to a feature meets branching, duplication and coupling. A scoped route first finds the blocking seam, reshapes it while behavior stays the same, then adds the feature through a clearer path.</desc>
  <defs>
    <marker id="refactoring-path-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
      .heading { font-size: 31px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="340" y="28" width="520" height="62" rx="31" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="600" y="68" text-anchor="middle">CLEAR ONLY THE REAL CHANGE PATH</text>

  <rect class="card" x="40" y="282" width="190" height="138" rx="26" fill="#fffdf8"/>
  <text class="label" x="135" y="330" text-anchor="middle">CURRENT</text>
  <text class="heading" x="135" y="372" text-anchor="middle">SHAPE</text>
  <path class="line" d="M230 326H310" marker-end="url(#refactoring-path-arrow)"/>

  <path class="line" d="M310 326H934"/>
  <rect x="344" y="264" width="190" height="124" rx="22" fill="#f3a8a0" stroke="#18211d" stroke-width="4"/>
  <text class="label" x="439" y="314" text-anchor="middle">BRANCHING</text>
  <text class="body" x="439" y="354" text-anchor="middle">more cases</text>
  <rect x="562" y="264" width="190" height="124" rx="22" fill="#f3a8a0" stroke="#18211d" stroke-width="4"/>
  <text class="label" x="657" y="314" text-anchor="middle">DUPLICATION</text>
  <text class="body" x="657" y="354" text-anchor="middle">more copies</text>
  <rect x="780" y="264" width="190" height="124" rx="22" fill="#f3a8a0" stroke="#18211d" stroke-width="4"/>
  <text class="label" x="875" y="314" text-anchor="middle">COUPLING</text>
  <text class="body" x="875" y="354" text-anchor="middle">more effects</text>

  <rect class="card" x="990" y="282" width="170" height="138" rx="26" fill="#e9d17f"/>
  <text class="label" x="1075" y="330" text-anchor="middle">NEW</text>
  <text class="heading" x="1075" y="372" text-anchor="middle">FEATURE</text>

  <path class="line" d="M135 420V560H286" marker-end="url(#refactoring-path-arrow)"/>
  <rect class="card" x="292" y="492" width="242" height="142" rx="26" fill="#d8cce8"/>
  <text class="label" x="413" y="542" text-anchor="middle">FIND THE SEAM</text>
  <text class="body" x="413" y="582" text-anchor="middle">named obstacle</text>
  <path class="line" d="M534 563H612" marker-end="url(#refactoring-path-arrow)"/>

  <rect class="card" x="618" y="470" width="276" height="186" rx="28" fill="#b8d5e5"/>
  <text class="label" x="756" y="520" text-anchor="middle">RESHAPE</text>
  <text class="heading" x="756" y="566" text-anchor="middle">ONE PATH</text>
  <rect x="646" y="590" width="220" height="40" rx="20" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="756" y="618" text-anchor="middle">BEHAVIOR SAME</text>
  <path class="line" d="M894 563H1075V426" marker-end="url(#refactoring-path-arrow)"/>

  <text class="small" x="657" y="706" text-anchor="middle">PREPARE THE IMMINENT CHANGE · DEFER UNRELATED CLEANUP</text>
</svg>
