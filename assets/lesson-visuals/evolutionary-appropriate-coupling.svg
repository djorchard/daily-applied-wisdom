<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Appropriate coupling contains change</title>
  <desc id="desc">The same policy change spreads through five tangled components on the left but remains inside one cohesive boundary and one stable contract on the right.</desc>
  <defs>
    <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0 0 L18 9 L0 18 Z" fill="#2f6f5e"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #1f2933; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: .04em; }
      .body { font-size: 24px; }
      .small { font-size: 22px; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="36" fill="#f5f1e8"/>
  <text x="70" y="70" class="label">SAME POLICY CHANGE, DIFFERENT BLAST RADIUS</text>
  <rect x="55" y="105" width="520" height="560" rx="28" fill="#fffdf8" stroke="#b55d12" stroke-width="4"/>
  <text x="315" y="155" class="label" text-anchor="middle" fill="#8b3d0b" style="fill:#8b3d0b">TANGLED DETAILS</text>
  <rect x="230" y="190" width="170" height="70" rx="18" fill="#f5dfc2" stroke="#b55d12" stroke-width="4"/>
  <text x="315" y="233" class="body" text-anchor="middle">Policy edit</text>
  <g fill="#fff5e8" stroke="#b55d12" stroke-width="3">
    <rect x="95" y="330" width="130" height="75" rx="16"/>
    <rect x="250" y="330" width="130" height="75" rx="16"/>
    <rect x="405" y="330" width="130" height="75" rx="16"/>
    <rect x="170" y="500" width="130" height="75" rx="16"/>
    <rect x="330" y="500" width="130" height="75" rx="16"/>
  </g>
  <text x="160" y="376" class="small" text-anchor="middle">Code A</text>
  <text x="315" y="376" class="small" text-anchor="middle">Shared DB</text>
  <text x="470" y="376" class="small" text-anchor="middle">Code B</text>
  <text x="235" y="546" class="small" text-anchor="middle">Team C</text>
  <text x="395" y="546" class="small" text-anchor="middle">Deploy D</text>
  <path d="M270 260 L170 318 M315 260 V318 M360 260 L460 318 M225 405 L240 488 M315 405 L375 488 M470 405 L420 488 M225 367 H238 M380 367 H393" stroke="#b55d12" stroke-width="5" fill="none"/>
  <text x="315" y="625" class="small" text-anchor="middle">Five coordinated changes</text>
  <rect x="625" y="105" width="520" height="560" rx="28" fill="#fffdf8" stroke="#2f6f5e" stroke-width="4"/>
  <text x="885" y="155" class="label" text-anchor="middle" fill="#245a4b" style="fill:#245a4b">COHESIVE BOUNDARY</text>
  <rect x="680" y="195" width="280" height="300" rx="28" fill="#dbe8e2" stroke="#2f6f5e" stroke-width="5"/>
  <text x="820" y="245" class="label" text-anchor="middle">POLICY MODULE</text>
  <rect x="730" y="285" width="180" height="75" rx="18" fill="#ffffff" stroke="#2f6f5e" stroke-width="3"/>
  <text x="820" y="332" class="body" text-anchor="middle">Policy edit</text>
  <rect x="730" y="390" width="180" height="65" rx="18" fill="#ffffff" stroke="#2f6f5e" stroke-width="3"/>
  <text x="820" y="431" class="small" text-anchor="middle">Local data</text>
  <rect x="990" y="300" width="115" height="110" rx="18" fill="#dce8f2" stroke="#356987" stroke-width="4"/>
  <text x="1048" y="346" class="small" text-anchor="middle">One</text>
  <text x="1048" y="376" class="small" text-anchor="middle">neighbour</text>
  <path d="M960 355 H978" stroke="#2f6f5e" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <rect x="730" y="535" width="310" height="78" rx="18" fill="#e8e0f2" stroke="#5f4b8b" stroke-width="3"/>
  <text x="885" y="568" class="small" text-anchor="middle">Stable contract contains</text>
  <text x="885" y="598" class="small" text-anchor="middle">volatile implementation</text>
</svg>
