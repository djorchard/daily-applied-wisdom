<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="threat-map-title threat-map-desc">
  <title id="threat-map-title">A focused system model exposes flows and trust changes</title>
  <desc id="threat-map-desc">A vague payroll export box becomes a focused data-flow model. A payroll administrator sends an export request to an export service, the service reads a payroll data store, and an encrypted file crosses a trust boundary to an external processor. An explicit recipient-identity assumption is recorded.</desc>
  <defs>
    <marker id="threat-map-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .boundary { fill: none; stroke: #c35f43; stroke-width: 5; stroke-dasharray: 13 10; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="155" y="18" width="890" height="70" rx="35" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="61" text-anchor="middle">WHAT ARE WE WORKING ON? · MAKE THE HAND-OFFS VISIBLE</text>

  <text class="small" x="150" y="145" text-anchor="middle">VAGUE VIEW</text>
  <rect class="card" x="30" y="170" width="240" height="390" rx="30" fill="#d8cce8"/>
  <rect x="65" y="245" width="170" height="130" rx="24" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <text class="compact" x="150" y="298" text-anchor="middle">PAYROLL</text>
  <text class="compact" x="150" y="336" text-anchor="middle">EXPORT</text>
  <text class="body" x="150" y="430" text-anchor="middle">One box hides</text>
  <text class="body" x="150" y="465" text-anchor="middle">actors, stores</text>
  <text class="body" x="150" y="500" text-anchor="middle">and boundaries</text>
  <path class="line" d="M270 365H330" marker-end="url(#threat-map-arrow)"/>

  <text class="small" x="750" y="120" text-anchor="middle">FOCUSED DATA-FLOW MODEL</text>
  <rect class="card" x="350" y="145" width="815" height="495" rx="32" fill="#fffdf8"/>
  <rect class="card" x="390" y="250" width="160" height="110" rx="20" fill="#b8d5e5"/>
  <text class="small" x="470" y="294" text-anchor="middle">PAYROLL</text>
  <text class="body" x="470" y="331" text-anchor="middle">administrator</text>

  <circle class="card" cx="710" cy="305" r="92" fill="#bdd9bf"/>
  <text class="small" x="710" y="295" text-anchor="middle">EXPORT</text>
  <text class="body" x="710" y="330" text-anchor="middle">service</text>

  <rect x="600" y="462" width="220" height="86" rx="18" fill="#e9d17f" stroke="#18211d" stroke-width="4"/>
  <path d="M600 482H820" stroke="#18211d" stroke-width="4"/>
  <text class="small" x="710" y="522" text-anchor="middle">PAYROLL DATA</text>

  <path class="boundary" d="M875 185V570"/>
  <text class="small" x="895" y="215">TRUST</text>
  <text class="small" x="895" y="243">BOUNDARY</text>

  <rect class="card" x="950" y="260" width="175" height="110" rx="20" fill="#f5c79d"/>
  <text class="small" x="1037" y="304" text-anchor="middle">EXTERNAL</text>
  <text class="body" x="1037" y="341" text-anchor="middle">processor</text>

  <path class="line" d="M550 305H605" marker-end="url(#threat-map-arrow)"/>
  <text class="body" x="578" y="278" text-anchor="middle">request</text>
  <path class="line" d="M710 397V450" marker-end="url(#threat-map-arrow)"/>
  <text class="body" x="825" y="428" text-anchor="end">read rows</text>
  <path class="line" d="M802 305H938" marker-end="url(#threat-map-arrow)"/>
  <text class="body" x="870" y="286" text-anchor="middle">file</text>

  <rect x="410" y="555" width="415" height="74" rx="24" fill="#fffdf8" stroke="#c35f43" stroke-width="4"/>
  <text class="small" x="617" y="584" text-anchor="middle">ASSUMPTION TO CHECK</text>
  <text class="body" x="617" y="614" text-anchor="middle">Recipient identity is verified</text>

  <rect class="card" x="135" y="665" width="930" height="68" rx="28" fill="#fffdf8"/>
  <text class="compact" x="600" y="708" text-anchor="middle">THE THREAT SEARCH INHERITS THE MODEL'S BLIND SPOTS</text>
</svg>
