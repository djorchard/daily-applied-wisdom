<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="execution-gap-title execution-gap-desc">
  <title id="execution-gap-title">A checklist carries known critical work across the execution gap</title>
  <desc id="execution-gap-desc">Two routes begin with the same expert knowledge. The memory-only route drops a critical step amid interruption, hand-off and time pressure. The supported route uses three short checkpoints and reaches reliable action while leaving judgement with the expert.</desc>
  <defs>
    <marker id="execution-gap-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 700; }
      .body { font-size: 23px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="154" y="20" width="892" height="70" rx="35" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="63" text-anchor="middle">WHEN KNOWLEDGE EXISTS BUT EXECUTION CAN STILL FAIL</text>

  <rect class="card" x="36" y="145" width="250" height="430" rx="30" fill="#d8cce8"/>
  <text class="label" x="161" y="185" text-anchor="middle">EXPERT</text>
  <text class="label" x="161" y="214" text-anchor="middle">KNOWLEDGE</text>
  <rect x="72" y="230" width="178" height="72" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="161" y="274" text-anchor="middle">preconditions</text>
  <rect x="72" y="326" width="178" height="72" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="161" y="370" text-anchor="middle">safe sequence</text>
  <rect x="72" y="422" width="178" height="72" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="161" y="466" text-anchor="middle">recovery path</text>
  <text class="body" x="161" y="535" text-anchor="middle">The team already</text>
  <text class="body" x="161" y="565" text-anchor="middle">knows what matters</text>

  <rect class="card" x="340" y="130" width="520" height="470" rx="34" fill="#fffdf8"/>
  <text class="label" x="600" y="176" text-anchor="middle">THE EXECUTION GAP</text>
  <rect x="375" y="202" width="140" height="72" rx="24" fill="#f5c79d" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="445" y="246" text-anchor="middle">interrupt</text>
  <rect x="530" y="202" width="140" height="72" rx="24" fill="#b8d5e5" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="246" text-anchor="middle">hand-off</text>
  <rect x="685" y="202" width="140" height="72" rx="24" fill="#e9d17f" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="755" y="232" text-anchor="middle">time</text>
  <text class="body" x="755" y="260" text-anchor="middle">pressure</text>

  <text class="small" x="370" y="325">MEMORY ONLY</text>
  <path d="M370 355H548" class="line"/>
  <path d="M650 355H825" class="line" marker-end="url(#execution-gap-arrow)"/>
  <path d="M565 334L626 376M626 334L565 376" stroke="#c35f43" stroke-width="8" stroke-linecap="round"/>
  <text class="body" x="596" y="411" text-anchor="middle">one known step drops</text>

  <text class="small" x="370" y="467">EXPERTISE + SHORT CHECKLIST</text>
  <path d="M370 502H825" class="line" marker-end="url(#execution-gap-arrow)"/>
  <circle class="card" cx="485" cy="502" r="26" fill="#bdd9bf"/>
  <circle class="card" cx="600" cy="502" r="26" fill="#bdd9bf"/>
  <circle class="card" cx="715" cy="502" r="26" fill="#bdd9bf"/>
  <path d="M472 502L482 512L500 490M587 502L597 512L615 490M702 502L712 512L730 490" fill="none" stroke="#18211d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="body" x="600" y="560" text-anchor="middle">critical checks stay visible at the risk point</text>

  <path class="line" d="M286 355H326" marker-end="url(#execution-gap-arrow)"/>
  <path class="line" d="M286 502H326" marker-end="url(#execution-gap-arrow)"/>

  <rect class="card" x="915" y="145" width="250" height="430" rx="30" fill="#bdd9bf"/>
  <text class="label" x="1040" y="185" text-anchor="middle">RELIABLE</text>
  <text class="label" x="1040" y="214" text-anchor="middle">ACTION</text>
  <circle cx="1040" cy="325" r="92" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <path d="M990 325L1025 360L1092 282" fill="none" stroke="#4f7d67" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="body" x="1040" y="452" text-anchor="middle">minimum protected</text>
  <text class="body" x="1040" y="486" text-anchor="middle">judgement remains</text>
  <text class="body" x="1040" y="520" text-anchor="middle">with the expert</text>
  <path class="line" d="M860 355H901" marker-end="url(#execution-gap-arrow)"/>
  <path class="line" d="M860 502H901" marker-end="url(#execution-gap-arrow)"/>

  <rect class="card" x="124" y="654" width="952" height="72" rx="28" fill="#fffdf8"/>
  <text class="heading" x="600" y="700" text-anchor="middle">PROTECT THE MINIMUM, PRESERVE JUDGEMENT</text>
</svg>
