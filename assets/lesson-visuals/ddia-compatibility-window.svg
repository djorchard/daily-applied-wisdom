<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="ddia-compat-title ddia-compat-desc">
  <title id="ddia-compat-title">Old and new versions coexist inside a compatibility window</title>
  <desc id="ddia-compat-desc">Old and new writers on the left connect to old and new readers on the right through four readable paths. A lower timeline stages tolerant readers first, new writers second, observation third and cleanup last.</desc>
  <defs>
    <marker id="ddia-compat-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .compat { fill: none; stroke: #377f63; stroke-width: 5; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="130" y="18" width="940" height="70" rx="35" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="61" text-anchor="middle" font-weight="700">A ROLLOUT IS A PERIOD OF COEXISTENCE, NOT ONE MOMENT</text>

  <text class="heading" x="180" y="140" text-anchor="middle">WRITERS</text>
  <rect class="card" x="45" y="170" width="270" height="105" rx="28" fill="#e9d17f"/>
  <text class="small" x="180" y="210" text-anchor="middle">OLD WRITER</text>
  <text class="body" x="180" y="246" text-anchor="middle">record v1</text>
  <rect class="card" x="45" y="330" width="270" height="105" rx="28" fill="#b8d5e5"/>
  <text class="small" x="180" y="370" text-anchor="middle">NEW WRITER</text>
  <text class="body" x="180" y="406" text-anchor="middle">record v2 + field</text>

  <rect x="400" y="125" width="400" height="355" rx="52" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="600" y="165" text-anchor="middle">COMPATIBILITY</text>
  <text class="heading" x="600" y="198" text-anchor="middle">WINDOW</text>
  <text class="small" x="600" y="235" text-anchor="middle">ALL FOUR LIVE PATHS</text>
  <path class="compat" d="M315 222C405 222 430 270 505 270H695C770 270 795 222 885 222"/>
  <path class="compat" d="M315 222C405 222 430 365 505 365H695C770 365 795 382 885 382"/>
  <path class="compat" d="M315 382C405 382 430 270 505 270H695C770 270 795 222 885 222"/>
  <path class="compat" d="M315 382C405 382 430 365 505 365H695C770 365 795 382 885 382"/>
  <circle cx="600" cy="270" r="28" fill="#bdd9bf" stroke="#18211d" stroke-width="4"/>
  <text class="small" x="600" y="278" text-anchor="middle">✓</text>
  <circle cx="600" cy="365" r="28" fill="#bdd9bf" stroke="#18211d" stroke-width="4"/>
  <text class="small" x="600" y="373" text-anchor="middle">✓</text>
  <text class="body" x="600" y="430" text-anchor="middle">missing field has a meaning</text>
  <text class="body" x="600" y="460" text-anchor="middle">unknown field is handled safely</text>

  <text class="heading" x="1020" y="140" text-anchor="middle">READERS</text>
  <rect class="card" x="885" y="170" width="270" height="105" rx="28" fill="#e9d17f"/>
  <text class="small" x="1020" y="210" text-anchor="middle">OLD READER</text>
  <text class="body" x="1020" y="246" text-anchor="middle">understands v1</text>
  <rect class="card" x="885" y="330" width="270" height="105" rx="28" fill="#b8d5e5"/>
  <text class="small" x="1020" y="370" text-anchor="middle">NEW READER</text>
  <text class="body" x="1020" y="406" text-anchor="middle">understands v1 + v2</text>

  <text class="heading" x="600" y="530" text-anchor="middle">STAGE THE CHANGE</text>
  <path class="line" d="M140 622H1060" marker-end="url(#ddia-compat-arrow)"/>
  <circle cx="190" cy="622" r="27" fill="#bdd9bf" stroke="#18211d" stroke-width="4"/>
  <circle cx="455" cy="622" r="27" fill="#b8d5e5" stroke="#18211d" stroke-width="4"/>
  <circle cx="720" cy="622" r="27" fill="#e9d17f" stroke="#18211d" stroke-width="4"/>
  <circle cx="985" cy="622" r="27" fill="#d8cce8" stroke="#18211d" stroke-width="4"/>
  <text class="small" x="190" y="630" text-anchor="middle">1</text>
  <text class="small" x="455" y="630" text-anchor="middle">2</text>
  <text class="small" x="720" y="630" text-anchor="middle">3</text>
  <text class="small" x="985" y="630" text-anchor="middle">4</text>
  <text class="small" x="190" y="575" text-anchor="middle">TOLERANT READERS</text>
  <text class="small" x="455" y="575" text-anchor="middle">NEW WRITERS</text>
  <text class="small" x="720" y="575" text-anchor="middle">OBSERVE BOTH</text>
  <text class="small" x="985" y="575" text-anchor="middle">CLEAN UP</text>
  <text class="body" x="600" y="705" text-anchor="middle">ROLLBACK STAYS POSSIBLE UNTIL THE COMPATIBILITY WINDOW CLOSES</text>
</svg>
