<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="sls-legibility-title sls-legibility-desc">
  <title id="sls-legibility-title">A living system becomes a thin administrative map</title>
  <desc id="sls-legibility-desc">A varied network of stories, workarounds, dependencies and seasonal change passes through an administrative lens. The output is a tidy grid that supports counts and comparisons while several important relationships remain outside its frame.</desc>
  <defs>
    <marker id="sls-legibility-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <filter id="sls-legibility-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#18211d" flood-opacity="0.14"/>
    </filter>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
      .heading { font-size: 44px; font-weight: 700; }
      .subheading { font-size: 26px; }
      .label { font-size: 24px; font-weight: 700; }
      .body { font-size: 22px; }
      .panel { stroke: #18211d; stroke-width: 4; }
      .link { fill: none; stroke: #4f5e57; stroke-width: 5; stroke-linecap: round; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#faf7f0"/>
  <text class="heading" x="60" y="67">Every useful map is a selective view</text>
  <text class="subheading" x="60" y="108" fill="#4f5e57">Legibility improves coordination, but its omissions still shape the decision.</text>

  <rect class="panel" x="50" y="145" width="420" height="500" rx="30" fill="#fffdf8"/>
  <text class="eyebrow" x="80" y="188" fill="#5f7f6b">LIVING SYSTEM</text>
  <text class="body" x="80" y="220">Varied, connected and changing</text>

  <path class="link" d="M175 313C230 265 284 292 334 337M176 313C225 370 272 400 341 391M334 337C375 300 411 330 414 382M341 391C294 466 222 474 173 515"/>
  <g filter="url(#sls-legibility-shadow)">
    <rect x="78" y="262" width="198" height="82" rx="18" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
    <text class="label" x="177" y="295" text-anchor="middle">CUSTOMER</text>
    <text class="body" x="177" y="326" text-anchor="middle">recent story</text>

    <rect x="278" y="300" width="166" height="82" rx="18" fill="#b8d5e5" stroke="#18211d" stroke-width="3"/>
    <text class="label" x="361" y="333" text-anchor="middle">LOCAL</text>
    <text class="body" x="361" y="364" text-anchor="middle">workaround</text>

    <rect x="260" y="405" width="184" height="82" rx="18" fill="#e9d17f" stroke="#18211d" stroke-width="3"/>
    <text class="label" x="352" y="438" text-anchor="middle">HIDDEN</text>
    <text class="body" x="352" y="469" text-anchor="middle">dependency</text>

    <rect x="78" y="477" width="198" height="82" rx="18" fill="#f5c79d" stroke="#18211d" stroke-width="3"/>
    <text class="label" x="177" y="510" text-anchor="middle">SEASONAL</text>
    <text class="body" x="177" y="541" text-anchor="middle">change</text>
  </g>
  <text class="body" x="80" y="610">Meaning lives in the links</text>

  <path d="M470 382H520" class="link" marker-end="url(#sls-legibility-arrow)"/>
  <path d="M535 255L680 318V446L535 509Z" fill="#d8cce8" stroke="#18211d" stroke-width="4"/>
  <text class="eyebrow" x="594" y="350" text-anchor="middle">ADMIN</text>
  <text class="eyebrow" x="594" y="380" text-anchor="middle">LENS</text>
  <text class="body" x="594" y="419" text-anchor="middle">select</text>
  <text class="body" x="594" y="447" text-anchor="middle">standardise</text>
  <path d="M680 382H725" class="link" marker-end="url(#sls-legibility-arrow)"/>

  <rect class="panel" x="730" y="145" width="420" height="500" rx="30" fill="#fffdf8"/>
  <text class="eyebrow" x="760" y="188" fill="#3f6f8f">THIN MAP</text>
  <text class="body" x="760" y="220">Comparable, countable and partial</text>
  <g filter="url(#sls-legibility-shadow)">
    <rect x="760" y="258" width="170" height="102" rx="16" fill="#b8d5e5" stroke="#18211d" stroke-width="3"/>
    <text class="label" x="845" y="298" text-anchor="middle">TYPE</text>
    <text class="body" x="845" y="333" text-anchor="middle">A or B</text>
    <rect x="950" y="258" width="170" height="102" rx="16" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
    <text class="label" x="1035" y="298" text-anchor="middle">STATUS</text>
    <text class="body" x="1035" y="333" text-anchor="middle">green</text>
    <rect x="760" y="380" width="170" height="102" rx="16" fill="#e9d17f" stroke="#18211d" stroke-width="3"/>
    <text class="label" x="845" y="420" text-anchor="middle">TOTAL</text>
    <text x="845" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700">42</text>
    <rect x="950" y="380" width="170" height="102" rx="16" fill="#f5c79d" stroke="#18211d" stroke-width="3"/>
    <text class="label" x="1035" y="420" text-anchor="middle">OWNER</text>
    <text class="body" x="1035" y="455" text-anchor="middle">unit 7</text>
  </g>
  <rect x="760" y="520" width="360" height="86" rx="18" fill="#dfe9e1" stroke="#5f7f6b" stroke-width="3"/>
  <text class="label" x="940" y="553" text-anchor="middle" fill="#4f7d67">VISIBLE</text>
  <text class="body" x="940" y="585" text-anchor="middle">counts and comparisons</text>

  <rect x="170" y="675" width="860" height="58" rx="29" fill="#fff4d6" stroke="#c46a3a" stroke-width="3"/>
  <text class="body" x="600" y="712" text-anchor="middle" font-weight="700">OUTSIDE THE FRAME: relationships · workarounds · change over time</text>
</svg>
