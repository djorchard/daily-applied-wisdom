<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="sls-conditions-title sls-conditions-desc">
  <title id="sls-conditions-title">Four conditions combine into a high-risk scheme</title>
  <desc id="sls-conditions-desc">A thin administrative map, certainty in one best plan, power to impose it and weak ability to correct it converge into an irreversible large-scale scheme. A lower path shows that challenge, contrary evidence and reversibility create room for correction.</desc>
  <defs>
    <marker id="sls-conditions-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <filter id="sls-conditions-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#18211d" flood-opacity="0.14"/>
    </filter>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 44px; font-weight: 700; }
      .subheading { font-size: 26px; }
      .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 1.6px; }
      .label { font-size: 27px; font-weight: 700; }
      .body { font-size: 22px; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#faf7f0"/>
  <text class="heading" x="60" y="67">Planning alone is not Scott's danger pattern</text>
  <text class="subheading" x="60" y="108" fill="#4f5e57">Risk compounds when four conditions meet and correction cannot travel back.</text>

  <g filter="url(#sls-conditions-shadow)">
    <rect class="card" x="45" y="155" width="255" height="180" rx="24" fill="#b8d5e5"/>
    <text class="eyebrow" x="172" y="194" text-anchor="middle">1 · LEGIBILITY</text>
    <text class="label" x="172" y="235" text-anchor="middle">Thin map</text>
    <text class="body" x="172" y="274" text-anchor="middle">The centre sees</text>
    <text class="body" x="172" y="304" text-anchor="middle">selected categories.</text>

    <rect class="card" x="330" y="155" width="255" height="180" rx="24" fill="#d8cce8"/>
    <text class="eyebrow" x="457" y="194" text-anchor="middle">2 · CERTAINTY</text>
    <text class="label" x="457" y="235" text-anchor="middle">One best plan</text>
    <text class="body" x="457" y="274" text-anchor="middle">The model is treated</text>
    <text class="body" x="457" y="304" text-anchor="middle">as complete.</text>

    <rect class="card" x="615" y="155" width="255" height="180" rx="24" fill="#f5c79d"/>
    <text class="eyebrow" x="742" y="194" text-anchor="middle">3 · POWER</text>
    <text class="label" x="742" y="235" text-anchor="middle">Force compliance</text>
    <text class="body" x="742" y="274" text-anchor="middle">The design can spread</text>
    <text class="body" x="742" y="304" text-anchor="middle">despite objections.</text>

    <rect class="card" x="900" y="155" width="255" height="180" rx="24" fill="#e9d17f"/>
    <text class="eyebrow" x="1027" y="194" text-anchor="middle">4 · WEAK VOICE</text>
    <text class="label" x="1027" y="235" text-anchor="middle">Block correction</text>
    <text class="body" x="1027" y="274" text-anchor="middle">Affected people cannot</text>
    <text class="body" x="1027" y="304" text-anchor="middle">resist or revise.</text>
  </g>

  <path class="line" d="M172 335V358H600M457 335V358M742 335V358M1027 335V358H600"/>
  <rect x="405" y="370" width="390" height="48" rx="24" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="eyebrow" x="600" y="402" text-anchor="middle">WHEN ALL FOUR COMBINE</text>
  <path class="line" d="M600 358V368M600 420V436" marker-end="url(#sls-conditions-arrow)"/>

  <rect class="card" x="160" y="440" width="880" height="160" rx="30" fill="#f8ddd2" stroke="#c35f43" stroke-width="6"/>
  <circle cx="265" cy="520" r="50" fill="#c35f43"/>
  <path d="M265 488V531M265 553V555" stroke="#fffdf8" stroke-width="10" stroke-linecap="round"/>
  <text x="355" y="498" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#18211d">HIGH-RISK SCHEME</text>
  <text class="body" x="355" y="540">One partial model becomes a large, hard-to-reverse reality.</text>
  <text class="body" x="355" y="576">Errors travel outward while contrary knowledge cannot travel back.</text>

  <rect x="140" y="650" width="920" height="72" rx="36" fill="#dfe9e1" stroke="#4f7d67" stroke-width="4"/>
  <text class="label" x="600" y="681" text-anchor="middle" fill="#4f7d67">CREATE CORRECTION SPACE</text>
  <text class="body" x="600" y="711" text-anchor="middle">challenge · contrary evidence · staged adoption · reversibility</text>
</svg>
