<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="sre-toil-title sre-toil-desc">
  <title id="sre-toil-title">Engineering breaks the cycle in which service growth produces more toil</title>
  <desc id="sre-toil-desc">Toil is manual, repetitive, automatable and tactical work without enduring value that tends to scale with service growth. In the unchecked path, rising demand produces more repeated manual work, squeezes engineering capacity and leaves less time to remove the toil. In the engineering path, automation, simplification or redesign reduces manual work per unit of demand, preserves capacity and enables further improvement. The mechanism is directional, not measured data.</desc>
  <defs>
    <marker id="sre-toil-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0L12 6L0 12z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="58" y="24" width="1084" height="62" rx="31" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="63" text-anchor="middle">TOIL: MANUAL, REPETITIVE, AUTOMATABLE WORK THAT SCALES WITH SERVICE GROWTH</text>

  <rect x="35" y="112" width="535" height="610" rx="28" fill="#fffdf8" stroke="#d86136" stroke-width="4"/>
  <rect x="630" y="112" width="535" height="610" rx="28" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="302.5" y="160" text-anchor="middle" fill="#d86136">TOIL LEFT UNCHECKED</text>
  <text class="heading" x="897.5" y="160" text-anchor="middle">ENGINEER OUT REPETITION</text>

  <rect class="card" x="100" y="190" width="405" height="82" rx="20" fill="#b8d5e5"/>
  <text class="compact" x="302.5" y="225" text-anchor="middle">SERVICE DEMAND RISES</text>
  <text class="body" x="302.5" y="257" text-anchor="middle">More users, traffic or systems</text>
  <path class="line" d="M302.5 272V312" marker-end="url(#sre-toil-arrow)"/>

  <rect class="card" x="100" y="312" width="405" height="82" rx="20" fill="#f5c79d"/>
  <text class="compact" x="302.5" y="347" text-anchor="middle">REPEATED MANUAL WORK</text>
  <text class="body" x="302.5" y="379" text-anchor="middle">Grows along with the service</text>
  <path class="line" d="M302.5 394V434" marker-end="url(#sre-toil-arrow)"/>

  <rect x="100" y="434" width="405" height="82" rx="20" fill="#f5c79d" stroke="#d86136" stroke-width="4"/>
  <text class="compact" x="302.5" y="469" text-anchor="middle" fill="#d86136">CAPACITY IS SQUEEZED</text>
  <text class="body" x="302.5" y="501" text-anchor="middle">Operations crowd out engineering</text>
  <path class="line" d="M302.5 516V556" marker-end="url(#sre-toil-arrow)"/>

  <rect class="card" x="100" y="556" width="405" height="100" rx="20" fill="#e9d17f"/>
  <text class="compact" x="302.5" y="594" text-anchor="middle">LESS TIME TO REMOVE TOIL</text>
  <text class="body" x="302.5" y="630" text-anchor="middle">The scaling relationship remains</text>
  <path class="line" d="M100 606H72V353H100" marker-end="url(#sre-toil-arrow)"/>
  <text class="small" x="302.5" y="696" text-anchor="middle">DIRECTION ONLY, NOT MEASURED DATA</text>

  <rect class="card" x="695" y="190" width="405" height="82" rx="20" fill="#b8d5e5"/>
  <text class="compact" x="897.5" y="225" text-anchor="middle">SERVICE DEMAND RISES</text>
  <text class="body" x="897.5" y="257" text-anchor="middle">The same scaling pressure appears</text>
  <path class="line" d="M897.5 272V312" marker-end="url(#sre-toil-arrow)"/>

  <rect class="card" x="695" y="312" width="405" height="100" rx="20" fill="#bdd9bf"/>
  <text class="compact" x="897.5" y="350" text-anchor="middle">ENGINEER OUT THE TASK</text>
  <text class="body" x="897.5" y="384" text-anchor="middle">Automate, simplify or redesign</text>
  <path class="line" d="M897.5 412V452" marker-end="url(#sre-toil-arrow)"/>

  <rect class="card" x="695" y="452" width="405" height="100" rx="20" fill="#d8cce8"/>
  <text class="compact" x="897.5" y="490" text-anchor="middle">LESS MANUAL WORK</text>
  <text class="body" x="897.5" y="524" text-anchor="middle">For each unit of service demand</text>
  <path class="line" d="M897.5 552V592" marker-end="url(#sre-toil-arrow)"/>

  <rect class="card" x="695" y="592" width="405" height="94" rx="20" fill="#bdd9bf"/>
  <text class="compact" x="897.5" y="629" text-anchor="middle">CAPACITY IS PRESERVED</text>
  <text class="small" x="897.5" y="656" text-anchor="middle" font-weight="400">For incidents and learning</text>
  <text class="small" x="897.5" y="680" text-anchor="middle" font-weight="400">For further improvement</text>
  <path class="line" d="M1100 639H1130V362H1100" marker-end="url(#sre-toil-arrow)"/>
  <text class="small" x="1139" y="510" text-anchor="middle" transform="rotate(90 1139 510)">REINVEST CAPACITY</text>
</svg>
