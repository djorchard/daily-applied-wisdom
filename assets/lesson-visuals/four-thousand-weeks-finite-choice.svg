<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="ftw-choice-title ftw-choice-desc">
  <title id="ftw-choice-title">Finite time turns possibilities into a real commitment</title>
  <desc id="ftw-choice-desc">Five worthwhile possibilities approach a narrow finite-time gate. One chosen commitment passes through into a block of lived attention. The other possibilities enter a clearly labelled not now area, showing that commitment requires an explicit trade-off.</desc>
  <defs>
    <marker id="ftw-choice-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
      .heading { font-size: 34px; font-weight: 700; }
      .body { font-size: 25px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="318" y="28" width="564" height="62" rx="31" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="600" y="68" text-anchor="middle">A REAL YES HAS A VISIBLE COST</text>

  <text class="small" x="190" y="134" text-anchor="middle">WORTHWHILE POSSIBILITIES</text>
  <rect class="card" x="52" y="158" width="276" height="70" rx="22" fill="#b8d5e5"/>
  <text class="body" x="190" y="202" text-anchor="middle">Important project</text>
  <rect class="card" x="52" y="246" width="276" height="70" rx="22" fill="#bdd9bf"/>
  <text class="body" x="190" y="290" text-anchor="middle">Time with family</text>
  <rect class="card" x="52" y="334" width="276" height="70" rx="22" fill="#e9d17f"/>
  <text class="body" x="190" y="378" text-anchor="middle">Learning a skill</text>
  <rect class="card" x="52" y="422" width="276" height="70" rx="22" fill="#d7c4e8"/>
  <text class="body" x="190" y="466" text-anchor="middle">Helping a colleague</text>
  <rect class="card" x="52" y="510" width="276" height="70" rx="22" fill="#f5c79d"/>
  <text class="body" x="190" y="554" text-anchor="middle">Rest and play</text>

  <path class="line" d="M328 193C420 193 422 314 486 340"/>
  <path class="line" d="M328 281C412 281 428 327 486 348"/>
  <path class="line" d="M328 369H486"/>
  <path class="line" d="M328 457C412 457 428 411 486 390"/>
  <path class="line" d="M328 545C420 545 422 424 486 398"/>
  <path d="M486 296L646 326V412L486 442Z" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="552" y="354" text-anchor="middle">FINITE</text>
  <text class="heading" x="552" y="394" text-anchor="middle">TIME</text>
  <path class="line" d="M646 369H748" marker-end="url(#ftw-choice-arrow)"/>

  <rect class="card" x="770" y="258" width="378" height="222" rx="30" fill="#d7c4e8"/>
  <text class="small" x="959" y="304" text-anchor="middle">CHOSEN COMMITMENT</text>
  <text class="heading" x="959" y="360" text-anchor="middle">LIVED</text>
  <text class="heading" x="959" y="404" text-anchor="middle">ATTENTION</text>
  <text class="body" x="959" y="450" text-anchor="middle">one block, fully entered</text>

  <rect x="220" y="642" width="760" height="78" rx="26" fill="#fffdf8" stroke="#18211d" stroke-width="4" stroke-dasharray="12 10"/>
  <text class="label" x="600" y="676" text-anchor="middle">OTHER POSSIBILITIES: NOT NOW</text>
  <text class="body" x="600" y="706" text-anchor="middle">Declined options stop pretending to be active commitments.</text>
  <path class="line" d="M552 442V620C552 632 564 636 580 642" marker-end="url(#ftw-choice-arrow)"/>
</svg>
