<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="accelerate-capability-title accelerate-capability-desc">
  <title id="accelerate-capability-title">Change delivery outcomes through capability experiments</title>
  <desc id="accelerate-capability-desc">A weak delivery outcome leads to a mapped constraint. The team chooses one targeted technical or process capability experiment, then re-measures the outcome. A separate warning shows that commanding the metric or installing a tool skips the mechanism.</desc>
  <defs>
    <marker id="accelerate-capability-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .dash { fill: none; stroke: #d86136; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 10 10; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="40" y="16" width="1120" height="72" rx="36" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="61" text-anchor="middle" font-size="23" font-weight="700">METRICS POINT TO THE WORK; CAPABILITIES CHANGE THE PATH</text>

  <text class="small" x="45" y="132">1 · OBSERVE</text>
  <rect class="card" x="45" y="152" width="260" height="270" rx="28" fill="#b8d5e5"/>
  <text class="compact" x="175" y="204" text-anchor="middle">WEAK OUTCOME</text>
  <rect x="78" y="238" width="194" height="70" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="175" y="282" text-anchor="middle">Long lead time</text>
  <rect x="78" y="330" width="194" height="70" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="175" y="374" text-anchor="middle">Rising rework</text>

  <path class="line" d="M305 287H365" marker-end="url(#accelerate-capability-arrow)"/>

  <text class="small" x="385" y="132">2 · MAP</text>
  <rect class="card" x="385" y="152" width="300" height="270" rx="28" fill="#e9d17f"/>
  <text class="compact" x="535" y="204" text-anchor="middle">ONE CONSTRAINT</text>
  <path class="line" d="M430 253H640"/>
  <circle cx="470" cy="253" r="13" fill="#18211d"/>
  <circle cx="535" cy="253" r="13" fill="#18211d"/>
  <circle cx="600" cy="253" r="13" fill="#d86136"/>
  <text class="body" x="535" y="306" text-anchor="middle">Fragile shared test</text>
  <text class="body" x="535" y="339" text-anchor="middle">environment creates</text>
  <text class="body" x="535" y="372" text-anchor="middle">waiting and reruns</text>

  <path class="line" d="M685 287H745" marker-end="url(#accelerate-capability-arrow)"/>

  <text class="small" x="765" y="132">3 · EXPERIMENT</text>
  <rect class="card" x="765" y="152" width="390" height="270" rx="28" fill="#bdd9bf"/>
  <text class="compact" x="960" y="204" text-anchor="middle">TARGETED CAPABILITY</text>
  <rect x="805" y="236" width="310" height="62" rx="17" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="960" y="276" text-anchor="middle">Test data on demand</text>
  <rect x="805" y="315" width="310" height="62" rx="17" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="960" y="355" text-anchor="middle">Isolated environment</text>
  <text class="small" x="960" y="402" text-anchor="middle">SMALL, REVERSIBLE, MEASURED</text>

  <path class="line" d="M960 422V480H175V438" marker-end="url(#accelerate-capability-arrow)"/>
  <rect class="card" x="375" y="456" width="450" height="78" rx="22" fill="#d8cce8"/>
  <text class="compact" x="600" y="491" text-anchor="middle">4 · RE-MEASURE THE OUTCOME</text>
  <text class="body" x="600" y="521" text-anchor="middle">Did flow improve without more failure?</text>

  <rect x="90" y="604" width="1020" height="108" rx="26" fill="#fffdf8" stroke="#d86136" stroke-width="4"/>
  <text class="heading" x="600" y="648" text-anchor="middle">THE SHORTCUT SKIPS THE MECHANISM</text>
  <text class="body" x="600" y="684" text-anchor="middle">A tougher target or a new dashboard cannot remove waiting by itself</text>
  <path class="dash" d="M225 575H975"/>
</svg>
