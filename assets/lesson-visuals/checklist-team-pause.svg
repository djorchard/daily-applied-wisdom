<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="team-pause-title team-pause-desc">
  <title id="team-pause-title">A team pause turns distributed knowledge into one shared plan</title>
  <desc id="team-pause-desc">An operator, product owner and support lead each bring different facts into a shared pre-release pause. The board combines recovery, user impact and communication concerns into named actions and a proceed, change or stop decision. A paper-only tick-box path is contrasted with active coordination.</desc>
  <defs>
    <marker id="team-pause-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 700; }
      .body { font-size: 23px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="164" y="20" width="872" height="70" rx="35" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="63" text-anchor="middle">NO ONE ROLE HOLDS THE WHOLE PICTURE</text>

  <rect class="card" x="35" y="145" width="270" height="135" rx="28" fill="#b8d5e5"/>
  <circle cx="94" cy="201" r="28" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="178" y="192">OPERATOR</text>
  <text class="body" x="178" y="222">recovery</text>
  <text class="body" x="178" y="250">condition</text>
  <path class="line" d="M305 213L438 300" marker-end="url(#team-pause-arrow)"/>

  <rect class="card" x="35" y="316" width="270" height="135" rx="28" fill="#e9d17f"/>
  <circle cx="94" cy="372" r="28" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="178" y="363">PRODUCT</text>
  <text class="body" x="178" y="402">user impact</text>
  <path class="line" d="M305 383H424" marker-end="url(#team-pause-arrow)"/>

  <rect class="card" x="35" y="487" width="270" height="135" rx="28" fill="#f5c79d"/>
  <circle cx="94" cy="543" r="28" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="178" y="534">SUPPORT</text>
  <text class="body" x="178" y="563">message</text>
  <text class="body" x="178" y="591">timing</text>
  <path class="line" d="M305 610L438 467" marker-end="url(#team-pause-arrow)"/>

  <rect class="card" x="450" y="162" width="360" height="430" rx="34" fill="#d8cce8"/>
  <text class="small" x="630" y="208" text-anchor="middle">PRE-RELEASE PAUSE</text>
  <rect x="492" y="235" width="276" height="78" rx="22" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="630" y="267" text-anchor="middle">What changed?</text>
  <text class="body" x="630" y="297" text-anchor="middle">What could stop us?</text>
  <rect x="492" y="334" width="276" height="92" rx="22" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="630" y="369" text-anchor="middle">NAMED ACTIONS</text>
  <text class="body" x="630" y="402" text-anchor="middle">owner · evidence · timing</text>
  <rect x="492" y="448" width="276" height="96" rx="22" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="630" y="485" text-anchor="middle">DECIDE TO</text>
  <text class="body" x="630" y="520" text-anchor="middle">proceed · change · stop</text>

  <path class="line" d="M810 377H886" marker-end="url(#team-pause-arrow)"/>
  <rect class="card" x="900" y="240" width="265" height="275" rx="30" fill="#bdd9bf"/>
  <text class="label" x="1032" y="290" text-anchor="middle">SHARED PLAN</text>
  <path d="M950 344L968 362L1000 324M950 405L968 423L1000 385" fill="none" stroke="#4f7d67" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="body" x="1010" y="357">rollback owned</text>
  <text class="body" x="1010" y="418">support briefed</text>
  <text class="body" x="1032" y="468" text-anchor="middle">conflicts surfaced</text>

  <rect class="card" x="90" y="660" width="440" height="72" rx="28" fill="#fffdf8"/>
  <text class="small" x="310" y="690" text-anchor="middle">PAPER ONLY</text>
  <text class="body" x="310" y="718" text-anchor="middle">ticks stored, facts stay separate</text>
  <path d="M540 696H660" stroke="#c35f43" stroke-width="6" stroke-linecap="round"/>
  <rect class="card" x="670" y="660" width="440" height="72" rx="28" fill="#fffdf8"/>
  <text class="small" x="890" y="690" text-anchor="middle">ACTIVE COORDINATION</text>
  <text class="body" x="890" y="718" text-anchor="middle">facts shared, actions owned</text>
</svg>
