<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="peak-plateau-redesign-title peak-plateau-redesign-desc">
  <title id="peak-plateau-redesign-title">A plateau calls for diagnosis and a redesigned challenge</title>
  <desc id="peak-plateau-redesign-desc">A schematic performance path rises, flattens under comfortable repetition, then rises again after a limiting component is isolated and targeted with feedback and recovery.</desc>
  <defs>
    <marker id="peak-plateau-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#18211d"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 28px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .path { fill: none; stroke: #366b8a; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect class="card" x="250" y="28" width="700" height="66" rx="30" fill="#fffdf8"/>
  <text class="heading" x="600" y="71" text-anchor="middle">PLATEAU: CHANGE THE LEARNING DESIGN</text>

  <rect class="card" x="56" y="126" width="320" height="150" rx="24" fill="#bdd9bf"/>
  <text class="small" x="216" y="167" text-anchor="middle">1 · EARLY ADAPTATION</text>
  <text class="heading" x="216" y="211" text-anchor="middle">Difficulty creates</text>
  <text class="heading" x="216" y="247" text-anchor="middle">correctable strain</text>

  <rect class="card" x="440" y="126" width="320" height="150" rx="24" fill="#e4cf8e"/>
  <text class="small" x="600" y="167" text-anchor="middle">2 · COMFORTABLE LOOP</text>
  <text class="heading" x="600" y="211" text-anchor="middle">Same task, same</text>
  <text class="heading" x="600" y="247" text-anchor="middle">feedback, same result</text>

  <rect class="card" x="824" y="126" width="320" height="150" rx="24" fill="#b8d5e5"/>
  <text class="small" x="984" y="167" text-anchor="middle">3 · TARGETED REDESIGN</text>
  <text class="heading" x="984" y="211" text-anchor="middle">Isolate, stretch,</text>
  <text class="heading" x="984" y="247" text-anchor="middle">recover and retry</text>

  <path class="line" d="M376 201H420" marker-end="url(#peak-plateau-arrow)"/>
  <path class="line" d="M760 201H804" marker-end="url(#peak-plateau-arrow)"/>

  <line class="line" x1="90" y1="650" x2="1125" y2="650"/>
  <line class="line" x1="90" y1="650" x2="90" y2="334"/>
  <text class="small" x="62" y="465" text-anchor="middle" transform="rotate(-90 62 465)">PERFORMANCE · SCHEMATIC</text>
  <text class="small" x="600" y="702" text-anchor="middle">PRACTICE SESSIONS</text>

  <path class="path" d="M120 620C210 590 252 520 324 470C390 424 448 410 520 410H744C790 410 820 395 852 352C910 312 970 300 1080 294"/>
  <circle class="card" cx="520" cy="410" r="14" fill="#e4cf8e"/>
  <circle class="card" cx="744" cy="410" r="14" fill="#e4cf8e"/>
  <circle class="card" cx="852" cy="352" r="14" fill="#b8d5e5"/>

  <rect class="card" x="300" y="474" width="600" height="108" rx="22" fill="#fffdf8"/>
  <text class="heading" x="600" y="514" text-anchor="middle">DIAGNOSE BEFORE ADDING VOLUME</text>
  <text class="small" x="600" y="551" text-anchor="middle">limiting component · feedback · recovery · conditions</text>

  <path class="line" d="M693 474V438" marker-end="url(#peak-plateau-arrow)"/>
  <text class="small" x="198" y="625" text-anchor="middle">new challenge</text>
  <text class="small" x="632" y="394" text-anchor="middle">plateau</text>
  <rect x="890" y="322" width="250" height="44" rx="14" fill="#faf7f0"/>
  <text class="small" x="1015" y="352" text-anchor="middle">new adaptation</text>
</svg>
