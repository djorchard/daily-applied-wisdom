<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">A codebase tested across three moments in time</title>
  <desc id="desc">Three aligned stages show code working today, new pressures arriving later, and the long-term engineering test of whether the code remains safe and inexpensive to change.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 26px; }
      .small { font-size: 24px; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>

  <rect class="card" x="70" y="155" width="300" height="280" rx="22" fill="#b8d5e5"/>
  <text class="heading" x="220" y="220" text-anchor="middle">WORKS TODAY</text>
  <path d="M 145 275 L 190 320 L 285 230" fill="none" stroke="#18211d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="body" x="220" y="375" text-anchor="middle">Current needs pass</text>

  <path class="line" d="M 370 295 H 450" marker-end="url(#arrow)"/>
  <rect class="card" x="450" y="155" width="300" height="280" rx="22" fill="#f5c79d"/>
  <text class="heading" x="600" y="220" text-anchor="middle">CHANGE ARRIVES</text>
  <rect x="470" y="265" width="80" height="60" rx="25" fill="#faf7f0" stroke="#18211d" stroke-width="3"/>
  <rect x="560" y="265" width="80" height="60" rx="25" fill="#faf7f0" stroke="#18211d" stroke-width="3"/>
  <rect x="650" y="265" width="80" height="60" rx="25" fill="#faf7f0" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="510" y="304" text-anchor="middle">API</text>
  <text class="small" x="600" y="304" text-anchor="middle">TEAM</text>
  <text class="small" x="690" y="304" text-anchor="middle">USE</text>
  <text class="body" x="600" y="365" text-anchor="middle">New pressure</text>
  <text class="body" x="600" y="402" text-anchor="middle">on the code</text>

  <path class="line" d="M 750 295 H 830" marker-end="url(#arrow)"/>
  <rect class="card" x="830" y="155" width="300" height="280" rx="22" fill="#bdd9bf"/>
  <text class="heading" x="980" y="220" text-anchor="middle">ADAPTABLE?</text>
  <path d="M 905 320 C 930 245, 1030 245, 1055 320" fill="none" stroke="#18211d" stroke-width="4"/>
  <path d="M 1040 300 L 1055 320 L 1030 327" fill="none" stroke="#18211d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="body" x="980" y="375" text-anchor="middle">Safe, low-cost change</text>

  <path class="line" d="M 120 565 H 1080" marker-end="url(#arrow)"/>
  <line x1="220" y1="535" x2="220" y2="595" stroke="#18211d" stroke-width="4"/>
  <line x1="600" y1="535" x2="600" y2="595" stroke="#18211d" stroke-width="4"/>
  <line x1="980" y1="535" x2="980" y2="595" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="220" y="650" text-anchor="middle">TODAY</text>
  <text class="heading" x="600" y="650" text-anchor="middle">LATER</text>
  <text class="heading" x="980" y="650" text-anchor="middle">YEARS LATER</text>
</svg>
