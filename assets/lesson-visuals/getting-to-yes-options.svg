<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="getting-options-title getting-options-desc">
  <title id="getting-options-title">Separate invention from commitment</title>
  <desc id="getting-options-desc">A negotiation moves through four distinct stages: diagnose interests, invent several packages without commitment, evaluate those packages against fit, risk and fairness, then decide whether to propose, accept or decline.</desc>
  <defs>
    <marker id="getting-options-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="210" y="24" width="780" height="58" rx="29" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="62" text-anchor="middle" font-weight="700">EXPLORE WIDELY BEFORE COMMITTING NARROWLY</text>

  <path class="line" d="M265 350H295" marker-end="url(#getting-options-arrow)"/>
  <path class="line" d="M640 350H670" marker-end="url(#getting-options-arrow)"/>
  <path class="line" d="M905 350H935" marker-end="url(#getting-options-arrow)"/>

  <rect class="card" x="35" y="145" width="230" height="410" rx="22" fill="#f5c79d"/>
  <text class="small" x="75" y="187">STAGE 1</text>
  <text class="heading" x="150" y="232" text-anchor="middle">DIAGNOSE</text>
  <rect x="65" y="275" width="170" height="62" rx="16" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="150" y="315" text-anchor="middle">Interests</text>
  <rect x="65" y="354" width="170" height="62" rx="16" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="150" y="394" text-anchor="middle">Constraints</text>
  <rect x="65" y="433" width="170" height="62" rx="16" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="150" y="473" text-anchor="middle">Unknowns</text>

  <rect class="card" x="300" y="115" width="340" height="470" rx="22" fill="#e9d17f"/>
  <text class="small" x="340" y="157">STAGE 2</text>
  <text class="heading" x="470" y="202" text-anchor="middle">INVENT</text>
  <rect x="340" y="245" width="260" height="70" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="compact" x="470" y="289" text-anchor="middle">PACKAGE A</text>
  <rect x="340" y="335" width="260" height="70" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="compact" x="470" y="379" text-anchor="middle">PACKAGE B</text>
  <rect x="340" y="425" width="260" height="70" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="compact" x="470" y="469" text-anchor="middle">PACKAGE C</text>
  <text class="small" x="470" y="544" text-anchor="middle">NO COMMITMENT YET</text>

  <rect class="card" x="675" y="145" width="230" height="410" rx="22" fill="#b8d5e5"/>
  <text class="small" x="715" y="187">STAGE 3</text>
  <text class="heading" x="790" y="232" text-anchor="middle">EVALUATE</text>
  <rect x="705" y="275" width="170" height="62" rx="16" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="790" y="315" text-anchor="middle">Interest fit</text>
  <rect x="705" y="354" width="170" height="62" rx="16" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="790" y="394" text-anchor="middle">Risk</text>
  <rect x="705" y="433" width="170" height="62" rx="16" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="790" y="473" text-anchor="middle">Fairness</text>

  <rect class="card" x="940" y="145" width="225" height="410" rx="22" fill="#bdd9bf"/>
  <text class="small" x="980" y="187">STAGE 4</text>
  <text class="heading" x="1052.5" y="232" text-anchor="middle">DECIDE</text>
  <rect x="970" y="275" width="165" height="62" rx="16" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="1052.5" y="315" text-anchor="middle">Propose</text>
  <rect x="970" y="354" width="165" height="62" rx="16" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="1052.5" y="394" text-anchor="middle">Accept</text>
  <rect x="970" y="433" width="165" height="62" rx="16" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="1052.5" y="473" text-anchor="middle">Decline</text>

  <rect class="card" x="180" y="635" width="840" height="68" rx="34" fill="#fffdf8"/>
  <text class="heading" x="600" y="678" text-anchor="middle">INVENT FIRST, EVALUATE SECOND, COMMIT LAST</text>
</svg>
