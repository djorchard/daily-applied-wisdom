<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="gathering-authority-title gathering-authority-desc">
  <title id="gathering-authority-title">Generous authority directs host power toward three group responsibilities</title>
  <desc id="gathering-authority-desc">Purpose sits at the centre of a host's visible authority. Three outward paths lead to protecting guests from harmful domination, connecting guests to one another and temporarily equalising participation when ordinary status would otherwise control the room.</desc>
  <defs>
    <marker id="gathering-authority-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
      .heading { font-size: 32px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="358" y="30" width="484" height="62" rx="31" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="600" y="70" text-anchor="middle">POWER USED FOR THE GROUP</text>
  <circle cx="600" cy="350" r="150" fill="#d8cce8" stroke="#18211d" stroke-width="5"/>
  <circle cx="600" cy="350" r="100" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <text class="small" x="600" y="318" text-anchor="middle">HOST AUTHORITY</text>
  <text class="heading" x="600" y="365" text-anchor="middle">SERVES</text>
  <text class="heading" x="600" y="407" text-anchor="middle">PURPOSE</text>
  <path class="line" d="M480 262L378 194" marker-end="url(#gathering-authority-arrow)"/>
  <path class="line" d="M720 262L822 194" marker-end="url(#gathering-authority-arrow)"/>
  <path class="line" d="M600 500V572" marker-end="url(#gathering-authority-arrow)"/>
  <rect class="card" x="52" y="112" width="330" height="216" rx="24" fill="#f5c79d"/>
  <text class="heading" x="217" y="166" text-anchor="middle">PROTECT</text>
  <text class="body" x="217" y="210" text-anchor="middle">Stop domination</text>
  <text class="body" x="217" y="246" text-anchor="middle">and harmful conduct</text>
  <text class="small" x="217" y="282" text-anchor="middle">HOST OWNS</text>
  <text class="small" x="217" y="308" text-anchor="middle">THE BOUNDARY</text>
  <rect class="card" x="818" y="112" width="330" height="216" rx="24" fill="#b8d5e5"/>
  <text class="heading" x="983" y="166" text-anchor="middle">CONNECT</text>
  <text class="body" x="983" y="210" text-anchor="middle">Make introductions</text>
  <text class="body" x="983" y="246" text-anchor="middle">and shared work visible</text>
  <text class="small" x="983" y="282" text-anchor="middle">DO NOT LEAVE</text>
  <text class="small" x="983" y="308" text-anchor="middle">GUESTS TO CLIQUES</text>
  <rect class="card" x="350" y="566" width="500" height="166" rx="24" fill="#bdd9bf"/>
  <text class="heading" x="600" y="616" text-anchor="middle">TEMPORARILY EQUALISE</text>
  <text class="body" x="600" y="662" text-anchor="middle">Structure access so rank</text>
  <text class="body" x="600" y="698" text-anchor="middle">does not own the floor</text>
  <rect x="54" y="358" width="322" height="120" rx="22" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="215" y="404" text-anchor="middle">VISIBLE INTERVENTION</text>
  <text class="body" x="215" y="444" text-anchor="middle">not silent neutrality</text>
  <rect x="824" y="358" width="322" height="120" rx="22" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="985" y="404" text-anchor="middle">PROPORTIONATE POWER</text>
  <text class="body" x="985" y="444" text-anchor="middle">open to challenge</text>
</svg>
