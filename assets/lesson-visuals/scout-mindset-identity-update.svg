<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="scout-identity-title scout-identity-desc">
  <title id="scout-identity-title">Identity incentives can make revision costly or rewarding</title>
  <desc id="scout-identity-desc">In the upper lane, contrary evidence threatens an identity fused to a belief, prompting defence and leaving the map stale. In the lower lane, a truth-seeking identity treats evidence as a useful signal and revises the claim. Trust can grow when the group values such updates.</desc>
  <defs>
    <marker id="scout-identity-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
      .heading { font-size: 29px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="314" y="28" width="572" height="62" rx="31" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="600" y="68" text-anchor="middle">MAKE REVISION A STATUS GAIN</text>

  <rect class="card" x="38" y="130" width="1124" height="238" rx="28" fill="#f9d8d4"/>
  <text class="label" x="76" y="170">BELIEF FUSED TO IDENTITY</text>
  <rect class="card" x="72" y="204" width="214" height="112" rx="20" fill="#e9d17f"/>
  <text class="heading" x="179" y="250" text-anchor="middle">CONTRARY</text>
  <text class="heading" x="179" y="284" text-anchor="middle">EVIDENCE</text>
  <path class="line" d="M286 260H350" marker-end="url(#scout-identity-arrow)"/>
  <rect class="card" x="358" y="204" width="218" height="112" rx="20" fill="#f3a8a0"/>
  <text class="heading" x="467" y="250" text-anchor="middle">THREAT TO</text>
  <text class="heading" x="467" y="284" text-anchor="middle">ME OR US</text>
  <path class="line" d="M576 260H640" marker-end="url(#scout-identity-arrow)"/>
  <rect class="card" x="648" y="204" width="218" height="112" rx="20" fill="#fffdf8"/>
  <text class="heading" x="757" y="250" text-anchor="middle">DEFEND OR</text>
  <text class="heading" x="757" y="284" text-anchor="middle">AVOID</text>
  <path class="line" d="M866 260H930" marker-end="url(#scout-identity-arrow)"/>
  <rect class="card" x="938" y="204" width="190" height="112" rx="20" fill="#d8cce8"/>
  <text class="heading" x="1033" y="250" text-anchor="middle">STALE</text>
  <text class="heading" x="1033" y="284" text-anchor="middle">MAP</text>

  <rect class="card" x="38" y="400" width="1124" height="238" rx="28" fill="#dcebdc"/>
  <text class="label" x="76" y="440">TRUTH-SEEKING IDENTITY</text>
  <rect class="card" x="72" y="474" width="214" height="112" rx="20" fill="#e9d17f"/>
  <text class="heading" x="179" y="520" text-anchor="middle">CONTRARY</text>
  <text class="heading" x="179" y="554" text-anchor="middle">EVIDENCE</text>
  <path class="line" d="M286 530H350" marker-end="url(#scout-identity-arrow)"/>
  <rect class="card" x="358" y="474" width="218" height="112" rx="20" fill="#b8d5e5"/>
  <text class="heading" x="467" y="520" text-anchor="middle">USEFUL</text>
  <text class="heading" x="467" y="554" text-anchor="middle">SIGNAL</text>
  <path class="line" d="M576 530H640" marker-end="url(#scout-identity-arrow)"/>
  <rect class="card" x="648" y="474" width="218" height="112" rx="20" fill="#fffdf8"/>
  <text class="heading" x="757" y="520" text-anchor="middle">REVISE THE</text>
  <text class="heading" x="757" y="554" text-anchor="middle">CLAIM</text>
  <path class="line" d="M866 530H930" marker-end="url(#scout-identity-arrow)"/>
  <rect class="card" x="938" y="474" width="190" height="112" rx="20" fill="#bdd9bf"/>
  <text class="heading" x="1033" y="504" text-anchor="middle">TRUST</text>
  <text class="heading" x="1033" y="538" text-anchor="middle">CAN</text>
  <text class="heading" x="1033" y="572" text-anchor="middle">GROW</text>

  <rect x="254" y="668" width="692" height="62" rx="31" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="708" text-anchor="middle" font-weight="700">REWARD THE UPDATE, NOT PERFORMED CERTAINTY</text>
</svg>
