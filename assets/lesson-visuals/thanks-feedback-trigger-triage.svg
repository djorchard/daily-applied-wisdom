<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="tff-trigger-title tff-trigger-desc">
  <title id="tff-trigger-title">Use the trigger to diagnose what needs attention</title>
  <desc id="tff-trigger-desc">A feedback message reaches a triage point and branches to three cards. Truth examines the claim and evidence, relationship examines the source and shared history, and identity steadies the threatened self-story. All three branches lead to a deliberate choice to use, test, decline or seek support.</desc>
  <defs>
    <marker id="tff-trigger-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="326" y="28" width="548" height="62" rx="31" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="600" y="68" text-anchor="middle">A TRIGGER IS A DIAGNOSTIC SIGNAL</text>

  <rect class="card" x="350" y="116" width="500" height="94" rx="24" fill="#fffdf8"/>
  <text class="heading" x="600" y="156" text-anchor="middle">FEEDBACK ARRIVES</text>
  <text class="body" x="600" y="190" text-anchor="middle">Resistance, heat or shutdown appears</text>
  <path class="line" d="M600 210V238" marker-end="url(#tff-trigger-arrow)"/>
  <rect class="card" x="426" y="244" width="348" height="72" rx="24" fill="#d8cce8"/>
  <text class="heading" x="600" y="289" text-anchor="middle">WHAT IS ACTIVE?</text>

  <path class="line" d="M510 316C420 330 278 326 202 352" marker-end="url(#tff-trigger-arrow)"/>
  <path class="line" d="M600 316V348" marker-end="url(#tff-trigger-arrow)"/>
  <path class="line" d="M690 316C780 330 922 326 998 352" marker-end="url(#tff-trigger-arrow)"/>

  <rect class="card" x="34" y="356" width="352" height="230" rx="28" fill="#b8d5e5"/>
  <text class="label" x="210" y="400" text-anchor="middle">TRUTH TRIGGER</text>
  <text class="body" x="210" y="446" text-anchor="middle">The claim seems wrong,</text>
  <text class="body" x="210" y="480" text-anchor="middle">unfair or unhelpful</text>
  <rect x="66" y="512" width="288" height="56" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="210" y="548" text-anchor="middle">WHAT IS THE EVIDENCE?</text>

  <rect class="card" x="424" y="356" width="352" height="230" rx="28" fill="#f5c79d"/>
  <text class="label" x="600" y="400" text-anchor="middle">RELATIONSHIP TRIGGER</text>
  <text class="body" x="600" y="446" text-anchor="middle">The source, delivery</text>
  <text class="body" x="600" y="480" text-anchor="middle">or history dominates</text>
  <rect x="456" y="512" width="288" height="56" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="548" text-anchor="middle">WHAT + WHO?</text>

  <rect class="card" x="814" y="356" width="352" height="230" rx="28" fill="#e9d17f"/>
  <text class="label" x="990" y="400" text-anchor="middle">IDENTITY TRIGGER</text>
  <text class="body" x="990" y="446" text-anchor="middle">The message threatens</text>
  <text class="body" x="990" y="480" text-anchor="middle">the receiver's self-story</text>
  <rect x="846" y="512" width="288" height="56" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="990" y="548" text-anchor="middle">WHAT FEELS AT STAKE?</text>

  <path class="line" d="M210 586V622H500" marker-end="url(#tff-trigger-arrow)"/>
  <path class="line" d="M600 586V622" marker-end="url(#tff-trigger-arrow)"/>
  <path class="line" d="M990 586V622H700" marker-end="url(#tff-trigger-arrow)"/>
  <rect class="card" x="378" y="606" width="444" height="118" rx="28" fill="#bdd9bf"/>
  <text class="heading" x="600" y="650" text-anchor="middle">CHOOSE DELIBERATELY</text>
  <text class="body" x="600" y="690" text-anchor="middle">use · test · decline · seek support</text>
</svg>
