<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="ddd-language-title ddd-language-desc">
  <title id="ddd-language-title">A shared model language develops through conversation, examples, tests and code</title>
  <desc id="ddd-language-desc">Four connected cards show domain experts and developers shaping a shared phrase, testing it against examples and rules, and expressing it in the software model. A return path sends ambiguity, disagreement and failed examples back into the next conversation.</desc>
  <defs>
    <marker id="language-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .label { font-size: 25px; font-weight: 700; }
      .body { font-size: 23px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="185" y="20" width="830" height="64" rx="32" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="61" text-anchor="middle">THE LANGUAGE EARNS TRUST BY SURVIVING THE WHOLE LOOP</text>

  <rect class="card" x="30" y="158" width="250" height="330" rx="30" fill="#f8e0d2"/>
  <rect x="58" y="184" width="194" height="48" rx="24" fill="#c35f43"/>
  <text class="small" x="155" y="216" text-anchor="middle" fill="#fffdf8">DISCOVER</text>
  <circle cx="103" cy="296" r="38" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <circle cx="207" cy="296" r="38" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <text class="small" x="103" y="304" text-anchor="middle">EXP</text>
  <text class="small" x="207" y="304" text-anchor="middle">DEV</text>
  <path class="line" d="M141 296H169" marker-end="url(#language-arrow)"/>
  <text class="label" x="155" y="374" text-anchor="middle">SAY THE RULE</text>
  <text class="body" x="155" y="410" text-anchor="middle">actor · action</text>
  <text class="body" x="155" y="440" text-anchor="middle">condition · outcome</text>

  <path class="line" d="M280 323H314" marker-end="url(#language-arrow)"/>

  <rect class="card" x="320" y="158" width="250" height="330" rx="30" fill="#d8cce8"/>
  <rect x="348" y="184" width="194" height="48" rx="24" fill="#73568e"/>
  <text class="small" x="445" y="216" text-anchor="middle" fill="#fffdf8">NAME</text>
  <path d="M371 272H519V356H371Z" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <path d="M385 288H505M385 310H505M385 332H471" stroke="#8b799e" stroke-width="4" stroke-linecap="round"/>
  <text class="label" x="445" y="402" text-anchor="middle">SHARED PHRASE</text>
  <text class="body" x="445" y="438" text-anchor="middle">precise enough</text>
  <text class="body" x="445" y="468" text-anchor="middle">to disagree with</text>

  <path class="line" d="M570 323H604" marker-end="url(#language-arrow)"/>

  <rect class="card" x="610" y="158" width="250" height="330" rx="30" fill="#e9d17f"/>
  <rect x="638" y="184" width="194" height="48" rx="24" fill="#9b7b13"/>
  <text class="small" x="735" y="216" text-anchor="middle" fill="#fffdf8">CHALLENGE</text>
  <rect x="654" y="270" width="162" height="92" rx="20" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <path d="M676 302H794M676 330H766" stroke="#18211d" stroke-width="4" stroke-linecap="round"/>
  <text class="label" x="735" y="402" text-anchor="middle">EXAMPLES + TESTS</text>
  <text class="body" x="735" y="438" text-anchor="middle">Does the phrase fit</text>
  <text class="body" x="735" y="468" text-anchor="middle">the difficult case?</text>

  <path class="line" d="M860 323H894" marker-end="url(#language-arrow)"/>

  <rect class="card" x="900" y="158" width="270" height="330" rx="30" fill="#dcead9"/>
  <rect x="936" y="184" width="198" height="48" rx="24" fill="#4f7d67"/>
  <text class="small" x="1035" y="216" text-anchor="middle" fill="#fffdf8">EXPRESS</text>
  <path d="M958 270H1112V362H958Z" fill="#18211d" stroke="#18211d" stroke-width="4"/>
  <text class="small" x="979" y="302" fill="#faf7f0">rule()</text>
  <text class="body" x="979" y="334" fill="#b8d5e5">if example</text>
  <text class="label" x="1035" y="402" text-anchor="middle">MODEL BEHAVIOUR</text>
  <text class="body" x="1035" y="438" text-anchor="middle">speech, tests and code</text>
  <text class="body" x="1035" y="468" text-anchor="middle">use the same meaning</text>

  <path class="line" d="M1035 488V570H155V500" marker-end="url(#language-arrow)"/>
  <rect class="card" x="300" y="536" width="600" height="72" rx="28" fill="#fffdf8"/>
  <text class="small" x="600" y="566" text-anchor="middle">AMBIGUITY · DISAGREEMENT · FAILED EXAMPLE</text>
  <text class="body" x="600" y="596" text-anchor="middle">return evidence to the next conversation</text>

  <rect class="card" x="175" y="676" width="850" height="58" rx="29" fill="#fffdf8"/>
  <text class="small" x="600" y="713" text-anchor="middle">A GLOSSARY RECORDS WORDS; THE LOOP REFINES A WORKING MODEL</text>
</svg>
