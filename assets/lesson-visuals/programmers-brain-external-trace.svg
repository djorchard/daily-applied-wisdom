<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="programmers-brain-trace-title programmers-brain-trace-desc">
<title id="programmers-brain-trace-title">Externalise relationships before changing the code</title>
<desc id="programmers-brain-trace-desc">A dense method is represented by a dependency graph and a state table. Both feed a behaviour claim and a falsifying case, which then inform a separate decision about a test, documentation, or refactoring.</desc>
<defs>
  <style>text {font-family: Arial, sans-serif; fill: #18211d;}</style>
  <marker id="programmers-brain-trace-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#18211d"/></marker>
</defs>
<rect width="1200" height="760" fill="#faf7f0"/>
<text x="600" y="62" text-anchor="middle" font-size="34" font-weight="700">MOVE THE TRACE ONTO THE PAGE</text>
<rect x="70" y="110" width="250" height="130" rx="18" fill="#d7c4df" stroke="#18211d" stroke-width="3"/>
<text x="195" y="153" text-anchor="middle" font-size="25" font-weight="700">DENSE METHOD</text>
<text x="195" y="193" text-anchor="middle" font-size="24">Branches + retries</text>
<text x="195" y="222" text-anchor="middle" font-size="22">One status question</text>
<path d="M333 175H395V132H458" fill="none" stroke="#18211d" stroke-width="4" stroke-linejoin="round" marker-end="url(#programmers-brain-trace-arrow)"/>
<path d="M333 175H395V358H458" fill="none" stroke="#18211d" stroke-width="4" stroke-linejoin="round" marker-end="url(#programmers-brain-trace-arrow)"/>
<text x="640" y="101" text-anchor="middle" font-size="23" font-weight="700">STRUCTURE</text>
<rect x="470" y="114" width="340" height="230" rx="18" fill="#a9c7df" stroke="#18211d" stroke-width="3"/>
<circle cx="550" cy="187" r="34" fill="#faf7f0" stroke="#18211d" stroke-width="3"/>
<circle cx="690" cy="187" r="34" fill="#faf7f0" stroke="#18211d" stroke-width="3"/>
<circle cx="620" cy="283" r="34" fill="#faf7f0" stroke="#18211d" stroke-width="3"/>
<text x="550" y="195" text-anchor="middle" font-size="22" font-weight="700">input</text>
<text x="690" y="195" text-anchor="middle" font-size="22" font-weight="700">limit</text>
<text x="620" y="291" text-anchor="middle" font-size="22" font-weight="700">status</text>
<path d="M575 210L600 247" fill="none" stroke="#18211d" stroke-width="3" marker-end="url(#programmers-brain-trace-arrow)"/>
<path d="M665 210L640 247" fill="none" stroke="#18211d" stroke-width="3" marker-end="url(#programmers-brain-trace-arrow)"/>
<text x="640" y="328" text-anchor="middle" font-size="23">Dependency graph</text>
<text x="640" y="390" text-anchor="middle" font-size="23" font-weight="700">CHANGE OVER TIME</text>
<rect x="470" y="407" width="590" height="215" rx="18" fill="#e9d17f" stroke="#18211d" stroke-width="3"/>
<line x1="470" y1="462" x2="1060" y2="462" stroke="#18211d" stroke-width="3"/>
<line x1="610" y1="407" x2="610" y2="622" stroke="#18211d" stroke-width="3"/>
<line x1="835" y1="407" x2="835" y2="622" stroke="#18211d" stroke-width="3"/>
<line x1="470" y1="515" x2="1060" y2="515" stroke="#18211d" stroke-width="2"/>
<line x1="470" y1="568" x2="1060" y2="568" stroke="#18211d" stroke-width="2"/>
<text x="540" y="443" text-anchor="middle" font-size="22" font-weight="700">STEP</text>
<text x="723" y="443" text-anchor="middle" font-size="22" font-weight="700">CONDITION</text>
<text x="948" y="443" text-anchor="middle" font-size="22" font-weight="700">STATUS</text>
<text x="540" y="497" text-anchor="middle" font-size="23">1</text><text x="723" y="497" text-anchor="middle" font-size="23">valid</text><text x="948" y="497" text-anchor="middle" font-size="23">pending</text>
<text x="540" y="550" text-anchor="middle" font-size="23">2</text><text x="723" y="550" text-anchor="middle" font-size="23">timeout</text><text x="948" y="550" text-anchor="middle" font-size="23">retry</text>
<text x="540" y="603" text-anchor="middle" font-size="23">3</text><text x="723" y="603" text-anchor="middle" font-size="23">limit hit</text><text x="948" y="603" text-anchor="middle" font-size="23">failed</text>
<path d="M822 229H868" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#programmers-brain-trace-arrow)"/>
<rect x="880" y="112" width="250" height="220" rx="18" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
<text x="1005" y="154" text-anchor="middle" font-size="24" font-weight="700">BEHAVIOUR CLAIM</text>
<text x="1005" y="198" text-anchor="middle" font-size="23">At the retry limit,</text>
<text x="1005" y="229" text-anchor="middle" font-size="23">status becomes failed.</text>
<line x1="920" y1="250" x2="1090" y2="250" stroke="#18211d" stroke-width="2"/>
<text x="1005" y="282" text-anchor="middle" font-size="23" font-weight="700">FALSIFY IT</text>
<text x="1005" y="313" text-anchor="middle" font-size="22">Success on final retry?</text>
<path d="M1068 515H1145V360H1005V344" fill="none" stroke="#18211d" stroke-width="4" stroke-linejoin="round" marker-end="url(#programmers-brain-trace-arrow)"/>
<path d="M1130 300H1170V691H740" fill="none" stroke="#18211d" stroke-width="4" stroke-linejoin="round" marker-end="url(#programmers-brain-trace-arrow)"/>
<rect x="250" y="650" width="480" height="82" rx="18" fill="#e8b89c" stroke="#18211d" stroke-width="3"/>
<text x="490" y="684" text-anchor="middle" font-size="25" font-weight="700">THEN CHOOSE</text>
<text x="490" y="716" text-anchor="middle" font-size="23">Test, document, refactor or leave it</text>
</svg>
