<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="crucial-restore-safety-title crucial-restore-safety-desc"><title id="crucial-restore-safety-title">REPAIR THE DIALOGUE, THEN RETURN TO THE ISSUE</title><desc id="crucial-restore-safety-desc">A dialogue loop moves from discussing the issue to noticing withdrawal or pressure, checking respect and shared purpose, then returning to the original issue. The repair loop does not delete the unresolved problem.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#18211d}</style><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#18211d"/></marker></defs><rect width="1200" height="760" fill="#faf7f0"/><text x="600" y="65" text-anchor="middle" font-size="34">REPAIR THE DIALOGUE, THEN RETURN TO THE ISSUE</text><rect x="55" y="150" width="320" height="155" rx="18" fill="#a9c7df" stroke="#18211d" stroke-width="3"/><text x="215" y="198" text-anchor="middle" font-size="25">DISCUSS THE ISSUE</text><text x="215" y="245" text-anchor="middle" font-size="26">The release estimate</text><text x="215" y="282" text-anchor="middle" font-size="24">needs examination</text><path d="M375 227H467" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#arrow)"/><rect x="480" y="150" width="665" height="155" rx="18" fill="#e8b89c" stroke="#18211d" stroke-width="3"/><text x="812" y="198" text-anchor="middle" font-size="27">NOTICE A CHANGE</text><text x="812" y="246" text-anchor="middle" font-size="26">Withdrawal, interruptions or pressure</text><text x="812" y="282" text-anchor="middle" font-size="24">Check what is happening; do not assume.</text><path d="M812 305V384" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#arrow)"/><rect x="480" y="395" width="665" height="195" rx="18" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/><text x="812" y="441" text-anchor="middle" font-size="27">RESTORE PARTICIPATION</text><text x="812" y="485" text-anchor="middle" font-size="25">Respect: acknowledge your interruption</text><text x="812" y="529" text-anchor="middle" font-size="25">Purpose: explore a reliable commitment</text><text x="812" y="567" text-anchor="middle" font-size="24">Invite the concern you have missed</text><path d="M480 550H110V318" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#arrow)"/><text x="290" y="405" text-anchor="middle" font-size="24">RETURN</text><text x="290" y="450" text-anchor="middle" font-size="24">Keep the real</text><text x="290" y="485" text-anchor="middle" font-size="24">issue visible</text><text x="600" y="676" text-anchor="middle" font-size="26">A respectful discussion can still contain disagreement.</text><text x="600" y="716" text-anchor="middle" font-size="24">A quiet response does not prove that someone feels safe.</text></svg>
