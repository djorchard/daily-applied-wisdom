<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="ddia-envelope-title ddia-envelope-desc">
  <title id="ddia-envelope-title">A requirements envelope narrows data-system choices</title>
  <desc id="ddia-envelope-desc">A workload card containing operations, load shape and growth feeds a requirements envelope with reliability, tail latency, scale and evolvability. Three technology options are compared on the right, and only the option fitting the envelope proceeds.</desc>
  <defs>
    <marker id="ddia-envelope-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .detail { font-size: 22px; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .muted { fill: none; stroke: #53615a; stroke-width: 4; stroke-dasharray: 12 10; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="145" y="18" width="910" height="70" rx="35" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="61" text-anchor="middle" font-weight="700">CHOOSE AGAINST DEMANDS, NOT PRODUCT REPUTATION</text>

  <rect class="card" x="35" y="135" width="300" height="475" rx="34" fill="#b8d5e5"/>
  <text class="heading" x="185" y="184" text-anchor="middle">WORKLOAD</text>
  <rect x="65" y="215" width="240" height="82" rx="22" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="185" y="248" text-anchor="middle">OPERATIONS</text>
  <text class="body" x="185" y="278" text-anchor="middle">reads · writes · joins</text>
  <rect x="65" y="320" width="240" height="82" rx="22" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="185" y="353" text-anchor="middle">LOAD SHAPE</text>
  <text class="body" x="185" y="383" text-anchor="middle">rate · size · hot keys</text>
  <rect x="65" y="420" width="240" height="100" rx="22" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="185" y="458" text-anchor="middle">GROWTH</text>
  <text class="detail" x="185" y="490" text-anchor="middle">volume · regions</text>
  <text class="detail" x="185" y="515" text-anchor="middle">users</text>
  <text class="small" x="185" y="555" text-anchor="middle">ESTIMATES + RANGES</text>
  <path class="line" d="M335 372H390" marker-end="url(#ddia-envelope-arrow)"/>

  <path d="M420 135H770L835 205V540L770 610H420L385 540V205Z" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="610" y="174" text-anchor="middle">REQUIREMENTS</text>
  <text class="heading" x="610" y="207" text-anchor="middle">ENVELOPE</text>
  <rect x="430" y="230" width="360" height="68" rx="22" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="610" y="259" text-anchor="middle">RELIABILITY</text>
  <text class="detail" x="610" y="287" text-anchor="middle">what must remain correct?</text>
  <rect x="430" y="315" width="360" height="68" rx="22" fill="#e9d17f" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="610" y="344" text-anchor="middle">TAIL LATENCY</text>
  <text class="detail" x="610" y="372" text-anchor="middle">which percentile, under what load?</text>
  <rect x="430" y="400" width="360" height="68" rx="22" fill="#f5c79d" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="610" y="429" text-anchor="middle">SCALE</text>
  <text class="detail" x="610" y="457" text-anchor="middle">which parameter will increase?</text>
  <rect x="430" y="485" width="360" height="68" rx="22" fill="#d8cce8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="610" y="514" text-anchor="middle">EVOLVABILITY</text>
  <text class="detail" x="610" y="542" text-anchor="middle">what is likely to change?</text>
  <path class="line" d="M835 372H885" marker-end="url(#ddia-envelope-arrow)"/>

  <text class="heading" x="1020" y="150" text-anchor="middle">OPTIONS</text>
  <rect class="card" x="890" y="180" width="275" height="105" rx="26" fill="#fffdf8"/>
  <text class="small" x="1027" y="220" text-anchor="middle">OPTION A</text>
  <text class="detail" x="1027" y="257" text-anchor="middle">simple · known · enough?</text>
  <rect class="card" x="890" y="315" width="275" height="105" rx="26" fill="#fffdf8"/>
  <text class="small" x="1027" y="355" text-anchor="middle">OPTION B</text>
  <text class="detail" x="1027" y="392" text-anchor="middle">new power · new cost</text>
  <rect class="card" x="890" y="450" width="275" height="105" rx="26" fill="#bdd9bf"/>
  <text class="small" x="1027" y="490" text-anchor="middle">BEST FIT</text>
  <text class="detail" x="1027" y="527" text-anchor="middle">evidence matches</text>

  <path class="muted" d="M930 285V315"/>
  <path class="muted" d="M930 420V450"/>
  <rect class="card" x="110" y="630" width="980" height="105" rx="30" fill="#fffdf8"/>
  <text class="heading" x="600" y="672" text-anchor="middle">THE SIMPLEST FIT REMAINS A CANDIDATE</text>
  <text class="detail" x="600" y="711" text-anchor="middle">TEST ASSUMPTIONS · RECORD TRADE-OFFS · REVISE WITH EVIDENCE</text>
</svg>
