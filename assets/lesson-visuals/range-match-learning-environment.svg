<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="range-environment-title range-environment-desc">
  <title id="range-environment-title">Match learning strategy to the feedback environment</title>
  <desc id="range-environment-desc">A comparison shows that stable rules with fast, accurate feedback reward focused repetition, while changing rules with delayed or incomplete feedback call for broader examples, explicit checks and updating.</desc>
  <defs>
    <marker id="range-environment-arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0 0 L18 9 L0 18 Z" fill="#356987"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: .04em; }
      .body { font-size: 24px; }
      .small { font-size: 22px; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #356987; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="36" fill="#f5f1e8"/>
  <text x="70" y="68" class="label">READ THE LEARNING ENVIRONMENT FIRST</text>

  <rect class="card" x="70" y="115" width="475" height="420" rx="28" fill="#dbe8e2"/>
  <text x="307" y="165" class="label" text-anchor="middle">KINDER ENVIRONMENT</text>
  <text x="115" y="220" class="body">Rules repeat</text>
  <path class="line" d="M115 245 H470"/>
  <text x="115" y="298" class="body">Feedback arrives quickly</text>
  <path class="line" d="M115 323 H470"/>
  <text x="115" y="376" class="body">Results reveal errors clearly</text>
  <rect x="115" y="425" width="385" height="72" rx="20" fill="#2f6f5e"/>
  <text x="307" y="470" class="body" text-anchor="middle" style="fill:#ffffff">Focus and repeat with feedback</text>

  <rect class="card" x="655" y="115" width="475" height="420" rx="28" fill="#e8e0f2"/>
  <text x="892" y="165" class="label" text-anchor="middle">WICKED ENVIRONMENT</text>
  <text x="700" y="220" class="body">Rules change or stay hidden</text>
  <path class="line" d="M700 245 H1055"/>
  <text x="700" y="298" class="body">Feedback arrives late</text>
  <path class="line" d="M700 323 H1055"/>
  <text x="700" y="376" class="body">Outcomes mix skill and noise</text>
  <rect x="700" y="425" width="385" height="72" rx="20" fill="#5f4b8b"/>
  <text x="892" y="456" class="small" text-anchor="middle" style="fill:#ffffff">Broaden examples, test assumptions,</text>
  <text x="892" y="485" class="small" text-anchor="middle" style="fill:#ffffff">and update from multiple signals</text>

  <path class="line" d="M545 325 H638" marker-end="url(#range-environment-arrow)"/>

  <rect class="card" x="210" y="605" width="780" height="92" rx="24" fill="#fffdf8"/>
  <text x="600" y="642" class="label" text-anchor="middle">DO NOT COPY THE TRAINING METHOD BLINDLY</text>
  <text x="600" y="677" class="small" text-anchor="middle">Choose practice after checking rule stability and feedback quality.</text>
</svg>
