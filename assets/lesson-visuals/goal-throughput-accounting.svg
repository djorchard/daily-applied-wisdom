<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="goal-accounting-title goal-accounting-desc">
  <title id="goal-accounting-title">Three whole-system lenses interpreted for software delivery</title>
  <desc id="goal-accounting-desc">The formal Throughput Accounting lenses are throughput, inventory and operating expense. Each card pairs the formal lens with an explicitly labelled software-delivery question. A whole-system decision should improve their combination without damaging throughput.</desc>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="268" y="14" width="664" height="84" rx="30" fill="#f5c79d" stroke="#18211d" stroke-width="3"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18211d">SOFTWARE DELIVERY INTERPRETATION</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18211d">NOT FORMAL FINANCIAL REPORTING</text>

  <g font-family="Arial, sans-serif" fill="#18211d" stroke="#18211d" stroke-width="3">
    <rect x="38" y="122" width="352" height="454" rx="24" fill="#faf7f0"/>
    <rect x="424" y="122" width="352" height="454" rx="24" fill="#faf7f0"/>
    <rect x="810" y="122" width="352" height="454" rx="24" fill="#faf7f0"/>
    <path d="M38 206V146q0-24 24-24h304q24 0 24 24v60z" fill="#bdd9bf"/>
    <path d="M424 206V146q0-24 24-24h304q24 0 24 24v60z" fill="#e9d17f"/>
    <path d="M810 206V146q0-24 24-24h304q24 0 24 24v60z" fill="#d8cce8"/>
    <g stroke="none">
      <text x="214" y="174" text-anchor="middle" font-size="30" font-weight="700">THROUGHPUT ↑</text>
      <text x="600" y="174" text-anchor="middle" font-size="30" font-weight="700">INVENTORY ↓</text>
      <text x="986" y="158" text-anchor="middle" font-size="30" font-weight="700">OPERATING</text>
      <text x="986" y="192" text-anchor="middle" font-size="30" font-weight="700">EXPENSE ↓</text>

      <text x="68" y="252" font-size="24" font-weight="700">FORMAL LENS</text>
      <text x="68" y="294" font-size="24">Rate the system generates</text>
      <text x="68" y="328" font-size="24">money through sales</text>
      <line x1="68" y1="356" x2="360" y2="356" stroke="#18211d" stroke-width="3"/>
      <text x="68" y="402" font-size="24" font-weight="700">SOFTWARE QUESTION</text>
      <text x="68" y="444" font-size="24">Does the change increase</text>
      <text x="68" y="478" font-size="24">useful outcomes delivered?</text>

      <text x="454" y="252" font-size="24" font-weight="700">FORMAL LENS</text>
      <text x="454" y="294" font-size="24">Money invested in things</text>
      <text x="454" y="328" font-size="24">intended for sale</text>
      <line x1="454" y1="356" x2="746" y2="356" stroke="#18211d" stroke-width="3"/>
      <text x="454" y="402" font-size="24" font-weight="700">SOFTWARE QUESTION</text>
      <text x="454" y="444" font-size="24">Does it reduce work or</text>
      <text x="454" y="478" font-size="24">investment tied up before</text>
      <text x="454" y="512" font-size="24">value is realised?</text>

      <text x="840" y="252" font-size="24" font-weight="700">FORMAL LENS</text>
      <text x="840" y="294" font-size="24">Money spent to turn</text>
      <text x="840" y="328" font-size="24">inventory into throughput</text>
      <line x1="840" y1="356" x2="1132" y2="356" stroke="#18211d" stroke-width="3"/>
      <text x="840" y="402" font-size="24" font-weight="700">SOFTWARE QUESTION</text>
      <text x="840" y="444" font-size="24">Does it reduce ongoing</text>
      <text x="840" y="478" font-size="24">effort or spend?</text>
    </g>
  </g>

  <rect x="150" y="620" width="900" height="112" rx="24" fill="#b8d5e5" stroke="#18211d" stroke-width="4"/>
  <text x="600" y="666" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#18211d">WHOLE-SYSTEM DECISION</text>
  <text x="600" y="706" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#18211d">Improve the combination; reject local savings that reduce throughput</text>
</svg>
