<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="first-90-situation-fit-title first-90-situation-fit-desc">
<title id="first-90-situation-fit-title">Five situations suggest different priorities</title><desc id="first-90-situation-fit-desc">Five equal rows map the STARS situations to possible priorities. They are startup: build essentials; turnaround: stabilise urgent trouble; accelerated growth: expand capacity; realignment: correct drift; sustaining success: renew what works. They are alternatives that can coexist across parts of a role, not ordered stages.</desc>
<defs><style>text {font-family: Arial, sans-serif; fill: #18211d;}</style><marker id="first-90-situation-fit-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#18211d"/></marker></defs>
<rect width="1200" height="760" fill="#faf7f0"/>
<text x="600" y="62" text-anchor="middle" font-size="32" font-weight="700">DIFFERENT CONDITIONS, DIFFERENT MOVES</text>
<text x="292" y="117" text-anchor="middle" font-size="24" font-weight="700">SITUATION</text>
<text x="870" y="117" text-anchor="middle" font-size="24" font-weight="700">PRIORITY TO CONSIDER</text>
<rect x="60" y="144" width="460" height="86" rx="18" fill="#a9c7df" stroke="#18211d" stroke-width="3"/><text x="290" y="197" text-anchor="middle" font-size="27" font-weight="700">STARTUP</text><path d="M535 187H641" fill="none" stroke="#18211d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#first-90-situation-fit-arrow)"/><rect x="660" y="144" width="480" height="86" rx="18" fill="#faf7f0" stroke="#18211d" stroke-width="3"/><text x="900" y="197" text-anchor="middle" font-size="30" font-weight="400">Build the essentials</text>
<rect x="60" y="248" width="460" height="86" rx="18" fill="#e8b89c" stroke="#18211d" stroke-width="3"/><text x="290" y="301" text-anchor="middle" font-size="27" font-weight="700">TURNAROUND</text><path d="M535 291H641" fill="none" stroke="#18211d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#first-90-situation-fit-arrow)"/><rect x="660" y="248" width="480" height="86" rx="18" fill="#faf7f0" stroke="#18211d" stroke-width="3"/><text x="900" y="301" text-anchor="middle" font-size="30" font-weight="400">Stabilise urgent trouble</text>
<rect x="60" y="352" width="460" height="86" rx="18" fill="#e9d17f" stroke="#18211d" stroke-width="3"/><text x="290" y="405" text-anchor="middle" font-size="27" font-weight="700">ACCELERATED GROWTH</text><path d="M535 395H641" fill="none" stroke="#18211d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#first-90-situation-fit-arrow)"/><rect x="660" y="352" width="480" height="86" rx="18" fill="#faf7f0" stroke="#18211d" stroke-width="3"/><text x="900" y="405" text-anchor="middle" font-size="30" font-weight="400">Expand capacity</text>
<rect x="60" y="456" width="460" height="86" rx="18" fill="#c9b9da" stroke="#18211d" stroke-width="3"/><text x="290" y="509" text-anchor="middle" font-size="27" font-weight="700">REALIGNMENT</text><path d="M535 499H641" fill="none" stroke="#18211d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#first-90-situation-fit-arrow)"/><rect x="660" y="456" width="480" height="86" rx="18" fill="#faf7f0" stroke="#18211d" stroke-width="3"/><text x="900" y="509" text-anchor="middle" font-size="30" font-weight="400">Correct the drift</text>
<rect x="60" y="560" width="460" height="86" rx="18" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/><text x="290" y="613" text-anchor="middle" font-size="27" font-weight="700">SUSTAINING SUCCESS</text><path d="M535 603H641" fill="none" stroke="#18211d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#first-90-situation-fit-arrow)"/><rect x="660" y="560" width="480" height="86" rx="18" fill="#faf7f0" stroke="#18211d" stroke-width="3"/><text x="900" y="613" text-anchor="middle" font-size="30" font-weight="400">Renew what works</text>
<text x="600" y="718" text-anchor="middle" font-size="27" font-weight="400">Diagnose each area. These are lenses, not a maturity ladder.</text>
</svg>
