<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="debugging-verify-repair-title debugging-verify-repair-desc">
  <title id="debugging-verify-repair-title">Compare a repair by controlled removal and reapplication</title>
  <desc id="debugging-verify-repair-desc">Four isolated runs use the same failing case and relevant environment. Original code fails; with the repair it passes; removing the repair restores the failure; reapplying it passes again. This is evidence about this defect, not proof that every defect is absent.</desc>
  <defs><marker id="debugging-verify-repair-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#18211d"/></marker><style>text {font-family: Arial, sans-serif; fill: #18211d;}</style></defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <text x="600" y="74" text-anchor="middle" font-size="34" font-weight="700">DOES THE RESULT FOLLOW THE REPAIR?</text>
  <rect x="85" y="117" width="1030" height="78" rx="20" fill="#a9c7df" stroke="#18211d" stroke-width="4"/>
  <text x="600" y="168" text-anchor="middle" font-size="30" font-weight="700">Hold the input and relevant environment fixed.</text>
  <rect x="55" y="252" width="235" height="286" rx="20" fill="#e8b89c" stroke="#18211d" stroke-width="4"/>
  <text x="172" y="305" text-anchor="middle" font-size="30" font-weight="700">ORIGINAL</text>
  <text x="172" y="352" text-anchor="middle" font-size="30" font-weight="400">code</text>
  <text x="172" y="469" text-anchor="middle" font-size="40" font-weight="700">FAIL</text>
  <rect x="340" y="252" width="235" height="286" rx="20" fill="#bdd9bf" stroke="#18211d" stroke-width="4"/>
  <text x="457" y="305" text-anchor="middle" font-size="30" font-weight="700">APPLY</text>
  <text x="457" y="352" text-anchor="middle" font-size="30" font-weight="400">repair</text>
  <text x="457" y="469" text-anchor="middle" font-size="40" font-weight="700">PASS</text>
  <rect x="625" y="252" width="235" height="286" rx="20" fill="#e8b89c" stroke="#18211d" stroke-width="4"/>
  <text x="742" y="305" text-anchor="middle" font-size="30" font-weight="700">REMOVE</text>
  <text x="742" y="352" text-anchor="middle" font-size="30" font-weight="400">repair</text>
  <text x="742" y="469" text-anchor="middle" font-size="40" font-weight="700">FAIL</text>
  <rect x="910" y="252" width="235" height="286" rx="20" fill="#bdd9bf" stroke="#18211d" stroke-width="4"/>
  <text x="1027" y="305" text-anchor="middle" font-size="30" font-weight="700">REAPPLY</text>
  <text x="1027" y="352" text-anchor="middle" font-size="30" font-weight="400">repair</text>
  <text x="1027" y="469" text-anchor="middle" font-size="40" font-weight="700">PASS</text>
  <path d="M297 392H330" fill="none" stroke="#18211d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#debugging-verify-repair-arrow)"/>
  <path d="M582 392H615" fill="none" stroke="#18211d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#debugging-verify-repair-arrow)"/>
  <path d="M867 392H900" fill="none" stroke="#18211d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#debugging-verify-repair-arrow)"/>
  <text x="600" y="606" text-anchor="middle" font-size="30" font-weight="700">Run the comparison in an isolated test environment.</text>
  <text x="600" y="660" text-anchor="middle" font-size="28" font-weight="400">Never recreate customer impact to obtain proof.</text>
  <text x="600" y="712" text-anchor="middle" font-size="28" font-weight="400">For intermittent failures, one sequence is not enough.</text>
</svg>
