<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="cd-batches-title cd-batches-desc">
  <title id="cd-batches-title">Small batches shorten the distance from change to feedback</title>
  <desc id="cd-batches-desc">The left side shows several interacting changes accumulating before a distant check. The right side shows one coherent change integrated, checked and either repaired or followed by the next small change.</desc>
  <defs>
    <marker id="cd-batches-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="358" y="28" width="484" height="62" rx="31" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="600" y="68" text-anchor="middle">CHANGE-TO-FEEDBACK DISTANCE</text>

  <rect class="card" x="54" y="128" width="500" height="530" rx="28" fill="#f5c79d"/>
  <text class="heading" x="304" y="184" text-anchor="middle">DELAYED LARGE BATCH</text>
  <text class="body" x="304" y="224" text-anchor="middle">many assumptions meet at once</text>
  <rect x="84" y="272" width="136" height="70" rx="16" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="152" y="315" text-anchor="middle">CHANGE A</text>
  <rect x="236" y="272" width="136" height="70" rx="16" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="304" y="315" text-anchor="middle">CHANGE B</text>
  <rect x="388" y="272" width="136" height="70" rx="16" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="456" y="315" text-anchor="middle">CHANGE C</text>
  <path class="line" d="M152 342V400H304M304 342V400M456 342V400H304V448" marker-end="url(#cd-batches-arrow)"/>
  <rect x="164" y="454" width="280" height="90" rx="22" fill="#f3a8a0" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="304" y="493" text-anchor="middle">LATE CHECK</text>
  <text class="body" x="304" y="528" text-anchor="middle">which interaction failed?</text>
  <text class="small" x="304" y="610" text-anchor="middle">WIDE DIAGNOSTIC SURFACE</text>

  <rect class="card" x="646" y="128" width="500" height="530" rx="28" fill="#bdd9bf"/>
  <text class="heading" x="896" y="184" text-anchor="middle">SMALL RELEASABLE BATCH</text>
  <text class="body" x="896" y="224" text-anchor="middle">one coherent change per loop</text>
  <rect x="718" y="278" width="180" height="88" rx="20" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <text class="small" x="808" y="314" text-anchor="middle">INTEGRATE</text>
  <text class="body" x="808" y="347" text-anchor="middle">one slice</text>
  <path class="line" d="M898 322H984" marker-end="url(#cd-batches-arrow)"/>
  <rect x="990" y="278" width="112" height="88" rx="20" fill="#e9d17f" stroke="#18211d" stroke-width="4"/>
  <text class="small" x="1046" y="314" text-anchor="middle">CHECK</text>
  <text class="body" x="1046" y="347" text-anchor="middle">now</text>
  <path class="line" d="M1046 366V452H896" marker-end="url(#cd-batches-arrow)"/>
  <rect x="758" y="458" width="276" height="92" rx="22" fill="#b8d5e5" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="896" y="497" text-anchor="middle">RESPOND</text>
  <text class="body" x="896" y="532" text-anchor="middle">repair or continue</text>
  <path class="line" d="M758 504H698V322H710" marker-end="url(#cd-batches-arrow)"/>
  <text class="small" x="896" y="610" text-anchor="middle">NARROW DIAGNOSTIC SURFACE</text>

  <rect x="260" y="680" width="680" height="52" rx="26" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="714" text-anchor="middle" font-weight="700">SMALL BATCHES NARROW THE SEARCH, NOT THE RISK</text>
</svg>
