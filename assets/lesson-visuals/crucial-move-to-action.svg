<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="crucial-move-to-action-title crucial-move-to-action-desc"><title id="crucial-move-to-action-title">TURN SHARED UNDERSTANDING INTO ACTION</title><desc id="crucial-move-to-action-desc">Three stages separate shared understanding, an explicit decision method, and a commitment card with owner, outcome, deadline and follow-up. A feedback arrow returns new evidence to the discussion.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#18211d}</style><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#18211d"/></marker></defs><rect width="1200" height="760" fill="#faf7f0"/><text x="600" y="65" text-anchor="middle" font-size="34">TURN SHARED UNDERSTANDING INTO ACTION</text><rect x="45" y="150" width="300" height="170" rx="18" fill="#a9c7df" stroke="#18211d" stroke-width="3"/><text x="195" y="193" text-anchor="middle" font-size="25">1. UNDERSTAND</text><text x="195" y="240" text-anchor="middle" font-size="26">Gather concerns</text><text x="195" y="282" text-anchor="middle" font-size="26">and evidence</text><path d="M345 234H416" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#arrow)"/><rect x="430" y="150" width="320" height="170" rx="18" fill="#e9d17f" stroke="#18211d" stroke-width="3"/><text x="590" y="193" text-anchor="middle" font-size="25">2. DECIDE</text><text x="590" y="240" text-anchor="middle" font-size="26">Who has authority?</text><text x="590" y="282" text-anchor="middle" font-size="25">Which method?</text><path d="M750 234H826" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#arrow)"/><rect x="840" y="150" width="315" height="170" rx="18" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/><text x="997" y="193" text-anchor="middle" font-size="25">3. COMMIT</text><text x="997" y="240" text-anchor="middle" font-size="26">Confirm capacity</text><text x="997" y="282" text-anchor="middle" font-size="25">and acceptance</text><path d="M997 320V386" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#arrow)"/><rect x="260" y="400" width="895" height="200" rx="18" fill="#ffffff" stroke="#18211d" stroke-width="3"/><text x="707" y="442" text-anchor="middle" font-size="27">COMMITMENT CARD</text><text x="707" y="487" text-anchor="middle" font-size="26">Owner: Alex   |   Outcome: draft checklist</text><text x="707" y="532" text-anchor="middle" font-size="25">Due: Friday, 3 pm   |   Review: Monday, 10 am</text><text x="707" y="573" text-anchor="middle" font-size="24">Confirm real dates and dependencies together.</text><path d="M260 500H195V334" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#arrow)"/><text x="600" y="675" text-anchor="middle" font-size="27">New evidence can reopen the plan.</text><text x="600" y="716" text-anchor="middle" font-size="24">Consultation gives people a voice; it does not automatically give a veto.</text></svg>
