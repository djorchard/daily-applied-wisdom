<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="ddia-timeout-title ddia-timeout-desc">
  <title id="ddia-timeout-title">A timeout hides several possible remote outcomes</title>
  <desc id="ddia-timeout-desc">A client sends one operation to a service and observes a timeout. Three branches show that the request may be lost, the server may still be working, or the response may be lost after commit. A safe recovery path preserves one operation ID, checks status and reconciles unresolved work.</desc>
  <defs>
    <marker id="ddia-timeout-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .uncertain { fill: none; stroke: #d86136; stroke-width: 5; stroke-dasharray: 13 10; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="155" y="18" width="890" height="70" rx="35" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="61" text-anchor="middle" font-weight="700">NO RESPONSE IS AN OBSERVATION, NOT A REMOTE VERDICT</text>

  <rect class="card" x="55" y="125" width="250" height="110" rx="28" fill="#b8d5e5"/>
  <text class="heading" x="180" y="172" text-anchor="middle">CLIENT</text>
  <text class="body" x="180" y="207" text-anchor="middle">operation ID 7F3</text>
  <path class="line" d="M305 180H500" marker-end="url(#ddia-timeout-arrow)"/>
  <text class="small" x="402" y="158" text-anchor="middle">SEND ONCE</text>
  <rect class="card" x="500" y="120" width="200" height="120" rx="30" fill="#e9d17f"/>
  <text class="heading" x="600" y="168" text-anchor="middle">SERVICE</text>
  <text class="body" x="600" y="207" text-anchor="middle">remote side effect</text>
  <path class="uncertain" d="M700 180H865"/>
  <rect class="card" x="865" y="125" width="280" height="110" rx="28" fill="#f5c79d"/>
  <text class="heading" x="1005" y="172" text-anchor="middle">TIMEOUT</text>
  <text class="body" x="1005" y="207" text-anchor="middle">outcome = unknown</text>

  <path class="line" d="M600 240V285H200V325" marker-end="url(#ddia-timeout-arrow)"/>
  <path class="line" d="M600 240V325" marker-end="url(#ddia-timeout-arrow)"/>
  <path class="line" d="M600 240V285H1000V325" marker-end="url(#ddia-timeout-arrow)"/>

  <rect class="card" x="45" y="325" width="310" height="155" rx="30" fill="#fffdf8"/>
  <text class="small" x="200" y="368" text-anchor="middle">POSSIBILITY 1</text>
  <text class="heading" x="200" y="414" text-anchor="middle">REQUEST LOST</text>
  <text class="body" x="200" y="452" text-anchor="middle">nothing executed</text>
  <rect class="card" x="445" y="325" width="310" height="155" rx="30" fill="#fffdf8"/>
  <text class="small" x="600" y="368" text-anchor="middle">POSSIBILITY 2</text>
  <text class="heading" x="600" y="414" text-anchor="middle">STILL WORKING</text>
  <text class="body" x="600" y="452" text-anchor="middle">completion undecided</text>
  <rect class="card" x="845" y="325" width="310" height="155" rx="30" fill="#fffdf8"/>
  <text class="small" x="1000" y="368" text-anchor="middle">POSSIBILITY 3</text>
  <text class="heading" x="1000" y="414" text-anchor="middle">RESPONSE LOST</text>
  <text class="body" x="1000" y="452" text-anchor="middle">side effect committed</text>

  <path class="line" d="M200 480V520H600"/>
  <path class="line" d="M600 480V555" marker-end="url(#ddia-timeout-arrow)"/>
  <path class="line" d="M1000 480V520H600"/>
  <rect class="card" x="70" y="555" width="1060" height="165" rx="38" fill="#bdd9bf"/>
  <text class="heading" x="600" y="598" text-anchor="middle">MANAGE THE UNKNOWN STATE</text>
  <rect x="105" y="625" width="285" height="58" rx="24" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="247" y="662" text-anchor="middle">KEEP ONE ID</text>
  <path class="line" d="M390 654H445" marker-end="url(#ddia-timeout-arrow)"/>
  <rect x="445" y="625" width="285" height="58" rx="24" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="587" y="662" text-anchor="middle">CHECK STATUS</text>
  <path class="line" d="M730 654H785" marker-end="url(#ddia-timeout-arrow)"/>
  <rect x="785" y="625" width="310" height="58" rx="24" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="940" y="662" text-anchor="middle">RECONCILE</text>
</svg>
