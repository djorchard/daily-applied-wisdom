<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="defusion-gap-title defusion-gap-desc">
  <title id="defusion-gap-title">Defusion creates a choice gap around a sticky thought</title>
  <desc id="defusion-gap-desc">The same thought, I will fail, enters two relationships. When fused, it acts as a fact and command that narrows behaviour toward avoidance or overcontrol. When noticed as a story offered by the mind, it can be checked against evidence and followed by a chosen small step or deliberate pause.</desc>
  <defs>
    <marker id="defusion-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 31px; font-weight: 700; }
      .label { font-size: 25px; font-weight: 700; }
      .body { font-size: 23px; }
      .small { font-size: 22px; font-weight: 700; }
      .choice { font-size: 22px; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="238" y="20" width="724" height="64" rx="32" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="61" text-anchor="middle">DEFUSION CHANGES AUTHORITY, NOT THE WORDS</text>

  <path d="M48 286Q48 236 98 236H244Q294 236 294 286V412Q294 462 244 462H154L105 515L112 462H98Q48 462 48 412Z" fill="#d8cce8" stroke="#18211d" stroke-width="4"/>
  <text class="small" x="171" y="287" text-anchor="middle">THE THOUGHT</text>
  <text class="heading" x="171" y="351" text-anchor="middle">I WILL</text>
  <text class="heading" x="171" y="389" text-anchor="middle">FAIL</text>
  <text class="body" x="171" y="434" text-anchor="middle">same words</text>

  <path class="line" d="M294 320H354V205H410" marker-end="url(#defusion-arrow)"/>
  <path class="line" d="M294 400H354V548H410" marker-end="url(#defusion-arrow)"/>

  <rect class="card" x="414" y="116" width="355" height="190" rx="30" fill="#f8e0d2"/>
  <rect x="444" y="140" width="158" height="46" rx="23" fill="#c35f43"/>
  <text class="small" x="523" y="171" text-anchor="middle" fill="#fffdf8">FUSED</text>
  <text class="label" x="592" y="225" text-anchor="middle">FACT + COMMAND</text>
  <text class="body" x="592" y="263" text-anchor="middle">The thought decides alone</text>
  <path class="line" d="M769 211H827" marker-end="url(#defusion-arrow)"/>

  <rect class="card" x="836" y="116" width="320" height="190" rx="30" fill="#f5c79d"/>
  <text class="label" x="996" y="166" text-anchor="middle">NARROW RESPONSE</text>
  <rect x="872" y="194" width="112" height="70" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="928" y="237" text-anchor="middle">avoid</text>
  <rect x="1004" y="194" width="116" height="70" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="1062" y="222" text-anchor="middle">over-</text>
  <text class="body" x="1062" y="250" text-anchor="middle">control</text>

  <rect class="card" x="414" y="414" width="355" height="268" rx="30" fill="#dcead9"/>
  <rect x="444" y="438" width="184" height="46" rx="23" fill="#4f7d67"/>
  <text class="small" x="536" y="469" text-anchor="middle" fill="#fffdf8">DEFUSED</text>
  <text class="body" x="592" y="526" text-anchor="middle">I notice my mind is</text>
  <text class="body" x="592" y="558" text-anchor="middle">offering the story that</text>
  <text class="label" x="592" y="606" text-anchor="middle">I WILL FAIL</text>
  <text class="body" x="592" y="647" text-anchor="middle">A thought, not the only input</text>
  <path class="line" d="M769 548H827" marker-end="url(#defusion-arrow)"/>

  <rect class="card" x="836" y="395" width="320" height="306" rx="30" fill="#b8d5e5"/>
  <text class="label" x="996" y="445" text-anchor="middle">CHOICE GAP</text>
  <rect x="856" y="474" width="280" height="58" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="choice" x="996" y="511" text-anchor="middle">check relevant evidence</text>
  <rect x="856" y="550" width="280" height="58" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="choice" x="996" y="587" text-anchor="middle">take one useful step</text>
  <rect x="856" y="626" width="280" height="58" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="choice" x="996" y="663" text-anchor="middle">pause on purpose</text>

  <text class="small" x="600" y="734" text-anchor="middle">THE THOUGHT MAY MATTER; IT DOES NOT HAVE TO DECIDE ALONE</text>
</svg>
