<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="art-game-iteration-title art-game-iteration-desc">
  <title id="art-game-iteration-title">A focused game-design iteration loop</title>
  <desc id="art-game-iteration-desc">A six-step loop moves from one lens question to an experience hypothesis, a cheap honest prototype, an uncoached target-player test, an observed decision and one evidence-linked change. An alternative explanation is recorded before the loop repeats.</desc>
  <defs>
    <marker id="art-game-iteration-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="170" y="18" width="860" height="70" rx="35" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="61" text-anchor="middle" font-weight="700">ONE QUESTION · CHEAPEST HONEST TEST · ONE RECORDED CHANGE</text>

  <rect class="card" x="40" y="135" width="245" height="145" rx="26" fill="#f5c79d"/>
  <text class="small" x="162" y="176" text-anchor="middle">1 · SELECT</text>
  <text class="compact" x="162" y="216" text-anchor="middle">LENS QUESTION</text>
  <text class="body" x="162" y="253" text-anchor="middle">What is uncertain?</text>

  <path class="line" d="M285 207H330" marker-end="url(#art-game-iteration-arrow)"/>

  <rect class="card" x="345" y="135" width="245" height="145" rx="26" fill="#e9d17f"/>
  <text class="small" x="467" y="176" text-anchor="middle">2 · STATE</text>
  <text class="compact" x="467" y="216" text-anchor="middle">HYPOTHESIS</text>
  <text class="body" x="467" y="253" text-anchor="middle">What should happen?</text>

  <path class="line" d="M590 207H635" marker-end="url(#art-game-iteration-arrow)"/>

  <rect class="card" x="650" y="135" width="245" height="145" rx="26" fill="#b8d5e5"/>
  <text class="small" x="772" y="176" text-anchor="middle">3 · BUILD</text>
  <text class="small" x="772" y="216" text-anchor="middle">CHEAP PROTOTYPE</text>
  <text class="body" x="772" y="253" text-anchor="middle">Keep essential feel</text>

  <path class="line" d="M895 207H940" marker-end="url(#art-game-iteration-arrow)"/>

  <rect class="card" x="955" y="135" width="205" height="145" rx="26" fill="#d8cce8"/>
  <text class="small" x="1057" y="176" text-anchor="middle">4 · TEST</text>
  <text class="small" x="1057" y="216" text-anchor="middle">TARGET PLAYER</text>
  <text class="body" x="1057" y="253" text-anchor="middle">Do not coach</text>

  <path class="line" d="M1057 280V392" marker-end="url(#art-game-iteration-arrow)"/>

  <rect class="card" x="860" y="407" width="300" height="155" rx="26" fill="#bdd9bf"/>
  <text class="small" x="1010" y="448" text-anchor="middle">5 · OBSERVE</text>
  <text class="small" x="1010" y="488" text-anchor="middle">CHOICE · PAUSE · ERROR</text>
  <text class="body" x="1010" y="528" text-anchor="middle">Compare with the threshold</text>

  <path class="line" d="M860 484H775" marker-end="url(#art-game-iteration-arrow)"/>

  <rect class="card" x="460" y="407" width="300" height="155" rx="26" fill="#f5c79d"/>
  <text class="small" x="610" y="448" text-anchor="middle">6 · CHANGE</text>
  <text class="compact" x="610" y="488" text-anchor="middle">ONE ASSUMPTION</text>
  <text class="body" x="610" y="528" text-anchor="middle">Link decision to evidence</text>

  <path class="line" d="M460 484H375" marker-end="url(#art-game-iteration-arrow)"/>

  <rect class="card" x="40" y="407" width="320" height="155" rx="26" fill="#fffdf8"/>
  <text class="small" x="200" y="448" text-anchor="middle">BEFORE REPEATING</text>
  <text class="compact" x="200" y="488" text-anchor="middle">ALTERNATIVE CAUSE</text>
  <text class="body" x="200" y="528" text-anchor="middle">What else explains it?</text>

  <path class="line" d="M110 407V340H85V300H162V285" marker-end="url(#art-game-iteration-arrow)"/>

  <rect x="215" y="630" width="770" height="86" rx="28" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="600" y="670" text-anchor="middle">LENSES ASK; PLAYERS SUPPLY EVIDENCE</text>
  <text class="body" x="600" y="704" text-anchor="middle">Stop when the next loop costs more than the decision is worth</text>
</svg>
