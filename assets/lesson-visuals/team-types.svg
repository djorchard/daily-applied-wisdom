<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="team-types-title team-types-desc">
  <title id="team-types-title">Four distinct team types support fast flow</title>
  <desc id="team-types-desc">A stream-aligned team owns a flow of value. An enabling team coaches temporarily, a platform team provides self-service capabilities, and a complicated-subsystem team owns specialist technology behind a clear interface. Connector lines show support rather than reporting hierarchy.</desc>
  <defs>
    <marker id="value-flow-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1l10 5-10 5" fill="none" stroke="#18211d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="238" y="30" width="724" height="58" rx="29" fill="#faf7f0" stroke="#18211d" stroke-width="3"/>
  <text x="600" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18211d">RELATIONSHIPS SHOW SUPPORT — NOT REPORTING LINES</text>

  <g fill="none" stroke="#18211d" stroke-width="4" stroke-linecap="round">
    <path d="M222 252L468 350"/>
    <path d="M978 252L732 350"/>
    <path d="M600 530V608"/>
  </g>
  <rect x="178" y="272" width="264" height="50" rx="25" fill="#faf7f0" stroke="#18211d" stroke-width="3"/>
  <text x="310" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18211d">temporary coaching</text>
  <rect x="746" y="272" width="286" height="50" rx="25" fill="#faf7f0" stroke="#18211d" stroke-width="3"/>
  <text x="889" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18211d">self-service capability</text>
  <rect x="630" y="544" width="304" height="50" rx="25" fill="#faf7f0" stroke="#18211d" stroke-width="3"/>
  <text x="782" y="577" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18211d">clear specialist interface</text>

  <g font-family="Arial, sans-serif" fill="#18211d" stroke="#18211d" stroke-width="3">
    <rect x="42" y="112" width="360" height="140" rx="22" fill="#bdd9bf"/>
    <rect x="798" y="112" width="360" height="140" rx="22" fill="#e9d17f"/>
    <rect x="348" y="350" width="504" height="180" rx="26" fill="#b8d5e5" stroke-width="4"/>
    <rect x="370" y="608" width="460" height="130" rx="22" fill="#d8cce8"/>
    <g stroke="none">
      <text x="222" y="160" text-anchor="middle" font-size="30" font-weight="700">ENABLING TEAM</text>
      <text x="222" y="202" text-anchor="middle" font-size="24">Transfers capability</text>
      <text x="978" y="160" text-anchor="middle" font-size="30" font-weight="700">PLATFORM TEAM</text>
      <text x="978" y="202" text-anchor="middle" font-size="24">Reduces cognitive load</text>
      <text x="600" y="394" text-anchor="middle" font-size="30" font-weight="700">STREAM-ALIGNED TEAM</text>
      <text x="600" y="434" text-anchor="middle" font-size="24">Owns a flow of value end to end</text>
      <text x="600" y="474" text-anchor="middle" font-size="24" font-weight="700">VALUE FLOW</text>
      <path d="M456 500H744" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#value-flow-arrow)"/>
      <text x="600" y="648" text-anchor="middle" font-size="24" font-weight="700">COMPLICATED-SUBSYSTEM</text>
      <text x="600" y="680" text-anchor="middle" font-size="24" font-weight="700">TEAM</text>
      <text x="600" y="716" text-anchor="middle" font-size="24">Owns specialist technology</text>
    </g>
  </g>
</svg>
