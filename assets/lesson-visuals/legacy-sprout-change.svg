<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="legacy-sprout-title legacy-sprout-desc">
  <title id="legacy-sprout-title">A sprout isolates new behavior when time pressure makes broad refactoring unsafe</title>
  <desc id="legacy-sprout-desc">A direct patch places new behavior inside a tangled legacy method and creates a wide change surface. A sprout method or class moves the new logic into a focused, tested unit connected through one call site, leaving most existing code untouched without claiming that the surrounding design is now clean.</desc>
  <defs>
    <marker id="legacy-sprout-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0L12 6L0 12z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; }
      .panel { fill: #fffdf8; stroke: #18211d; stroke-width: 4; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="150" y="24" width="900" height="58" rx="29" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="62" text-anchor="middle" font-weight="700">ADD NEW BEHAVIOUR WITHOUT UNPICKING EVERYTHING</text>

  <rect class="panel" x="42" y="110" width="520" height="610" rx="24"/>
  <rect class="panel" x="638" y="110" width="520" height="610" rx="24"/>
  <text class="heading" x="302" y="160" text-anchor="middle">DIRECT PATCH</text>
  <text class="heading" x="898" y="160" text-anchor="middle">SPROUT CHANGE</text>

  <rect class="card" x="165" y="195" width="270" height="75" rx="20" fill="#e9d17f"/>
  <text class="body" x="300" y="243" text-anchor="middle" font-weight="700">NEW BEHAVIOUR</text>
  <rect class="card" x="765" y="195" width="270" height="75" rx="20" fill="#e9d17f"/>
  <text class="body" x="900" y="243" text-anchor="middle" font-weight="700">NEW BEHAVIOUR</text>

  <path class="line" d="M300 270V325" marker-end="url(#legacy-sprout-arrow)"/>
  <path class="line" d="M900 270V305" marker-end="url(#legacy-sprout-arrow)"/>

  <rect x="105" y="325" width="395" height="220" rx="22" fill="#f5c79d" stroke="#d86136" stroke-width="4"/>
  <g fill="none" stroke="#d86136" stroke-width="7" stroke-linecap="round" opacity="0.55">
    <path d="M128 360C205 315 270 440 475 360"/>
    <path d="M130 500C230 410 325 525 475 390"/>
    <path d="M145 345C280 515 355 325 470 505"/>
    <path d="M125 430C230 520 370 330 480 455"/>
  </g>
  <rect x="155" y="370" width="295" height="120" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="heading" x="302.5" y="419" text-anchor="middle">PATCH INSIDE</text>
  <text class="heading" x="302.5" y="459" text-anchor="middle">TANGLED METHOD</text>
  <rect x="135" y="610" width="335" height="70" rx="22" fill="#f5c79d" stroke="#d86136" stroke-width="4"/>
  <text class="body" x="302.5" y="654" text-anchor="middle" font-weight="700">WIDE CHANGE SURFACE</text>

  <rect class="card" x="730" y="305" width="335" height="160" rx="22" fill="#bdd9bf"/>
  <text class="heading" x="897.5" y="347" text-anchor="middle">SPROUT METHOD</text>
  <text class="heading" x="897.5" y="383" text-anchor="middle">OR CLASS</text>
  <rect x="785" y="400" width="225" height="45" rx="22.5" fill="#b8d5e5" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="897.5" y="430" text-anchor="middle" font-weight="700">FOCUSED TESTS</text>

  <rect class="card" x="680" y="535" width="435" height="110" rx="22" fill="#f5c79d"/>
  <text class="body" x="705" y="581" font-weight="700">LEGACY</text>
  <text class="body" x="705" y="614" font-weight="700">METHOD</text>
  <rect x="855" y="565" width="225" height="55" rx="20" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="967.5" y="600" text-anchor="middle" font-weight="700">ONE CALL SITE</text>
  <path class="line" d="M967.5 565V500H1025V465" marker-end="url(#legacy-sprout-arrow)"/>

  <rect x="735" y="670" width="325" height="40" rx="20" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="897.5" y="697" text-anchor="middle" font-weight="700">SMALLER CHANGE SURFACE</text>
</svg>
