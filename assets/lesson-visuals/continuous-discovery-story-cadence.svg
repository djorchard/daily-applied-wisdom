<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="cdh-story-title cdh-story-desc">
  <title id="cdh-story-title">Weekly story-based discovery cadence</title>
  <desc id="cdh-story-desc">A recent-event interview prompt leads through a timeline of trigger, action, friction, workaround and outcome. The observed needs, pains and desires update an opportunity map, which shapes the product trio's next weekly questions.</desc>
  <defs>
    <marker id="cdh-story-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#18211d" />
    </marker>
    <marker id="cdh-story-arrow-light" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#faf7f0" />
    </marker>
    <marker id="cdh-story-arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#d5a63a" />
    </marker>
    <filter id="cdh-story-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#18211d" flood-opacity="0.14" />
    </filter>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#faf7f0" />
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#18211d">Interview for a story, not a prediction</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="26" fill="#4f5e57">A small weekly touchpoint keeps concrete customer evidence near the next decision.</text>

  <g filter="url(#cdh-story-shadow)">
    <rect x="70" y="154" width="680" height="490" rx="24" fill="#ffffff" stroke="#3f6f8f" stroke-width="4" />
  </g>
  <rect x="102" y="184" width="616" height="82" rx="16" fill="#dfeaf0" />
  <text x="410" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#3f6f8f">RECENT-EVENT PROMPT</text>
  <text x="410" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#18211d">“Tell me about the last time...”</text>

  <path d="M140 368 H680" fill="none" stroke="#18211d" stroke-width="5" marker-end="url(#cdh-story-arrow)" />
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="150" cy="368" r="22" fill="#5f7f6b" stroke="#18211d" stroke-width="3" />
    <circle cx="280" cy="368" r="22" fill="#3f6f8f" stroke="#18211d" stroke-width="3" />
    <circle cx="410" cy="368" r="28" fill="#c46a3a" stroke="#18211d" stroke-width="3" />
    <circle cx="540" cy="368" r="22" fill="#75618d" stroke="#18211d" stroke-width="3" />
    <circle cx="670" cy="368" r="22" fill="#d5a63a" stroke="#18211d" stroke-width="3" />
    <text x="150" y="320" font-size="23" font-weight="700" fill="#18211d">Trigger</text>
    <text x="280" y="320" font-size="23" font-weight="700" fill="#18211d">Action</text>
    <text x="410" y="320" font-size="23" font-weight="700" fill="#c46a3a">Friction</text>
    <text x="540" y="320" font-size="23" font-weight="700" fill="#18211d">Workaround</text>
    <text x="670" y="320" font-size="23" font-weight="700" fill="#18211d">Outcome</text>
  </g>

  <path d="M410 402 V448" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#cdh-story-arrow)" />
  <text x="410" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#4f5e57">SEPARATE EVIDENCE FROM SUGGESTIONS</text>
  <g font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    <rect x="110" y="516" width="180" height="76" rx="15" fill="#e7efe9" stroke="#5f7f6b" stroke-width="3" />
    <text x="200" y="563" fill="#18211d">Need</text>
    <rect x="320" y="516" width="180" height="76" rx="15" fill="#f9e4da" stroke="#c46a3a" stroke-width="3" />
    <text x="410" y="563" fill="#18211d">Pain</text>
    <rect x="530" y="516" width="180" height="76" rx="15" fill="#eee9f3" stroke="#75618d" stroke-width="3" />
    <text x="620" y="563" fill="#18211d">Desire</text>
  </g>
  <text x="410" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#4f5e57">Explore variation; do not claim population frequency.</text>

  <g filter="url(#cdh-story-shadow)">
    <rect x="800" y="154" width="330" height="490" rx="24" fill="#18211d" />
  </g>
  <text x="965" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="2" fill="#d5a63a">WEEKLY CADENCE</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="840" y="238" width="250" height="82" rx="16" fill="#faf7f0" />
    <text x="965" y="272" font-size="23" font-weight="700" fill="#3f6f8f">DIRECT TOUCHPOINT</text>
    <text x="965" y="302" font-size="22" fill="#18211d">Specific customer story</text>
    <path d="M965 322 V360" fill="none" stroke="#faf7f0" stroke-width="4" marker-end="url(#cdh-story-arrow-light)" />
    <rect x="840" y="372" width="250" height="82" rx="16" fill="#faf7f0" />
    <text x="965" y="406" font-size="23" font-weight="700" fill="#75618d">PRODUCT TRIO</text>
    <text x="965" y="436" font-size="22" fill="#18211d">Shared interpretation</text>
    <path d="M965 456 V494" fill="none" stroke="#faf7f0" stroke-width="4" marker-end="url(#cdh-story-arrow-light)" />
    <rect x="840" y="506" width="250" height="82" rx="16" fill="#faf7f0" />
    <text x="965" y="540" font-size="23" font-weight="700" fill="#5f7f6b">MAP UPDATE</text>
    <text x="965" y="570" font-size="22" fill="#18211d">Next questions change</text>
  </g>
  <path d="M1092 548 C1150 548 1150 278 1092 278" fill="none" stroke="#d5a63a" stroke-width="5" marker-end="url(#cdh-story-arrow-gold)" />
  <text x="70" y="706" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#c46a3a">The cadence matters because no single interview gets to become permanent truth.</text>
</svg>
