<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Guided incremental change across architecture dimensions</title>
  <desc id="desc">Four small changes move through feedback gates across structure, data, security and operations. A large untested leap is rejected.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0 0 L18 9 L0 18 Z" fill="#5f4b8b"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #1f2933; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: .04em; }
      .body { font-size: 24px; }
      .small { font-size: 22px; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="36" fill="#f5f1e8"/>
  <text x="70" y="70" class="label">FOUR DIMENSIONS TO PROTECT</text>
  <g>
    <rect x="70" y="110" width="190" height="78" rx="18" fill="#dbe8e2" stroke="#2f6f5e" stroke-width="3"/>
    <text x="165" y="158" class="body" text-anchor="middle">Structure</text>
    <rect x="70" y="205" width="190" height="78" rx="18" fill="#e8e0f2" stroke="#5f4b8b" stroke-width="3"/>
    <text x="165" y="253" class="body" text-anchor="middle">Data</text>
    <rect x="70" y="300" width="190" height="78" rx="18" fill="#f5dfc2" stroke="#b55d12" stroke-width="3"/>
    <text x="165" y="348" class="body" text-anchor="middle">Security</text>
    <rect x="70" y="395" width="190" height="78" rx="18" fill="#dce8f2" stroke="#356987" stroke-width="3"/>
    <text x="165" y="443" class="body" text-anchor="middle">Operations</text>
  </g>
  <path d="M300 150 H1060 M300 245 H1060 M300 340 H1060 M300 435 H1060" stroke="#c9c1b4" stroke-width="3" stroke-dasharray="10 12"/>
  <g>
    <rect x="320" y="118" width="150" height="350" rx="24" fill="#fffdf8" stroke="#5f4b8b" stroke-width="4"/>
    <text x="395" y="165" class="label" text-anchor="middle">STEP 1</text>
    <circle cx="395" cy="245" r="38" fill="#e8e0f2" stroke="#5f4b8b" stroke-width="4"/>
    <text x="395" y="254" class="body" text-anchor="middle">A</text>
    <text x="395" y="330" class="small" text-anchor="middle">Change one</text>
    <text x="395" y="360" class="small" text-anchor="middle">bounded part</text>
    <rect x="350" y="397" width="90" height="42" rx="21" fill="#2f6f5e"/>
    <text x="395" y="426" class="small" text-anchor="middle" fill="#ffffff" style="fill:#ffffff">CHECK</text>
    <rect x="505" y="118" width="150" height="350" rx="24" fill="#fffdf8" stroke="#5f4b8b" stroke-width="4"/>
    <text x="580" y="165" class="label" text-anchor="middle">STEP 2</text>
    <circle cx="580" cy="245" r="38" fill="#e8e0f2" stroke="#5f4b8b" stroke-width="4"/>
    <text x="580" y="254" class="body" text-anchor="middle">B</text>
    <text x="580" y="330" class="small" text-anchor="middle">Read the</text>
    <text x="580" y="360" class="small" text-anchor="middle">evidence</text>
    <rect x="535" y="397" width="90" height="42" rx="21" fill="#2f6f5e"/>
    <text x="580" y="426" class="small" text-anchor="middle" style="fill:#ffffff">CHECK</text>
    <rect x="690" y="118" width="150" height="350" rx="24" fill="#fffdf8" stroke="#5f4b8b" stroke-width="4"/>
    <text x="765" y="165" class="label" text-anchor="middle">STEP 3</text>
    <circle cx="765" cy="245" r="38" fill="#e8e0f2" stroke="#5f4b8b" stroke-width="4"/>
    <text x="765" y="254" class="body" text-anchor="middle">C</text>
    <text x="765" y="330" class="small" text-anchor="middle">Adjust the</text>
    <text x="765" y="360" class="small" text-anchor="middle">next move</text>
    <rect x="720" y="397" width="90" height="42" rx="21" fill="#2f6f5e"/>
    <text x="765" y="426" class="small" text-anchor="middle" style="fill:#ffffff">CHECK</text>
    <rect x="875" y="118" width="150" height="350" rx="24" fill="#fffdf8" stroke="#5f4b8b" stroke-width="4"/>
    <text x="950" y="165" class="label" text-anchor="middle">STEP 4</text>
    <circle cx="950" cy="245" r="38" fill="#e8e0f2" stroke="#5f4b8b" stroke-width="4"/>
    <text x="950" y="254" class="body" text-anchor="middle">D</text>
    <text x="950" y="330" class="small" text-anchor="middle">Keep or</text>
    <text x="950" y="360" class="small" text-anchor="middle">reverse</text>
    <rect x="905" y="397" width="90" height="42" rx="21" fill="#2f6f5e"/>
    <text x="950" y="426" class="small" text-anchor="middle" style="fill:#ffffff">CHECK</text>
  </g>
  <path d="M470 292 H497 M655 292 H682 M840 292 H867" stroke="#5f4b8b" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="70" y="535" width="955" height="140" rx="26" fill="#fffdf8" stroke="#b55d12" stroke-width="4"/>
  <text x="105" y="585" class="label" fill="#8b3d0b" style="fill:#8b3d0b">AVOID THE UNTESTED LEAP</text>
  <text x="105" y="630" class="body">One large migration crosses every dimension before feedback arrives.</text>
  <path d="M805 580 H960" stroke="#b55d12" stroke-width="8" stroke-linecap="round"/>
  <path d="M860 550 L910 610 M910 550 L860 610" stroke="#b55d12" stroke-width="8" stroke-linecap="round"/>
</svg>
