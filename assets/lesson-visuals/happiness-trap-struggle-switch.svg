<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="struggle-switch-title struggle-switch-desc">
  <title id="struggle-switch-title">The struggle switch changes what follows a difficult inner event</title>
  <desc id="struggle-switch-desc">A difficult feeling reaches two paths. With the struggle switch on, fighting and avoiding bring brief relief but feed a loop of returning discomfort and growing cost. Making room for the feeling allows attention to move toward a workable next action without requiring the feeling to disappear.</desc>
  <defs>
    <marker id="struggle-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .label { font-size: 25px; font-weight: 700; }
      .body { font-size: 23px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="210" y="20" width="780" height="64" rx="32" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="61" text-anchor="middle">SAME DISCOMFORT, DIFFERENT USE OF ATTENTION</text>

  <rect class="card" x="38" y="250" width="255" height="230" rx="30" fill="#d8cce8"/>
  <text class="label" x="166" y="302" text-anchor="middle">DIFFICULT</text>
  <text class="label" x="166" y="333" text-anchor="middle">INNER EVENT</text>
  <path d="M95 382C112 345 145 345 162 382C179 419 212 419 229 382" fill="none" stroke="#694d83" stroke-width="8" stroke-linecap="round"/>
  <text class="body" x="166" y="449" text-anchor="middle">thought · feeling · urge</text>

  <path class="line" d="M293 330H350V200H407" marker-end="url(#struggle-arrow)"/>
  <path class="line" d="M293 400H350V548H407" marker-end="url(#struggle-arrow)"/>

  <rect class="card" x="410" y="110" width="750" height="260" rx="32" fill="#f8e0d2"/>
  <rect x="440" y="133" width="260" height="48" rx="24" fill="#c35f43"/>
  <text class="small" x="570" y="165" text-anchor="middle" fill="#fffdf8">STRUGGLE SWITCH ON</text>

  <rect class="card" x="448" y="210" width="185" height="100" rx="22" fill="#fffdf8"/>
  <text class="label" x="541" y="250" text-anchor="middle">FIGHT OR</text>
  <text class="label" x="541" y="280" text-anchor="middle">AVOID</text>
  <path class="line" d="M633 260H691" marker-end="url(#struggle-arrow)"/>
  <rect class="card" x="700" y="210" width="185" height="100" rx="22" fill="#e9d17f"/>
  <text class="label" x="793" y="250" text-anchor="middle">BRIEF</text>
  <text class="label" x="793" y="280" text-anchor="middle">RELIEF</text>
  <path class="line" d="M885 260H943" marker-end="url(#struggle-arrow)"/>
  <rect class="card" x="952" y="198" width="174" height="124" rx="22" fill="#f5c79d"/>
  <text class="body" x="1039" y="238" text-anchor="middle">discomfort</text>
  <text class="body" x="1039" y="267" text-anchor="middle">returns</text>
  <text class="small" x="1039" y="299" text-anchor="middle">COST GROWS</text>
  <path class="line" d="M1039 322V344H541V319" marker-end="url(#struggle-arrow)"/>

  <rect class="card" x="410" y="405" width="750" height="260" rx="32" fill="#dcead9"/>
  <rect x="440" y="428" width="310" height="48" rx="24" fill="#4f7d67"/>
  <text class="small" x="595" y="460" text-anchor="middle" fill="#fffdf8">MAKE ROOM + REORIENT</text>

  <rect class="card" x="448" y="505" width="185" height="100" rx="22" fill="#fffdf8"/>
  <text class="label" x="541" y="546" text-anchor="middle">NOTICE</text>
  <text class="body" x="541" y="578" text-anchor="middle">what is here</text>
  <path class="line" d="M633 555H691" marker-end="url(#struggle-arrow)"/>
  <rect class="card" x="700" y="505" width="185" height="100" rx="22" fill="#b8d5e5"/>
  <text class="label" x="793" y="546" text-anchor="middle">ALLOW</text>
  <text class="body" x="793" y="578" text-anchor="middle">room for now</text>
  <path class="line" d="M885 555H943" marker-end="url(#struggle-arrow)"/>
  <rect class="card" x="952" y="493" width="174" height="124" rx="22" fill="#bdd9bf"/>
  <text class="label" x="1039" y="533" text-anchor="middle">CHOOSE</text>
  <text class="body" x="1039" y="566" text-anchor="middle">one workable</text>
  <text class="body" x="1039" y="595" text-anchor="middle">next action</text>

  <rect class="card" x="220" y="695" width="760" height="48" rx="24" fill="#fffdf8"/>
  <text class="small" x="600" y="727" text-anchor="middle">THE FEELING MAY STAY; USEFUL ACTION CAN STILL OPEN</text>
</svg>
