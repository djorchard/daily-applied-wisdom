<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="savings-system-title savings-system-desc">
  <title id="savings-system-title">A survivable automatic savings floor follows a protected payday sequence</title>
  <desc id="savings-system-desc">Payday moves through essential bills and minimum debt commitments, a sequence check for costly debt and emergency cash, then an automatic goal transfer. A lower review loop uses actual fees, missed bills and remaining cash to raise, lower, retime or pause the transfer.</desc>
  <defs>
    <marker id="savings-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .label { font-size: 25px; font-weight: 700; }
      .body { font-size: 23px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="176" y="20" width="848" height="64" rx="32" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="61" text-anchor="middle">AUTOMATE ONLY AFTER THE CURRENT PAY CYCLE CAN SURVIVE</text>

  <rect class="card" x="38" y="218" width="212" height="210" rx="34" fill="#e9d17f"/>
  <text class="small" x="144" y="266" text-anchor="middle">INCOME ARRIVES</text>
  <circle cx="144" cy="335" r="46" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="144" y="346" text-anchor="middle">PAY</text>
  <text class="body" x="144" y="405" text-anchor="middle">one real cycle</text>

  <path class="line" d="M250 323H304" marker-end="url(#savings-arrow)"/>

  <rect class="card" x="294" y="160" width="260" height="326" rx="30" fill="#f8e0d2"/>
  <rect x="329" y="184" width="190" height="46" rx="23" fill="#c35f43"/>
  <text class="small" x="424" y="215" text-anchor="middle" fill="#fffdf8">PROTECT NOW</text>
  <text class="label" x="424" y="278" text-anchor="middle">ESSENTIALS</text>
  <text class="body" x="424" y="316" text-anchor="middle">housing · food · bills</text>
  <line x1="330" y1="344" x2="518" y2="344" stroke="#9a6a59" stroke-width="3"/>
  <text class="label" x="424" y="390" text-anchor="middle">COMMITMENTS</text>
  <text class="body" x="424" y="428" text-anchor="middle">minimum payments</text>
  <text class="body" x="424" y="458" text-anchor="middle">and known due dates</text>

  <path class="line" d="M554 323H588" marker-end="url(#savings-arrow)"/>

  <rect class="card" x="594" y="160" width="260" height="326" rx="30" fill="#b8d5e5"/>
  <rect x="619" y="184" width="210" height="46" rx="23" fill="#4f7185"/>
  <text class="small" x="724" y="215" text-anchor="middle" fill="#fffdf8">ORDER CHECK</text>
  <text class="label" x="724" y="278" text-anchor="middle">COSTLY DEBT</text>
  <text class="body" x="724" y="311" text-anchor="middle">can change the order</text>
  <line x1="630" y1="344" x2="818" y2="344" stroke="#587488" stroke-width="3"/>
  <text class="label" x="724" y="390" text-anchor="middle">SMALL BUFFER</text>
  <text class="body" x="724" y="428" text-anchor="middle">catches surprises</text>
  <text class="body" x="724" y="458" text-anchor="middle">before new debt</text>

  <path class="line" d="M854 323H888" marker-end="url(#savings-arrow)"/>

  <rect class="card" x="894" y="160" width="268" height="326" rx="30" fill="#dcead9"/>
  <rect x="928" y="184" width="200" height="46" rx="23" fill="#4f7d67"/>
  <text class="small" x="1028" y="215" text-anchor="middle" fill="#fffdf8">AUTOMATE NEXT</text>
  <path d="M968 288H1088V392H968Z" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <path d="M968 288L1028 344L1088 288" fill="none" stroke="#18211d" stroke-width="4" stroke-linejoin="round"/>
  <text class="label" x="1028" y="432" text-anchor="middle">GOAL TRANSFER</text>
  <text class="body" x="1028" y="465" text-anchor="middle">small enough to repeat</text>

  <path class="line" d="M1028 486V556H882" marker-end="url(#savings-arrow)"/>
  <rect class="card" x="500" y="508" width="368" height="162" rx="28" fill="#fffdf8"/>
  <text class="label" x="684" y="548" text-anchor="middle">REVIEW THE CYCLE</text>
  <text class="body" x="684" y="582" text-anchor="middle">missed bills · fees</text>
  <text class="body" x="684" y="611" text-anchor="middle">cash left after the cycle</text>
  <text class="small" x="684" y="642" text-anchor="middle">ADJUST AMOUNT OR DATE</text>
  <path class="line" d="M500 589H424V487" marker-end="url(#savings-arrow)"/>

  <rect class="card" x="128" y="692" width="944" height="50" rx="25" fill="#fffdf8"/>
  <text class="small" x="600" y="725" text-anchor="middle">A REPEATABLE FLOOR BEATS A TARGET THAT CREATES THE NEXT PROBLEM</text>
</svg>
