<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="art-statistics-cycle-title art-statistics-cycle-desc">
  <title id="art-statistics-cycle-title">A question-led PPDAC investigation cycle</title>
  <desc id="art-statistics-cycle-desc">Five connected stages move from Problem to Plan, Data, Analysis and Conclusion, with a return path for iteration. A lower panel shows that population, measure and comparison are defined before data, while uncertainty, limitations and the decision travel with the conclusion.</desc>
  <defs>
    <marker id="art-statistics-cycle-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .return { fill: none; stroke: #53615a; stroke-width: 4; stroke-dasharray: 13 10; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="150" y="18" width="900" height="70" rx="35" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="61" text-anchor="middle" font-weight="700">LET THE QUESTION CHOOSE THE EVIDENCE AND METHOD</text>

  <path class="line" d="M223 223H258" marker-end="url(#art-statistics-cycle-arrow)"/>
  <path class="line" d="M458 223H493" marker-end="url(#art-statistics-cycle-arrow)"/>
  <path class="line" d="M693 223H728" marker-end="url(#art-statistics-cycle-arrow)"/>
  <path class="line" d="M928 223H963" marker-end="url(#art-statistics-cycle-arrow)"/>

  <rect class="card" x="35" y="145" width="188" height="156" rx="26" fill="#f5c79d"/>
  <text class="small" x="129" y="190" text-anchor="middle">1 · PROBLEM</text>
  <text class="body" x="129" y="239" text-anchor="middle">What decision?</text>
  <text class="body" x="129" y="271" text-anchor="middle">For whom?</text>

  <rect class="card" x="270" y="145" width="188" height="156" rx="26" fill="#e9d17f"/>
  <text class="small" x="364" y="190" text-anchor="middle">2 · PLAN</text>
  <text class="body" x="364" y="239" text-anchor="middle">What measure?</text>
  <text class="body" x="364" y="271" text-anchor="middle">What comparison?</text>

  <rect class="card" x="505" y="145" width="188" height="156" rx="26" fill="#b8d5e5"/>
  <text class="small" x="599" y="190" text-anchor="middle">3 · DATA</text>
  <text class="body" x="599" y="239" text-anchor="middle">How collected?</text>
  <text class="body" x="599" y="271" text-anchor="middle">What is missing?</text>

  <rect class="card" x="740" y="145" width="188" height="156" rx="26" fill="#d8cce8"/>
  <text class="small" x="834" y="190" text-anchor="middle">4 · ANALYSIS</text>
  <text class="body" x="834" y="239" text-anchor="middle">What pattern?</text>
  <text class="body" x="834" y="271" text-anchor="middle">How uncertain?</text>

  <rect class="card" x="975" y="145" width="190" height="156" rx="26" fill="#bdd9bf"/>
  <text class="small" x="1070" y="190" text-anchor="middle">5 · CONCLUSION</text>
  <text class="body" x="1070" y="239" text-anchor="middle">What follows?</text>
  <text class="body" x="1070" y="271" text-anchor="middle">What does not?</text>

  <path class="return" d="M1070 302V690H130V315" marker-end="url(#art-statistics-cycle-arrow)"/>
  <text class="small" x="1113" y="675" text-anchor="end">ITERATE</text>

  <rect class="card" x="105" y="385" width="990" height="250" rx="34" fill="#fffdf8"/>
  <line x1="600" y1="415" x2="600" y2="605" stroke="#18211d" stroke-width="3"/>
  <text class="heading" x="350" y="435" text-anchor="middle">BEFORE THE DATA</text>
  <text class="heading" x="850" y="435" text-anchor="middle">WITH THE CONCLUSION</text>

  <rect x="120" y="470" width="460" height="48" rx="24" fill="#f5c79d" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="350" y="502" text-anchor="middle">POPULATION · UNIT · WINDOW</text>
  <rect x="120" y="540" width="460" height="48" rx="24" fill="#e9d17f" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="350" y="572" text-anchor="middle">OUTCOME · COMPARISON · THRESHOLD</text>

  <rect x="620" y="470" width="460" height="48" rx="24" fill="#b8d5e5" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="850" y="502" text-anchor="middle">ESTIMATE · RANGE · ASSUMPTIONS</text>
  <rect x="620" y="540" width="460" height="48" rx="24" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="850" y="572" text-anchor="middle">LIMITS · DECISION · NEXT QUESTION</text>

  <rect x="210" y="710" width="780" height="36" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="736" text-anchor="middle">ANALYSIS IS ONE STAGE, NOT THE DEFINITION OF THE PROBLEM</text>
</svg>
