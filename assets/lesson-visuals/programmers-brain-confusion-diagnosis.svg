<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="programmers-brain-confusion-title programmers-brain-confusion-desc">
<title id="programmers-brain-confusion-title">Three diagnoses for confusing code</title>
<desc id="programmers-brain-confusion-desc">A confusing code fragment branches into missing knowledge, missing information, and too many interactions. Each diagnosis leads to a matching action and then to a check of whether the reader can explain the code.</desc>
<defs>
  <style>text {font-family: Arial, sans-serif; fill: #18211d;}</style>
  <marker id="programmers-brain-confusion-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#18211d"/></marker>
</defs>
<rect width="1200" height="760" fill="#faf7f0"/>
<text x="600" y="62" text-anchor="middle" font-size="34" font-weight="700">DIAGNOSE BEFORE YOU REPEAT</text>
<rect x="370" y="95" width="460" height="100" rx="20" fill="#d7c4df" stroke="#18211d" stroke-width="3"/>
<text x="600" y="135" text-anchor="middle" font-size="25" font-weight="700">CONFUSING CODE</text>
<text x="600" y="174" text-anchor="middle" font-size="29">What exactly is missing?</text>
<path d="M600 204V238H210V279" fill="none" stroke="#18211d" stroke-width="4" stroke-linejoin="round" marker-end="url(#programmers-brain-confusion-arrow)"/>
<path d="M600 204V279" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#programmers-brain-confusion-arrow)"/>
<path d="M600 238H990V279" fill="none" stroke="#18211d" stroke-width="4" stroke-linejoin="round" marker-end="url(#programmers-brain-confusion-arrow)"/>
<rect x="55" y="292" width="310" height="200" rx="18" fill="#a9c7df" stroke="#18211d" stroke-width="3"/>
<text x="210" y="334" text-anchor="middle" font-size="25" font-weight="700">MISSING KNOWLEDGE</text>
<text x="210" y="378" text-anchor="middle" font-size="27">Unknown construct</text>
<line x1="95" y1="402" x2="325" y2="402" stroke="#18211d" stroke-width="2"/>
<text x="210" y="444" text-anchor="middle" font-size="26" font-weight="700">LEARN ONE RULE</text>
<text x="210" y="477" text-anchor="middle" font-size="23">Then restate its effect</text>
<rect x="445" y="292" width="310" height="200" rx="18" fill="#e9d17f" stroke="#18211d" stroke-width="3"/>
<text x="600" y="334" text-anchor="middle" font-size="25" font-weight="700">MISSING INFORMATION</text>
<text x="600" y="378" text-anchor="middle" font-size="27">Unknown value</text>
<line x1="485" y1="402" x2="715" y2="402" stroke="#18211d" stroke-width="2"/>
<text x="600" y="444" text-anchor="middle" font-size="26" font-weight="700">LOCATE ONE FACT</text>
<text x="600" y="477" text-anchor="middle" font-size="23">Then trace its source</text>
<rect x="835" y="292" width="310" height="200" rx="18" fill="#e8b89c" stroke="#18211d" stroke-width="3"/>
<text x="990" y="334" text-anchor="middle" font-size="25" font-weight="700">TOO MANY LINKS</text>
<text x="990" y="378" text-anchor="middle" font-size="27">Crowded trace</text>
<line x1="875" y1="402" x2="1105" y2="402" stroke="#18211d" stroke-width="2"/>
<text x="990" y="444" text-anchor="middle" font-size="26" font-weight="700">DRAW THE LINKS</text>
<text x="990" y="477" text-anchor="middle" font-size="23">Then inspect the model</text>
<path d="M210 505V552H600" fill="none" stroke="#18211d" stroke-width="4" stroke-linejoin="round"/>
<path d="M600 505V582" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#programmers-brain-confusion-arrow)"/>
<path d="M990 505V552H620" fill="none" stroke="#18211d" stroke-width="4" stroke-linejoin="round"/>
<rect x="300" y="596" width="600" height="104" rx="20" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
<text x="600" y="639" text-anchor="middle" font-size="27" font-weight="700">CHECK THE DIAGNOSIS</text>
<text x="600" y="676" text-anchor="middle" font-size="27">Can you now explain the code?</text>
<text x="600" y="742" text-anchor="middle" font-size="22">If not, change the diagnosis instead of forcing the action.</text>
</svg>
