<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="event-driven-safe-replay-title event-driven-safe-replay-desc">
  <title id="event-driven-safe-replay-title">Rebuild a candidate view while suppressing external effects</title>
  <desc id="event-driven-safe-replay-desc">Retained facts flow through a projector to an isolated candidate view, which is compared before readers switch. The projector’s separate external-action path is stopped at a replay boundary, preventing repeated email.</desc>
  <defs><marker id="event-driven-safe-replay-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#18211d"/></marker><style>text {font-family: Arial, sans-serif; fill: #18211d;}</style></defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <text x="600" y="75" text-anchor="middle" font-size="32" font-weight="700">REBUILD WITH AN EXPLICIT DESTINATION</text>
  <rect x="50" y="165" width="300" height="145" rx="22" fill="#a9c7df" stroke="#18211d" stroke-width="4"/>
  <text x="200" y="219" text-anchor="middle" font-size="30" font-weight="700">RETAINED FACTS</text>
  <text x="200" y="265" text-anchor="middle" font-size="27" font-weight="400">chosen input range</text>
  <rect x="450" y="165" width="300" height="145" rx="22" fill="#e9d17f" stroke="#18211d" stroke-width="4"/>
  <text x="600" y="219" text-anchor="middle" font-size="32" font-weight="700">PROJECTOR</text>
  <text x="600" y="265" text-anchor="middle" font-size="27" font-weight="400">replay calculation</text>
  <rect x="850" y="165" width="300" height="145" rx="22" fill="#bdd9bf" stroke="#18211d" stroke-width="4"/>
  <text x="1000" y="219" text-anchor="middle" font-size="29" font-weight="700">CANDIDATE VIEW</text>
  <text x="1000" y="265" text-anchor="middle" font-size="27" font-weight="400">isolated output</text>
  <path d="M360 238H434" fill="none" stroke="#18211d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#event-driven-safe-replay-arrow)"/>
  <path d="M760 238H834" fill="none" stroke="#18211d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#event-driven-safe-replay-arrow)"/>
  <path d="M1000 310V435" fill="none" stroke="#18211d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#event-driven-safe-replay-arrow)"/>
  <rect x="850" y="452" width="300" height="138" rx="22" fill="#bdd9bf" stroke="#18211d" stroke-width="4"/>
  <text x="1000" y="506" text-anchor="middle" font-size="32" font-weight="700">COMPARE</text>
  <text x="1000" y="550" text-anchor="middle" font-size="27" font-weight="400">then switch readers</text>
  <path d="M600 310V395" fill="none" stroke="#18211d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M552 400H648" stroke="#18211d" stroke-width="8" stroke-linecap="round"/>
  <rect x="405" y="452" width="390" height="138" rx="22" fill="#f3a8a0" stroke="#18211d" stroke-width="4"/>
  <text x="600" y="503" text-anchor="middle" font-size="29" font-weight="700">EXTERNAL ACTIONS</text>
  <text x="600" y="550" text-anchor="middle" font-size="29" font-weight="400">email suppressed</text>
  <text x="200" y="486" text-anchor="middle" font-size="28" font-weight="400">One more pass</text>
  <text x="200" y="531" text-anchor="middle" font-size="28" font-weight="400">over the facts.</text>
  <text x="600" y="677" text-anchor="middle" font-size="28" font-weight="700">REPLAY BOUNDARY</text>
  <text x="600" y="720" text-anchor="middle" font-size="28" font-weight="400">A rebuilt total must not resend a confirmation.</text>
</svg>
