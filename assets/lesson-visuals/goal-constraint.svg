<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="goal-constraint-title goal-constraint-desc">
  <title id="goal-constraint-title">The constraint sets the system throughput ceiling</title>
  <desc id="goal-constraint-desc">Five equal-sized delivery-stage cards show maximum capacities. Review has the lowest capacity at three items per day, a queue forms before it, and the system throughput cannot exceed three items per day.</desc>
  <defs>
    <marker id="constraint-flow-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1l10 5-10 5" fill="none" stroke="#18211d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <text x="48" y="62" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18211d">WORK FLOWS LEFT → RIGHT</text>
  <text x="1152" y="62" text-anchor="end" font-family="Arial, sans-serif" font-size="24" fill="#18211d">Each card shows maximum daily capacity</text>

  <g fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#constraint-flow-arrow)">
    <path d="M216 346H252"/>
    <path d="M438 410H506"/>
    <path d="M694 346H756"/>
    <path d="M942 346H978"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#18211d" stroke="#18211d" stroke-width="3">
    <rect x="30" y="236" width="186" height="220" rx="22" fill="#b8d5e5"/>
    <rect x="252" y="236" width="186" height="220" rx="22" fill="#d8cce8"/>
    <rect x="506" y="236" width="188" height="220" rx="22" fill="#f5c79d" stroke="#d86136" stroke-width="4"/>
    <rect x="756" y="236" width="186" height="220" rx="22" fill="#bdd9bf"/>
    <rect x="978" y="236" width="186" height="220" rx="22" fill="#e9d17f"/>
    <g stroke="none" text-anchor="middle">
      <text x="123" y="292" font-size="30" font-weight="700">INTAKE</text>
      <text x="123" y="372" font-size="30">8 / day</text>
      <text x="345" y="292" font-size="30" font-weight="700">BUILD</text>
      <text x="345" y="372" font-size="30">7 / day</text>
      <text x="600" y="292" font-size="30" font-weight="700">REVIEW</text>
      <text x="600" y="348" font-size="24" font-weight="700" fill="#d86136">CONSTRAINT</text>
      <text x="600" y="400" font-size="30">3 / day</text>
      <text x="849" y="292" font-size="30" font-weight="700">DEPLOY</text>
      <text x="849" y="372" font-size="30">6 / day</text>
      <text x="1071" y="292" font-size="30" font-weight="700">RELEASE</text>
      <text x="1071" y="372" font-size="30">6 / day</text>
    </g>
  </g>

  <text x="472" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#18211d">QUEUE</text>
  <text x="472" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#18211d">forms before Review</text>
  <g fill="#faf7f0" stroke="#d86136" stroke-width="4">
    <circle cx="472" cy="278" r="14"/>
    <circle cx="472" cy="326" r="14"/>
    <circle cx="472" cy="374" r="14"/>
  </g>

  <rect x="398" y="474" width="404" height="92" rx="24" fill="#f5c79d" stroke="#d86136" stroke-width="4"/>
  <text x="600" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18211d">LOWEST REQUIRED CAPACITY</text>
  <text x="600" y="544" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18211d">SETS THE CEILING</text>
  <rect x="284" y="590" width="632" height="130" rx="26" fill="#e9d17f" stroke="#18211d" stroke-width="4"/>
  <text x="600" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#18211d">SYSTEM THROUGHPUT: 3 / DAY</text>
  <text x="600" y="688" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#18211d">Speeding up another stage does not raise this ceiling</text>
</svg>
