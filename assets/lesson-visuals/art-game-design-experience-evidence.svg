<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="art-game-experience-title art-game-experience-desc">
  <title id="art-game-experience-title">The designer reaches player experience through a game and partial evidence</title>
  <desc id="art-game-experience-desc">A designer states an intended experience and builds rules, interface, images and sound. These create conditions for a private player experience. Observable choices, pauses and descriptions return as partial evidence, never direct access to the player's mind.</desc>
  <defs>
    <marker id="art-game-experience-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .partial { fill: none; stroke: #18211d; stroke-width: 4; stroke-dasharray: 12 10; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="150" y="18" width="900" height="70" rx="35" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="61" text-anchor="middle" font-weight="700">DESIGN THE GAME DIRECTLY; INFER THE EXPERIENCE CAREFULLY</text>

  <rect class="card" x="45" y="135" width="300" height="245" rx="28" fill="#f5c79d"/>
  <text class="small" x="195" y="180" text-anchor="middle">DESIGNER</text>
  <text class="heading" x="195" y="224" text-anchor="middle">INTENTION</text>
  <rect x="80" y="255" width="230" height="82" rx="20" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="195" y="288" text-anchor="middle">Notice · choose</text>
  <text class="body" x="195" y="320" text-anchor="middle">feel · remember</text>

  <path class="line" d="M345 257H440" marker-end="url(#art-game-experience-arrow)"/>
  <text class="small" x="392" y="238" text-anchor="middle">BUILDS</text>

  <rect class="card" x="455" y="135" width="290" height="245" rx="28" fill="#b8d5e5"/>
  <text class="small" x="600" y="180" text-anchor="middle">GAME</text>
  <text class="heading" x="600" y="224" text-anchor="middle">ARTEFACT</text>
  <rect x="490" y="255" width="220" height="82" rx="20" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="288" text-anchor="middle">Rules · interface</text>
  <text class="body" x="600" y="320" text-anchor="middle">images · sound</text>

  <path class="line" d="M745 257H840" marker-end="url(#art-game-experience-arrow)"/>
  <text class="small" x="792" y="238" text-anchor="middle">INVITES</text>

  <rect class="card" x="855" y="135" width="300" height="245" rx="28" fill="#d8cce8"/>
  <text class="small" x="1005" y="180" text-anchor="middle">PLAYER</text>
  <text class="heading" x="1005" y="224" text-anchor="middle">EXPERIENCE</text>
  <rect x="890" y="255" width="230" height="82" rx="20" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="1005" y="288" text-anchor="middle">Private · situated</text>
  <text class="body" x="1005" y="320" text-anchor="middle">never fully visible</text>

  <path class="partial" d="M1005 380V438H1040V482" marker-end="url(#art-game-experience-arrow)"/>

  <rect class="card" x="160" y="485" width="880" height="200" rx="30" fill="#bdd9bf"/>
  <text class="heading" x="600" y="531" text-anchor="middle">PARTIAL PLAYTEST EVIDENCE</text>
  <rect x="200" y="558" width="230" height="82" rx="20" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="compact" x="315" y="592" text-anchor="middle">CHOICES</text>
  <text class="body" x="315" y="623" text-anchor="middle">What happened?</text>
  <rect x="485" y="558" width="230" height="82" rx="20" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="compact" x="600" y="592" text-anchor="middle">PAUSES</text>
  <text class="body" x="600" y="623" text-anchor="middle">Where did it stall?</text>
  <rect x="770" y="550" width="230" height="100" rx="20" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="compact" x="885" y="592" text-anchor="middle">WORDS</text>
  <text class="body" x="885" y="620" text-anchor="middle">How was it</text>
  <text class="body" x="885" y="646" text-anchor="middle">described?</text>

  <path class="partial" d="M160 585H105V415H195V385" marker-end="url(#art-game-experience-arrow)"/>
  <rect x="135" y="704" width="930" height="42" rx="21" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="733" text-anchor="middle">EVIDENCE UPDATES THE HYPOTHESIS; IT DOES NOT READ A MIND</text>
</svg>
