<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="shape-hill-title shape-hill-desc">
  <title id="shape-hill-title">A hill chart separates unknown work from execution</title>
  <desc id="shape-hill-desc">A hill runs from start to finish. The left slope is figuring out what to do, the crest marks an approach becoming known and the right slope is getting it done. Three example scopes occupy different positions. A stalled uphill scope points to a prompt asking what is still unknown.</desc>
  <defs>
    <marker id="shape-hill-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #53615a; stroke-width: 3; stroke-dasharray: 11 9; }
      .card { stroke: #18211d; stroke-width: 4; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="120" y="18" width="960" height="70" rx="35" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="61" text-anchor="middle">REPORT THE STATE OF KNOWLEDGE, NOT A COMFORTING PERCENTAGE</text>

  <text class="small" x="115" y="150" text-anchor="middle">START</text>
  <text class="small" x="1085" y="150" text-anchor="middle">FINISH</text>
  <path d="M105 510C235 510 320 410 390 295C455 188 520 140 600 140C680 140 745 188 810 295C880 410 965 510 1095 510L1095 560L105 560Z" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <path class="thin" d="M600 120V560"/>
  <text class="heading" x="355" y="600" text-anchor="middle">FIGURE OUT WHAT TO DO</text>
  <text class="body" x="355" y="635" text-anchor="middle">unknowns · alternatives · problem solving</text>
  <text class="heading" x="845" y="600" text-anchor="middle">GET IT DONE</text>
  <text class="body" x="845" y="635" text-anchor="middle">known path · execution · finish</text>

  <circle cx="330" cy="390" r="24" fill="#f5c79d" stroke="#18211d" stroke-width="4"/>
  <rect class="card" x="110" y="215" width="285" height="105" rx="24" fill="#f5c79d"/>
  <text class="small" x="252" y="255" text-anchor="middle">POLICY RULES</text>
  <text class="body" x="252" y="290" text-anchor="middle">Approach still unknown</text>
  <path class="line" d="M285 320L320 365" marker-end="url(#shape-hill-arrow)"/>

  <circle cx="610" cy="145" r="24" fill="#e9d17f" stroke="#18211d" stroke-width="4"/>
  <rect class="card" x="480" y="205" width="275" height="105" rx="24" fill="#e9d17f"/>
  <text class="small" x="617" y="245" text-anchor="middle">DATA MAPPING</text>
  <text class="body" x="617" y="280" text-anchor="middle">Approach is now known</text>
  <path class="line" d="M617 205V174" marker-end="url(#shape-hill-arrow)"/>

  <circle cx="875" cy="380" r="24" fill="#bdd9bf" stroke="#18211d" stroke-width="4"/>
  <rect class="card" x="810" y="215" width="280" height="105" rx="24" fill="#bdd9bf"/>
  <text class="small" x="950" y="255" text-anchor="middle">EXPORT SCREEN</text>
  <text class="body" x="950" y="290" text-anchor="middle">Executing the known path</text>
  <path class="line" d="M925 320L890 355" marker-end="url(#shape-hill-arrow)"/>

  <path class="thin" d="M330 415V495H65V695H450"/>
  <rect class="card" x="450" y="650" width="630" height="92" rx="28" fill="#d8cce8"/>
  <text class="small" x="765" y="686" text-anchor="middle">DOT STALLS?</text>
  <text class="compact" x="765" y="720" text-anchor="middle">ASK: WHAT IS STILL UNKNOWN?</text>
  <path class="line" d="M450 695H410" marker-end="url(#shape-hill-arrow)"/>
</svg>
