<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="working-identity-connections-title working-identity-connections-desc">
  <title id="working-identity-connections-title">A bridge to a new network expands possible professional identities</title>
  <desc id="working-identity-connections-desc">A familiar circle continues to support the current identity. A deliberate bridge reaches a new professional community, which adds role models, real routines and new language for a possible future.</desc>
