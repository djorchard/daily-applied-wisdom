<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="shape-zone-title shape-zone-desc">
  <title id="shape-zone-title">Shaped work sits between vague and over-specified</title>
  <desc id="shape-zone-desc">Three columns compare a vague raw request, shaped work and an over-specified ticket stack. The shaped middle is rough, solved and bounded. Problem, appetite, main elements, rabbit holes and no-gos combine into a pitch that gives builders guard rails and room for judgement.</desc>
  <defs>
    <marker id="shape-zone-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .muted { fill: none; stroke: #53615a; stroke-width: 4; stroke-dasharray: 12 10; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="185" y="18" width="830" height="70" rx="35" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="61" text-anchor="middle" font-weight="700">ENOUGH CLARITY FOR A BET · ENOUGH SPACE FOR JUDGEMENT</text>

  <text class="small" x="185" y="128" text-anchor="middle">TOO ABSTRACT</text>
  <rect class="card" x="35" y="145" width="300" height="340" rx="30" fill="#f5c79d"/>
  <text class="heading" x="185" y="202" text-anchor="middle">RAW WORDS</text>
  <rect x="75" y="240" width="220" height="92" rx="22" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="185" y="278" text-anchor="middle">"Flexible</text>
  <text class="body" x="185" y="310" text-anchor="middle">approvals"</text>
  <text class="body" x="185" y="382" text-anchor="middle">Problem unclear</text>
  <text class="body" x="185" y="417" text-anchor="middle">Boundary absent</text>
  <text class="small" x="185" y="458" text-anchor="middle">BUILDERS MUST GUESS</text>

  <path class="muted" d="M335 315H420" marker-end="url(#shape-zone-arrow)"/>
  <text class="small" x="600" y="128" text-anchor="middle">THE SHAPED ZONE</text>
  <rect class="card" x="435" y="145" width="330" height="360" rx="34" fill="#bdd9bf"/>
  <text class="heading" x="600" y="195" text-anchor="middle">SHAPED WORK</text>
  <rect x="470" y="220" width="260" height="68" rx="21" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="compact" x="600" y="262" text-anchor="middle">ROUGH</text>
  <rect x="470" y="308" width="260" height="68" rx="21" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="compact" x="600" y="350" text-anchor="middle">SOLVED</text>
  <rect x="470" y="396" width="260" height="68" rx="21" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="compact" x="600" y="438" text-anchor="middle">BOUNDED</text>
  <text class="small" x="600" y="490" text-anchor="middle">GUARD RAILS, NOT TASKS</text>

  <path class="muted" d="M765 315H850" marker-end="url(#shape-zone-arrow)"/>
  <text class="small" x="1015" y="128" text-anchor="middle">TOO CONCRETE</text>
  <rect class="card" x="865" y="145" width="300" height="340" rx="30" fill="#b8d5e5"/>
  <text class="heading" x="1015" y="202" text-anchor="middle">TICKET STACK</text>
  <rect x="905" y="235" width="220" height="45" rx="16" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <rect x="905" y="295" width="220" height="45" rx="16" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <rect x="905" y="355" width="220" height="45" rx="16" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <path class="line" d="M930 257L943 270L966 244"/>
  <path class="line" d="M930 317L943 330L966 304"/>
  <text class="body" x="1015" y="423" text-anchor="middle">Details fixed early</text>
  <text class="small" x="1015" y="451" text-anchor="middle">JUDGEMENT</text>
  <text class="small" x="1015" y="477" text-anchor="middle">SQUEEZED OUT</text>

  <path class="line" d="M600 505V552" marker-end="url(#shape-zone-arrow)"/>
  <rect class="card" x="80" y="565" width="1040" height="165" rx="30" fill="#fffdf8"/>
  <text class="heading" x="600" y="607" text-anchor="middle">THE PITCH</text>
  <rect x="110" y="632" width="170" height="62" rx="20" fill="#b8d5e5" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="195" y="670" text-anchor="middle">PROBLEM</text>
  <rect x="310" y="632" width="170" height="62" rx="20" fill="#e9d17f" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="395" y="670" text-anchor="middle">APPETITE</text>
  <rect x="510" y="632" width="180" height="62" rx="20" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="670" text-anchor="middle">ELEMENTS</text>
  <rect x="720" y="632" width="180" height="62" rx="20" fill="#f5c79d" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="810" y="670" text-anchor="middle">RABBIT HOLES</text>
  <rect x="930" y="632" width="160" height="62" rx="20" fill="#d8cce8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="1010" y="670" text-anchor="middle">NO-GOS</text>
</svg>
