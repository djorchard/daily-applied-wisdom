<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="pause-point-title pause-point-desc">
  <title id="pause-point-title">A usable checklist is designed around a real pause point</title>
  <desc id="pause-point-desc">A workflow approaches an irreversible release and pauses. Candidate items pass through three filters: essential, missable and answerable now. The resulting short checklist is deliberately run in read-do or do-confirm mode, observed and revised.</desc>
  <defs>
    <marker id="pause-point-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 700; }
      .body { font-size: 23px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="180" y="20" width="840" height="70" rx="35" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="63" text-anchor="middle">DESIGN FROM THE WORKFLOW OUTWARD</text>

  <text class="label" x="178" y="150" text-anchor="middle">1 · PLACE THE PAUSE</text>
  <rect class="card" x="35" y="178" width="300" height="245" rx="30" fill="#b8d5e5"/>
  <circle class="card" cx="90" cy="285" r="28" fill="#fffdf8"/>
  <circle class="card" cx="188" cy="285" r="28" fill="#fffdf8"/>
  <rect x="255" y="236" width="55" height="98" rx="12" fill="#f5c79d" stroke="#18211d" stroke-width="4"/>
  <path class="line" d="M118 285H151" marker-end="url(#pause-point-arrow)"/>
  <path class="line" d="M216 285H242" marker-end="url(#pause-point-arrow)"/>
  <path d="M282 220V350" stroke="#c35f43" stroke-width="7" stroke-linecap="round"/>
  <text class="small" x="250" y="385" text-anchor="middle">RELEASE</text>
  <rect x="70" y="204" width="180" height="50" rx="25" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="160" y="237" text-anchor="middle">PAUSE HERE</text>
  <text class="body" x="185" y="458" text-anchor="middle">before commitment is costly</text>

  <text class="label" x="570" y="150" text-anchor="middle">2 · FILTER THE ITEMS</text>
  <rect class="card" x="385" y="178" width="370" height="360" rx="30" fill="#fffdf8"/>
  <rect x="420" y="215" width="150" height="64" rx="22" fill="#d8cce8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="495" y="255" text-anchor="middle">essential?</text>
  <rect x="420" y="302" width="150" height="64" rx="22" fill="#f5c79d" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="495" y="342" text-anchor="middle">missable?</text>
  <rect x="420" y="384" width="150" height="74" rx="22" fill="#e9d17f" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="495" y="414" text-anchor="middle">answerable</text>
  <text class="body" x="495" y="442" text-anchor="middle">now?</text>
  <path class="line" d="M585 247L625 301"/>
  <path class="line" d="M585 334H625"/>
  <path class="line" d="M585 421L625 367"/>
  <path d="M625 270H712L670 383L625 270Z" fill="#bdd9bf" stroke="#18211d" stroke-width="4" stroke-linejoin="round"/>
  <path class="line" d="M669 383V435" marker-end="url(#pause-point-arrow)"/>
  <rect x="605" y="447" width="128" height="64" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="669" y="487" text-anchor="middle">KEEP</text>

  <text class="label" x="974" y="150" text-anchor="middle">3 · CHOOSE THE MODE</text>
  <rect class="card" x="805" y="178" width="360" height="360" rx="30" fill="#bdd9bf"/>
  <rect x="840" y="218" width="290" height="110" rx="24" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="985" y="254" text-anchor="middle">READ-DO</text>
  <text class="body" x="985" y="292" text-anchor="middle">prompt, act, continue</text>
  <rect x="840" y="352" width="290" height="110" rx="24" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="985" y="388" text-anchor="middle">DO-CONFIRM</text>
  <text class="body" x="985" y="426" text-anchor="middle">act, pause, verify</text>
  <text class="body" x="985" y="502" text-anchor="middle">match the real workflow</text>

  <path class="line" d="M337 330H370" marker-end="url(#pause-point-arrow)"/>
  <path class="line" d="M757 330H790" marker-end="url(#pause-point-arrow)"/>

  <rect class="card" x="160" y="594" width="880" height="128" rx="32" fill="#fffdf8"/>
  <text class="small" x="315" y="644" text-anchor="middle">OBSERVE</text>
  <path class="line" d="M410 636H492" marker-end="url(#pause-point-arrow)"/>
  <text class="small" x="600" y="644" text-anchor="middle">REVISE</text>
  <path class="line" d="M695 636H777" marker-end="url(#pause-point-arrow)"/>
  <text class="small" x="885" y="644" text-anchor="middle">RUN AGAIN</text>
  <text class="body" x="600" y="690" text-anchor="middle">turn friction, noise and ambiguity into edits</text>
</svg>
