<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="cdh-test-title cdh-test-desc">
  <title id="cdh-test-title">Select and test the riskiest product assumption</title>
  <desc id="cdh-test-desc">Three candidate solutions reveal different assumptions. A qualitative importance and evidence screen selects the critical belief with weak evidence. A small faithful test then produces evidence to compare, revise or discard solutions.</desc>
  <defs>
    <marker id="cdh-test-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#18211d" />
    </marker>
    <filter id="cdh-test-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#18211d" flood-opacity="0.14" />
    </filter>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#faf7f0" />
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#18211d">Test the belief that can break the idea</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="26" fill="#4f5e57">Decompose competing solutions before implementation makes one feel inevitable.</text>

  <text x="70" y="156" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#4f5e57">THREE CANDIDATE SOLUTIONS</text>
  <g filter="url(#cdh-test-shadow)" font-family="Arial, sans-serif">
    <rect x="70" y="178" width="320" height="132" rx="20" fill="#ffffff" stroke="#3f6f8f" stroke-width="4" />
    <text x="230" y="218" text-anchor="middle" font-size="24" font-weight="700" fill="#3f6f8f">SOLUTION A</text>
    <text x="230" y="253" text-anchor="middle" font-size="27" font-weight="700" fill="#18211d">Automatic reminder</text>
    <text x="230" y="286" text-anchor="middle" font-size="22" fill="#4f5e57">Belief: people will act</text>

    <rect x="440" y="178" width="320" height="132" rx="20" fill="#ffffff" stroke="#75618d" stroke-width="4" />
    <text x="600" y="218" text-anchor="middle" font-size="24" font-weight="700" fill="#75618d">SOLUTION B</text>
    <text x="600" y="253" text-anchor="middle" font-size="27" font-weight="700" fill="#18211d">Saved checkpoint</text>
    <text x="600" y="286" text-anchor="middle" font-size="22" fill="#4f5e57">Belief: return is easy</text>

    <rect x="810" y="178" width="320" height="132" rx="20" fill="#ffffff" stroke="#5f7f6b" stroke-width="4" />
    <text x="970" y="218" text-anchor="middle" font-size="24" font-weight="700" fill="#5f7f6b">SOLUTION C</text>
    <text x="970" y="253" text-anchor="middle" font-size="27" font-weight="700" fill="#18211d">Shorter request</text>
    <text x="970" y="286" text-anchor="middle" font-size="22" fill="#4f5e57">Belief: fields can move</text>
  </g>

  <path d="M230 314 V356 H600 V386" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#cdh-test-arrow)" />
  <path d="M600 314 V386" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#cdh-test-arrow)" />
  <path d="M970 314 V356 H600" fill="none" stroke="#18211d" stroke-width="4" />

  <g filter="url(#cdh-test-shadow)">
    <rect x="70" y="396" width="500" height="278" rx="22" fill="#ffffff" stroke="#18211d" stroke-width="4" />
  </g>
  <text x="100" y="438" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="2" fill="#4f5e57">QUALITATIVE RISK SCREEN</text>
  <path d="M150 616 V482 H500" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#cdh-test-arrow)" />
  <text x="325" y="654" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#4f5e57">More evidence</text>
  <text x="112" y="550" text-anchor="middle" transform="rotate(-90 112 550)" font-family="Arial, sans-serif" font-size="22" fill="#4f5e57">More important</text>
  <rect x="158" y="490" width="158" height="118" rx="14" fill="#f9e4da" stroke="#c46a3a" stroke-width="3" />
  <text x="237" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#c46a3a">TEST FIRST</text>
  <text x="237" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#18211d">Critical belief</text>
  <text x="237" y="593" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#18211d">weak evidence</text>
  <circle cx="397" cy="540" r="18" fill="#d5a63a" stroke="#18211d" stroke-width="3" />
  <circle cx="444" cy="585" r="18" fill="#5f7f6b" stroke="#18211d" stroke-width="3" />
  <text x="352" y="620" font-family="Arial, sans-serif" font-size="22" fill="#4f5e57">Safer beliefs</text>

  <path d="M572 535 H635" fill="none" stroke="#18211d" stroke-width="5" marker-end="url(#cdh-test-arrow)" />
  <g filter="url(#cdh-test-shadow)" font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="650" y="396" width="480" height="278" rx="22" fill="#18211d" />
    <text x="890" y="438" font-size="23" font-weight="700" letter-spacing="2" fill="#d5a63a">SMALL, FAITHFUL TEST</text>
    <rect x="700" y="470" width="380" height="68" rx="14" fill="#faf7f0" />
    <text x="890" y="513" font-size="24" font-weight="700" fill="#18211d">Define success before evidence</text>
    <path d="M890 542 V566" fill="none" stroke="#faf7f0" stroke-width="4" marker-end="url(#cdh-test-arrow)" />
    <rect x="700" y="578" width="380" height="68" rx="14" fill="#faf7f0" />
    <text x="890" y="620" font-size="24" font-weight="700" fill="#18211d">Compare, revise or discard</text>
  </g>

  <text x="70" y="720" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#c46a3a">A passing test reduces one uncertainty; it does not validate the whole product.</text>
</svg>
