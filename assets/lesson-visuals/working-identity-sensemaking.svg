<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="working-identity-sensemaking-title working-identity-sensemaking-desc">
  <title id="working-identity-sensemaking-title">A revisable career story turns mixed evidence into another test</title>
  <desc id="working-identity-sensemaking-desc">Evidence from experiments, new relationships and personal reactions enters a working story. The story names what stays, what changes and what remains unknown, points to a next test and then updates when new evidence arrives.</desc>
  <defs>
    <marker id="working-identity-sensemaking-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 28px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>

  <rect class="card" x="348" y="30" width="504" height="64" rx="32" fill="#fffdf8"/>
  <text class="heading" x="600" y="72" text-anchor="middle">EVIDENCE → STORY → NEXT TEST</text>

  <rect class="card" x="40" y="150" width="320" height="112" rx="22" fill="#b8d5e5"/>
  <text class="heading" x="200" y="193" text-anchor="middle">EXPERIMENTS</text>
  <text class="small" x="200" y="227" text-anchor="middle">what happened</text>
  <text class="small" x="200" y="254" text-anchor="middle">in the work</text>

  <rect class="card" x="40" y="324" width="320" height="112" rx="22" fill="#d8cce8"/>
  <text class="heading" x="200" y="367" text-anchor="middle">RELATIONSHIPS</text>
  <text class="small" x="200" y="401" text-anchor="middle">what others</text>
  <text class="small" x="200" y="428" text-anchor="middle">made visible</text>

  <rect class="card" x="40" y="498" width="320" height="112" rx="22" fill="#f5c79d"/>
  <text class="heading" x="200" y="541" text-anchor="middle">REACTIONS</text>
  <text class="small" x="200" y="581" text-anchor="middle">energy · strain · surprise</text>

  <path class="line" d="M360 206H414" marker-end="url(#working-identity-sensemaking-arrow)"/>
  <path class="line" d="M360 380H414" marker-end="url(#working-identity-sensemaking-arrow)"/>
  <path class="line" d="M360 554H414" marker-end="url(#working-identity-sensemaking-arrow)"/>

  <rect class="card" x="430" y="134" width="420" height="472" rx="28" fill="#e4cf8e"/>
  <text class="heading" x="640" y="185" text-anchor="middle">WORKING STORY</text>
  <text class="small" x="640" y="220" text-anchor="middle">coherent, not final</text>
  <rect x="475" y="260" width="330" height="80" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="640" y="294" text-anchor="middle">WHAT STAYS?</text>
  <text class="small" x="640" y="325" text-anchor="middle">values and useful strengths</text>
  <rect x="475" y="365" width="330" height="80" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="640" y="399" text-anchor="middle">WHAT CHANGES?</text>
  <text class="small" x="640" y="430" text-anchor="middle">roles, settings and trade-offs</text>
  <rect x="475" y="470" width="330" height="104" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="640" y="504" text-anchor="middle">WHAT IS UNKNOWN?</text>
  <text class="small" x="640" y="536" text-anchor="middle">the uncertainty that matters</text>
  <text class="small" x="640" y="563" text-anchor="middle">next</text>

  <path class="line" d="M850 380H904" marker-end="url(#working-identity-sensemaking-arrow)"/>
  <rect class="card" x="920" y="270" width="240" height="210" rx="28" fill="#bdd9bf"/>
  <text class="small" x="1040" y="317" text-anchor="middle">NEXT TEST</text>
  <text class="heading" x="1040" y="364" text-anchor="middle">REDUCE ONE</text>
  <text class="heading" x="1040" y="399" text-anchor="middle">UNCERTAINTY</text>
  <text class="small" x="1040" y="447" text-anchor="middle">then observe again</text>

  <path class="line" d="M1040 480V644H640V620" marker-end="url(#working-identity-sensemaking-arrow)"/>
  <rect x="690" y="594" width="290" height="42" rx="16" fill="#faf7f0"/>
  <text class="small" x="835" y="622" text-anchor="middle">NEW EVIDENCE UPDATES</text>

  <rect class="card" x="10" y="680" width="560" height="54" rx="22" fill="#fffdf8"/>
  <text class="small" x="290" y="715" text-anchor="middle">HONEST ENOUGH TO INCLUDE CONTRADICTION</text>
  <rect class="card" x="660" y="680" width="500" height="54" rx="22" fill="#fffdf8"/>
  <text class="small" x="910" y="715" text-anchor="middle">CLEAR ENOUGH TO CHOOSE AN ACTION</text>
</svg>
