<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="staff-role-title staff-role-desc">
  <title id="staff-role-title">A staff title becomes useful when the local role has coordinates</title>
  <desc id="staff-role-desc">An ambiguous staff engineer title enters a map. Four coordinates identify organisational scope, technical depth, role shape and primary focus. The completed map becomes a role statement that can be compared with the expectations of key leaders.</desc>
  <defs>
    <marker id="staff-role-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .muted { fill: none; stroke: #53615a; stroke-width: 4; stroke-dasharray: 11 9; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="160" y="18" width="880" height="70" rx="35" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="61" text-anchor="middle">THE TITLE IS A LABEL · THE LOCAL ROLE NEEDS COORDINATES</text>

  <rect class="card" x="35" y="190" width="245" height="310" rx="30" fill="#d8cce8"/>
  <text class="small" x="157" y="235" text-anchor="middle">AMBIGUOUS LABEL</text>
  <text class="heading" x="157" y="300" text-anchor="middle">STAFF</text>
  <text class="heading" x="157" y="338" text-anchor="middle">ENGINEER</text>
  <path class="muted" d="M80 390H235"/>
  <text class="body" x="157" y="430" text-anchor="middle">Different companies</text>
  <text class="body" x="157" y="466" text-anchor="middle">mean different jobs</text>
  <path class="line" d="M280 345H340" marker-end="url(#staff-role-arrow)"/>

  <rect class="card" x="365" y="120" width="470" height="500" rx="34" fill="#fffdf8"/>
  <text class="heading" x="600" y="168" text-anchor="middle">MAP THE ROLE</text>
  <rect class="card" x="400" y="205" width="190" height="142" rx="24" fill="#b8d5e5"/>
  <text class="small" x="495" y="246" text-anchor="middle">SCOPE</text>
  <text class="body" x="495" y="285" text-anchor="middle">Team, group</text>
  <text class="body" x="495" y="319" text-anchor="middle">or company?</text>
  <rect class="card" x="610" y="205" width="190" height="142" rx="24" fill="#bdd9bf"/>
  <text class="small" x="705" y="246" text-anchor="middle">DEPTH</text>
  <text class="body" x="705" y="285" text-anchor="middle">Specialist</text>
  <text class="body" x="705" y="319" text-anchor="middle">or broad?</text>
  <rect class="card" x="400" y="372" width="190" height="142" rx="24" fill="#e9d17f"/>
  <text class="small" x="495" y="413" text-anchor="middle">SHAPE</text>
  <text class="body" x="495" y="452" text-anchor="middle">Advisor, lead</text>
  <text class="body" x="495" y="486" text-anchor="middle">or builder?</text>
  <rect class="card" x="610" y="372" width="190" height="142" rx="24" fill="#f5c79d"/>
  <text class="small" x="705" y="413" text-anchor="middle">FOCUS</text>
  <text class="body" x="705" y="452" text-anchor="middle">Which outcome</text>
  <text class="body" x="705" y="486" text-anchor="middle">must change?</text>
  <text class="small" x="600" y="558" text-anchor="middle">COMPARE EXPECTATIONS</text>
  <text class="small" x="600" y="588" text-anchor="middle">NAME CONFLICTS</text>

  <path class="line" d="M835 345H895" marker-end="url(#staff-role-arrow)"/>
  <rect class="card" x="920" y="165" width="245" height="360" rx="30" fill="#bdd9bf"/>
  <text class="small" x="1042" y="210" text-anchor="middle">ALIGNED CONTRACT</text>
  <rect x="950" y="245" width="185" height="84" rx="22" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="1042" y="279" text-anchor="middle">Decisions and</text>
  <text class="body" x="1042" y="312" text-anchor="middle">scope are clear</text>
  <rect x="950" y="350" width="185" height="84" rx="22" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="1042" y="384" text-anchor="middle">Outcomes can</text>
  <text class="body" x="1042" y="417" text-anchor="middle">be inspected</text>
  <text class="small" x="1042" y="480" text-anchor="middle">A HYPOTHESIS</text>
  <text class="small" x="1042" y="508" text-anchor="middle">TO TEST TOGETHER</text>

  <rect class="card" x="125" y="655" width="950" height="78" rx="28" fill="#fffdf8"/>
  <text class="small" x="600" y="703" text-anchor="middle">HARD WORK CANNOT RESOLVE AN UNSTATED ROLE DISAGREEMENT</text>
</svg>
