<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="noise-hygiene-title noise-hygiene-desc">
<title id="noise-hygiene-title">Decision hygiene structures evidence before the final judgement</title>
<desc id="noise-hygiene-desc">A shared case branches into three separately anchored criteria, then moves through independent scoring and aggregation to a documented decision or override. A contrasting shortcut shows an early overall impression pulling later judgements toward one story.</desc>
<defs>
  <style>text {font-family: Arial, sans-serif; fill: #18211d;}</style>
  <marker id="noise-hygiene-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#18211d"/></marker>
</defs>
<rect width="1200" height="760" fill="#faf7f0"/>
<text x="600" y="60" text-anchor="middle" font-size="34" font-weight="700">STRUCTURE THE EVIDENCE BEFORE THE STORY</text>
<rect x="60" y="145" width="210" height="112" rx="20" fill="#a9c7df" stroke="#18211d" stroke-width="3"/>
<text x="165" y="188" text-anchor="middle" font-size="26" font-weight="700">SHARED CASE</text>
<text x="165" y="225" text-anchor="middle" font-size="23">Same evidence set</text>
<path d="M272 201H340" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#noise-hygiene-arrow)"/>
<path d="M350 201V113H450M350 201H450M350 201V289H450" fill="none" stroke="#18211d" stroke-width="4"/>
<rect x="460" y="75" width="230" height="80" rx="16" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
<rect x="460" y="163" width="230" height="80" rx="16" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
<rect x="460" y="251" width="230" height="80" rx="16" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
<text x="575" y="108" text-anchor="middle" font-size="24" font-weight="700">CRITERION A</text>
<text x="575" y="137" text-anchor="middle" font-size="22">Observable anchors</text>
<text x="575" y="196" text-anchor="middle" font-size="24" font-weight="700">CRITERION B</text>
<text x="575" y="225" text-anchor="middle" font-size="22">Observable anchors</text>
<text x="575" y="284" text-anchor="middle" font-size="24" font-weight="700">CRITERION C</text>
<text x="575" y="313" text-anchor="middle" font-size="22">Observable anchors</text>
<path d="M692 115H730V201H785M692 203H785M692 291H730V203" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#noise-hygiene-arrow)"/>
<rect x="800" y="145" width="175" height="112" rx="20" fill="#e9d17f" stroke="#18211d" stroke-width="3"/>
<text x="888" y="188" text-anchor="middle" font-size="22" font-weight="700">SCORE ALONE</text>
<text x="888" y="225" text-anchor="middle" font-size="22">Then reveal</text>
<path d="M977 201H1025" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#noise-hygiene-arrow)"/>
<rect x="1040" y="145" width="120" height="112" rx="20" fill="#d7c4df" stroke="#18211d" stroke-width="3"/>
<text x="1100" y="188" text-anchor="middle" font-size="23" font-weight="700">COMBINE</text>
<text x="1100" y="225" text-anchor="middle" font-size="22">Views</text>
<path d="M1100 260V352H790" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#noise-hygiene-arrow)"/>
<rect x="390" y="355" width="455" height="142" rx="20" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
<text x="618" y="400" text-anchor="middle" font-size="26" font-weight="700">DOCUMENTED DECISION</text>
<text x="618" y="439" text-anchor="middle" font-size="23">Result and evidence</text>
<text x="618" y="470" text-anchor="middle" font-size="23">plus any reasoned override</text>
<path d="M618 500V555" fill="none" stroke="#18211d" stroke-width="4" marker-end="url(#noise-hygiene-arrow)"/>
<rect x="300" y="570" width="635" height="100" rx="20" fill="#ffffff" stroke="#18211d" stroke-width="3"/>
<text x="618" y="611" text-anchor="middle" font-size="27" font-weight="700">REVIEW RELIABILITY AND OUTCOMES</text>
<text x="618" y="647" text-anchor="middle" font-size="23">Consistency alone does not prove accuracy or fairness.</text>
<path d="M165 270V403H280" fill="none" stroke="#c75b39" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#noise-hygiene-arrow)"/>
<rect x="55" y="420" width="300" height="136" rx="20" fill="#e8b89c" stroke="#c75b39" stroke-width="4"/>
<text x="205" y="461" text-anchor="middle" font-size="25" font-weight="700">SHORTCUT</text>
<text x="205" y="497" text-anchor="middle" font-size="23">Early overall impression</text>
<text x="205" y="529" text-anchor="middle" font-size="23">pulls every later score</text>
<text x="600" y="724" text-anchor="middle" font-size="22">Structure judgement without pretending that a score is the whole decision.</text>
</svg>
