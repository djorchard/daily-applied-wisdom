<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="values-compass-title values-compass-desc">
  <title id="values-compass-title">A value is a direction made visible through small committed actions</title>
  <desc id="values-compass-desc">A compass points toward chosen qualities such as curiosity, care, courage and fairness. A path then turns the chosen direction into small observable steps, moves around a blocked goal and returns after going off course. The goal can finish, while the value continues to guide action.</desc>
  <defs>
    <marker id="values-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .label { font-size: 25px; font-weight: 700; }
      .body { font-size: 23px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="215" y="20" width="770" height="64" rx="32" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="61" text-anchor="middle">CHOOSE A DIRECTION, THEN MAKE IT OBSERVABLE</text>

  <rect class="card" x="38" y="116" width="430" height="542" rx="34" fill="#e9d17f"/>
  <text class="heading" x="253" y="166" text-anchor="middle">VALUE = DIRECTION</text>
  <circle cx="253" cy="382" r="125" fill="#fffdf8" stroke="#18211d" stroke-width="5"/>
  <circle cx="253" cy="382" r="22" fill="#18211d"/>
  <path d="M253 252L281 354L253 382L225 354Z" fill="#c35f43" stroke="#18211d" stroke-width="3"/>
  <path d="M253 512L225 410L253 382L281 410Z" fill="#b8d5e5" stroke="#18211d" stroke-width="3"/>
  <path class="line" d="M128 382H378M253 257V507" opacity="0.45"/>
  <text class="small" x="253" y="223" text-anchor="middle">CURIOSITY</text>
  <text class="small" x="253" y="552" text-anchor="middle">CARE</text>
  <text class="small" x="110" y="391" text-anchor="middle">COURAGE</text>
  <text class="small" x="396" y="391" text-anchor="middle">FAIRNESS</text>
  <text class="body" x="253" y="628" text-anchor="middle">Chosen quality of action</text>

  <rect class="card" x="510" y="116" width="650" height="542" rx="34" fill="#dcead9"/>
  <text class="heading" x="835" y="166" text-anchor="middle">COMMITTED ACTION = STEPS</text>

  <circle class="card" cx="590" cy="540" r="34" fill="#fffdf8"/>
  <text class="small" x="590" y="548" text-anchor="middle">1</text>
  <text class="body" x="590" y="596" text-anchor="middle">ask</text>

  <path class="line" d="M624 523C672 500 688 458 699 445" marker-end="url(#values-arrow)"/>
  <circle class="card" cx="730" cy="420" r="34" fill="#fffdf8"/>
  <text class="small" x="730" y="428" text-anchor="middle">2</text>
  <text class="body" x="730" y="478" text-anchor="middle">listen</text>

  <rect class="card" x="650" y="225" width="240" height="94" rx="22" fill="#f5c79d"/>
  <text class="small" x="770" y="264" text-anchor="middle">BLOCKED GOAL</text>
  <text class="body" x="770" y="298" text-anchor="middle">approval denied</text>
  <path class="line" d="M730 386C735 353 748 335 760 320"/>
  <path d="M746 332L774 360M774 332L746 360" stroke="#c35f43" stroke-width="7" stroke-linecap="round"/>

  <path class="line" d="M764 411C818 399 854 374 886 357" marker-end="url(#values-arrow)"/>
  <circle class="card" cx="920" cy="340" r="34" fill="#fffdf8"/>
  <text class="small" x="920" y="348" text-anchor="middle">3</text>
  <text class="body" x="920" y="398" text-anchor="middle">learn</text>
  <path class="line" d="M954 330C995 318 1012 282 1030 246" marker-end="url(#values-arrow)"/>

  <path d="M1050 190V305" stroke="#18211d" stroke-width="5" stroke-linecap="round"/>
  <path d="M1050 194H1140L1118 230L1140 266H1050Z" fill="#bdd9bf" stroke="#18211d" stroke-width="4" stroke-linejoin="round"/>
  <text class="small" x="1092" y="225" text-anchor="middle">NEW</text>
  <text class="small" x="1092" y="251" text-anchor="middle">EVIDENCE</text>

  <rect x="754" y="502" width="252" height="50" rx="25" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="880" y="535" text-anchor="middle">RETURN AFTER DRIFT</text>
  <path class="line" d="M1028 579C933 627 775 628 665 575" stroke-dasharray="12 12" marker-end="url(#values-arrow)"/>

  <rect class="card" x="183" y="695" width="834" height="48" rx="24" fill="#fffdf8"/>
  <text class="small" x="600" y="727" text-anchor="middle">THE GOAL CAN FINISH; THE VALUE CAN GUIDE THE NEXT STEP AGAIN</text>
</svg>
