<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="philosophy-effects-title philosophy-effects-desc">
  <title id="philosophy-effects-title">Diagnose software complexity by its causes and effects</title>
  <desc id="philosophy-effects-desc">Dependencies and obscurity feed into a software design. Developers experience the resulting complexity as change amplification, cognitive load or unknown unknowns. The diagram recommends naming the dominant effect before choosing a fix.</desc>
  <defs>
    <marker id="philosophy-effects-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="248" y="22" width="704" height="58" rx="29" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="60" text-anchor="middle" font-weight="700">NAME THE EFFECT BEFORE CHOOSING THE FIX</text>

  <text class="small" x="45" y="125">RECURRING CAUSES</text>
  <rect class="card" x="45" y="150" width="285" height="140" rx="24" fill="#f5c79d"/>
  <text class="compact" x="187.5" y="203" text-anchor="middle">DEPENDENCIES</text>
  <text class="body" x="187.5" y="243" text-anchor="middle">Knowledge and change</text>
  <text class="body" x="187.5" y="274" text-anchor="middle">cross boundaries</text>

  <rect class="card" x="45" y="365" width="285" height="140" rx="24" fill="#d8cce8"/>
  <text class="compact" x="187.5" y="418" text-anchor="middle">OBSCURITY</text>
  <text class="body" x="187.5" y="458" text-anchor="middle">Important facts are</text>
  <text class="body" x="187.5" y="489" text-anchor="middle">hard to discover</text>

  <path class="line" d="M330 220H385V292H430" marker-end="url(#philosophy-effects-arrow)"/>
  <path class="line" d="M330 435H385V363H430" marker-end="url(#philosophy-effects-arrow)"/>

  <rect class="card" x="430" y="225" width="280" height="205" rx="30" fill="#e9d17f"/>
  <circle cx="570" cy="302" r="51" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <path class="line" d="M545 302H595M570 277V327"/>
  <text class="compact" x="570" y="382" text-anchor="middle">SOFTWARE DESIGN</text>
  <text class="body" x="570" y="414" text-anchor="middle">Structure under change</text>

  <path class="line" d="M710 327H772"/>
  <path class="line" d="M772 327V171H810" marker-end="url(#philosophy-effects-arrow)"/>
  <path class="line" d="M772 327H810" marker-end="url(#philosophy-effects-arrow)"/>
  <path class="line" d="M772 327V483H810" marker-end="url(#philosophy-effects-arrow)"/>

  <text class="small" x="810" y="125">DEVELOPER EXPERIENCE</text>
  <rect class="card" x="810" y="145" width="345" height="112" rx="22" fill="#b8d5e5"/>
  <text class="compact" x="982.5" y="187" text-anchor="middle">CHANGE AMPLIFICATION</text>
  <text class="body" x="982.5" y="226" text-anchor="middle">One change touches many places</text>

  <rect class="card" x="810" y="301" width="345" height="112" rx="22" fill="#bdd9bf"/>
  <text class="compact" x="982.5" y="343" text-anchor="middle">COGNITIVE LOAD</text>
  <text class="body" x="982.5" y="382" text-anchor="middle">Many facts must stay in mind</text>

  <rect class="card" x="810" y="457" width="345" height="112" rx="22" fill="#f5c79d" stroke="#d86136" stroke-width="4"/>
  <text class="compact" x="982.5" y="499" text-anchor="middle">UNKNOWN UNKNOWNS</text>
  <text class="body" x="982.5" y="538" text-anchor="middle">A hidden dependency surprises</text>

  <rect class="card" x="115" y="630" width="970" height="88" rx="26" fill="#fffdf8"/>
  <text class="heading" x="600" y="670" text-anchor="middle">DIAGNOSIS TURNS “MESSY” INTO A TESTABLE HYPOTHESIS</text>
  <text class="body" x="600" y="705" text-anchor="middle">Observe a real change, then trace the dominant effect back to its cause</text>
</svg>
