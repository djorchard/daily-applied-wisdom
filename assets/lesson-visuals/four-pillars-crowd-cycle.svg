<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="four-pillars-crowd-title four-pillars-crowd-desc">
  <title id="four-pillars-crowd-title">Crowd behaviour repeats in a cycle</title>
  <desc id="four-pillars-crowd-desc">A six-stage clockwise loop moves from observation to a persuasive story, imitation, price detaching from value, reversal and later amnesia. History can warn that this mechanism repeats, but it cannot provide a reliable timing signal for the turn.</desc>
  <defs>
    <marker id="four-pillars-crowd-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .node-heading { font-size: 24px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="260" y="20" width="680" height="58" rx="29" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="58" text-anchor="middle" font-weight="700">CROWDS CHANGE; THE MECHANISM REPEATS</text>

  <path class="line" d="M750 148H800C830 148 830 230 850 230" marker-end="url(#four-pillars-crowd-arrow)"/>
  <path class="line" d="M1000 280V425" marker-end="url(#four-pillars-crowd-arrow)"/>
  <path class="line" d="M850 475H825C810 475 810 612 750 612" marker-end="url(#four-pillars-crowd-arrow)"/>
  <path class="line" d="M450 612H390C390 612 390 475 350 475" marker-end="url(#four-pillars-crowd-arrow)"/>
  <path class="line" d="M200 425V280" marker-end="url(#four-pillars-crowd-arrow)"/>
  <path class="line" d="M350 230H375C400 230 400 148 450 148" marker-end="url(#four-pillars-crowd-arrow)"/>

  <rect class="card" x="450" y="98" width="300" height="100" rx="22" fill="#b8d5e5"/>
  <circle cx="480" cy="130" r="20" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="480" y="138" text-anchor="middle">1</text>
  <text class="node-heading" x="610" y="137" text-anchor="middle">OBSERVATION</text>
  <text class="body" x="600" y="174" text-anchor="middle">A striking event appears</text>

  <rect class="card" x="850" y="180" width="300" height="100" rx="22" fill="#d8cce8"/>
  <circle cx="880" cy="212" r="20" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="880" y="220" text-anchor="middle">2</text>
  <text class="small" x="1025" y="218" text-anchor="middle">PERSUASIVE STORY</text>
  <text class="body" x="1000" y="255" text-anchor="middle">A simple story spreads</text>

  <rect class="card" x="850" y="425" width="300" height="100" rx="22" fill="#e9d17f"/>
  <circle cx="880" cy="457" r="20" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="880" y="465" text-anchor="middle">3</text>
  <text class="node-heading" x="1010" y="463" text-anchor="middle">IMITATION</text>
  <text class="body" x="1000" y="500" text-anchor="middle">Copying feels safer</text>

  <rect class="card" x="450" y="562" width="300" height="100" rx="22" fill="#f5c79d" stroke="#d86136" stroke-width="4"/>
  <circle cx="480" cy="594" r="20" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="480" y="602" text-anchor="middle">4</text>
  <text class="node-heading" x="615" y="600" text-anchor="middle">PRICE DETACHES</text>
  <text class="body" x="600" y="637" text-anchor="middle">Price outruns value</text>

  <rect class="card" x="50" y="425" width="300" height="100" rx="22" fill="#bdd9bf"/>
  <circle cx="80" cy="457" r="20" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="80" y="465" text-anchor="middle">5</text>
  <text class="node-heading" x="210" y="463" text-anchor="middle">REVERSAL</text>
  <text class="body" x="200" y="500" text-anchor="middle">Expectations reverse</text>

  <rect class="card" x="50" y="180" width="300" height="100" rx="22" fill="#fffdf8"/>
  <circle cx="80" cy="212" r="20" fill="#f5c79d" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="80" y="220" text-anchor="middle">6</text>
  <text class="node-heading" x="215" y="218" text-anchor="middle">LATER AMNESIA</text>
  <text class="body" x="200" y="255" text-anchor="middle">The painful lesson fades</text>

  <rect class="card" x="405" y="285" width="390" height="210" rx="30" fill="#fffdf8"/>
  <text class="small" x="600" y="326" text-anchor="middle">USE HISTORY FOR ITS RIGHT JOB</text>
  <rect x="430" y="348" width="340" height="70" rx="20" fill="#f5c79d" stroke="#d86136" stroke-width="4"/>
  <text class="heading" x="600" y="393" text-anchor="middle">WARNING: YES</text>
  <text class="compact" x="600" y="458" text-anchor="middle">TIMING SIGNAL: NO</text>
  <text class="body" x="600" y="486" text-anchor="middle">Patterns repeat; timing does not</text>

  <rect x="250" y="695" width="700" height="44" rx="22" fill="#e9d17f" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="725" text-anchor="middle">RECOGNITION SUPPORTS CAUTION, NOT PREDICTION</text>
</svg>
