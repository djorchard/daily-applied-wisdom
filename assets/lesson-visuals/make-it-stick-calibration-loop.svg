<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="make-stick-calibration-title make-stick-calibration-desc">
  <title id="make-stick-calibration-title">Calibrate learning with a supported difficulty loop</title>
  <desc id="make-stick-calibration-desc">A gate asks whether a challenge matches the goal, remains achievable with support and includes corrective feedback. A loop then records a confidence prediction, runs a low-stakes attempt, compares prediction with performance, classifies the gap and targets the next practice.</desc>
  <defs>
    <marker id="make-stick-calibration-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="210" y="18" width="780" height="72" rx="36" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="62" text-anchor="middle" font-weight="700">DIFFICULTY HELPS ONLY WHEN THE LEARNING CONDITIONS FIT</text>

  <text class="small" x="45" y="132">DESIRABLE-DIFFICULTY GATE</text>
  <rect class="card" x="45" y="150" width="1110" height="150" rx="30" fill="#e9d17f"/>
  <rect x="75" y="192" width="295" height="70" rx="22" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="222" y="235" text-anchor="middle">MATCHES THE GOAL</text>
  <text class="heading" x="412" y="239" text-anchor="middle">+</text>
  <rect x="455" y="192" width="295" height="70" rx="22" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="602" y="235" text-anchor="middle">ACHIEVABLE WITH HELP</text>
  <text class="heading" x="792" y="239" text-anchor="middle">+</text>
  <rect x="835" y="192" width="300" height="70" rx="22" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="985" y="235" text-anchor="middle">CORRECTIVE FEEDBACK</text>

  <path class="line" d="M600 300V350" marker-end="url(#make-stick-calibration-arrow)"/>

  <rect class="card" x="45" y="365" width="240" height="148" rx="28" fill="#b8d5e5"/>
  <text class="small" x="165" y="405" text-anchor="middle">1 · PREDICT</text>
  <text class="compact" x="165" y="445" text-anchor="middle">What can I</text>
  <text class="compact" x="165" y="477" text-anchor="middle">produce now?</text>

  <path class="line" d="M285 439H320" marker-end="url(#make-stick-calibration-arrow)"/>

  <rect class="card" x="335" y="365" width="240" height="148" rx="28" fill="#bdd9bf"/>
  <text class="small" x="455" y="405" text-anchor="middle">2 · ATTEMPT</text>
  <text class="compact" x="455" y="445" text-anchor="middle">Low stakes</text>
  <text class="compact" x="455" y="477" text-anchor="middle">and no notes</text>

  <path class="line" d="M575 439H610" marker-end="url(#make-stick-calibration-arrow)"/>

  <rect class="card" x="625" y="365" width="240" height="148" rx="28" fill="#d8cce8"/>
  <text class="small" x="745" y="405" text-anchor="middle">3 · COMPARE</text>
  <text class="compact" x="745" y="445" text-anchor="middle">Prediction</text>
  <text class="compact" x="745" y="477" text-anchor="middle">versus result</text>

  <path class="line" d="M865 439H900" marker-end="url(#make-stick-calibration-arrow)"/>

  <rect class="card" x="915" y="365" width="240" height="160" rx="28" fill="#f5c79d"/>
  <text class="small" x="1035" y="405" text-anchor="middle">4 · CLASSIFY</text>
  <text class="body" x="1035" y="441" text-anchor="middle">Knowledge gap</text>
  <text class="body" x="1035" y="474" text-anchor="middle">Wrong choice</text>
  <text class="body" x="1035" y="507" text-anchor="middle">Execution error</text>

  <path class="line" d="M1035 525V590H900" marker-end="url(#make-stick-calibration-arrow)"/>
  <rect class="card" x="300" y="555" width="600" height="120" rx="28" fill="#fffdf8"/>
  <text class="heading" x="600" y="601" text-anchor="middle">TARGET THE NEXT PRACTICE</text>
  <text class="body" x="600" y="638" text-anchor="middle">Choose one challenge that addresses the gap</text>
  <path class="line" d="M300 615H165V529" marker-end="url(#make-stick-calibration-arrow)"/>

  <text class="small" x="600" y="726" text-anchor="middle">ONE SCORE GUIDES PRACTICE; IT DOES NOT DEFINE A PERSON'S ABILITY</text>
</svg>
