<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="gathering-thresholds-title gathering-thresholds-desc">
  <title id="gathering-thresholds-title">A gathering uses deliberate thresholds to enter and leave a temporary shared world</title>
  <desc id="gathering-thresholds-desc">Five connected stages move from ordinary life through invitation, opening and a temporary shared world, then through an intentional close back to ordinary life. The final stage carries one decision, connection or insight outward rather than letting the gathering dissolve into logistics.</desc>
  <defs>
    <marker id="gathering-thresholds-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="350" y="30" width="500" height="62" rx="31" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="600" y="70" text-anchor="middle">A BOUNDED SHARED EXPERIENCE</text>
  <path class="line" d="M220 356H268" marker-end="url(#gathering-thresholds-arrow)"/>
  <path class="line" d="M450 356H498" marker-end="url(#gathering-thresholds-arrow)"/>
  <path class="line" d="M702 356H750" marker-end="url(#gathering-thresholds-arrow)"/>
  <path class="line" d="M932 356H980" marker-end="url(#gathering-thresholds-arrow)"/>
  <rect class="card" x="30" y="190" width="190" height="332" rx="24" fill="#fffdf8"/>
  <text class="small" x="125" y="236" text-anchor="middle">BEFORE</text>
  <text class="heading" x="125" y="290" text-anchor="middle">ORDINARY</text>
  <text class="heading" x="125" y="328" text-anchor="middle">LIFE</text>
  <text class="body" x="125" y="390" text-anchor="middle">roles</text>
  <text class="body" x="125" y="426" text-anchor="middle">routines</text>
  <text class="body" x="125" y="462" text-anchor="middle">distractions</text>
  <rect class="card" x="268" y="190" width="182" height="332" rx="24" fill="#e9d17f"/>
  <text class="small" x="359" y="236" text-anchor="middle">ENTRY</text>
  <text class="heading" x="359" y="290" text-anchor="middle">INVITE</text>
  <text class="heading" x="359" y="328" text-anchor="middle">+ OPEN</text>
  <text class="body" x="359" y="390" text-anchor="middle">name why</text>
  <text class="body" x="359" y="426" text-anchor="middle">prepare the role</text>
  <text class="small" x="359" y="480" text-anchor="middle">CROSS IN</text>
  <rect class="card" x="498" y="146" width="204" height="420" rx="28" fill="#d8cce8"/>
  <text class="small" x="600" y="190" text-anchor="middle">TEMPORARY</text>
  <text class="small" x="600" y="218" text-anchor="middle">WORLD</text>
  <text class="heading" x="600" y="276" text-anchor="middle">GATHER</text>
  <circle cx="600" cy="356" r="58" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <circle cx="600" cy="356" r="16" fill="#18211d"/>
  <text class="body" x="600" y="444" text-anchor="middle">purpose lives</text>
  <text class="body" x="600" y="480" text-anchor="middle">through</text>
  <text class="body" x="600" y="516" text-anchor="middle">participation</text>
  <rect class="card" x="750" y="190" width="182" height="332" rx="24" fill="#b8d5e5"/>
  <text class="small" x="841" y="236" text-anchor="middle">EXIT</text>
  <text class="heading" x="841" y="290" text-anchor="middle">CLOSE</text>
  <text class="body" x="841" y="366" text-anchor="middle">reflect</text>
  <text class="body" x="841" y="402" text-anchor="middle">recognise</text>
  <text class="body" x="841" y="438" text-anchor="middle">turn outward</text>
  <text class="small" x="841" y="480" text-anchor="middle">CROSS OUT</text>
  <rect class="card" x="980" y="190" width="190" height="332" rx="24" fill="#bdd9bf"/>
  <text class="small" x="1075" y="236" text-anchor="middle">AFTER</text>
  <text class="heading" x="1075" y="290" text-anchor="middle">RETURN</text>
  <text class="body" x="1075" y="370" text-anchor="middle">carry one</text>
  <text class="body" x="1075" y="406" text-anchor="middle">decision</text>
  <text class="body" x="1075" y="442" text-anchor="middle">connection</text>
  <text class="body" x="1075" y="478" text-anchor="middle">or insight</text>
  <rect x="210" y="632" width="780" height="70" rx="35" fill="#f5c79d" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="676" text-anchor="middle" font-weight="700">CLOSE BEFORE THE GROUP DISSOLVES INTO LOGISTICS</text>
</svg>
