<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="staff-portfolio-title staff-portfolio-desc">
  <title id="staff-portfolio-title">Finite time turns useful opportunities into a portfolio choice</title>
  <desc id="staff-portfolio-desc">Four useful project cards enter a filter that asks about organisational value, personal direction and real capacity. Two commitments fit inside a finite portfolio frame. One project is deferred and another declined rather than hidden in an impossible queue.</desc>
  <defs>
    <marker id="staff-portfolio-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .compact { font-size: 26px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .muted { fill: none; stroke: #53615a; stroke-width: 4; stroke-dasharray: 11 9; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="155" y="18" width="890" height="70" rx="35" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="61" text-anchor="middle">MANY PROBLEMS ARE WORTHWHILE · CAPACITY IS STILL FINITE</text>

  <text class="small" x="155" y="132" text-anchor="middle">USEFUL CANDIDATES</text>
  <rect class="card" x="35" y="155" width="240" height="88" rx="22" fill="#b8d5e5"/>
  <text class="body" x="155" y="209" text-anchor="middle">Platform repair</text>
  <rect class="card" x="35" y="263" width="240" height="88" rx="22" fill="#e9d17f"/>
  <text class="body" x="155" y="317" text-anchor="middle">Cross-team launch</text>
  <rect class="card" x="35" y="371" width="240" height="88" rx="22" fill="#f5c79d"/>
  <text class="body" x="155" y="425" text-anchor="middle">Mentoring request</text>
  <rect class="card" x="35" y="479" width="240" height="88" rx="22" fill="#d8cce8"/>
  <text class="body" x="155" y="533" text-anchor="middle">Strategy refresh</text>
  <path d="M370 125H760L815 200V515L760 590H370L315 515V200Z" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <text class="heading" x="565" y="177" text-anchor="middle">THREE-QUESTION FILTER</text>
  <rect class="card" x="370" y="220" width="390" height="86" rx="24" fill="#bdd9bf"/>
  <text class="small" x="565" y="254" text-anchor="middle">1 · ORGANISATIONAL VALUE</text>
  <text class="body" x="565" y="286" text-anchor="middle">Which outcome matters?</text>
  <rect class="card" x="370" y="326" width="390" height="86" rx="24" fill="#b8d5e5"/>
  <text class="small" x="565" y="360" text-anchor="middle">2 · PERSONAL DIRECTION</text>
  <text class="body" x="565" y="392" text-anchor="middle">What will this develop?</text>
  <rect class="card" x="370" y="432" width="390" height="86" rx="24" fill="#e9d17f"/>
  <text class="small" x="565" y="466" text-anchor="middle">3 · REAL CAPACITY</text>
  <text class="body" x="565" y="498" text-anchor="middle">What must leave to fit?</text>
  <text class="small" x="565" y="555" text-anchor="middle">CHOOSING ONE PATH CLOSES ANOTHER</text>
  <path class="line" d="M275 360H342" marker-end="url(#staff-portfolio-arrow)"/>

  <path class="line" d="M815 360H870" marker-end="url(#staff-portfolio-arrow)"/>
  <rect class="card" x="895" y="120" width="270" height="465" rx="32" fill="#fffdf8"/>
  <text class="compact" x="1030" y="169" text-anchor="middle">FINITE PORTFOLIO</text>
  <rect class="card" x="930" y="205" width="200" height="100" rx="24" fill="#bdd9bf"/>
  <text class="small" x="1030" y="244" text-anchor="middle">COMMIT</text>
  <text class="body" x="1030" y="278" text-anchor="middle">Coherent slot 1</text>
  <rect class="card" x="930" y="325" width="200" height="100" rx="24" fill="#b8d5e5"/>
  <text class="small" x="1030" y="364" text-anchor="middle">COMMIT</text>
  <text class="body" x="1030" y="398" text-anchor="middle">Coherent slot 2</text>
  <path class="muted" d="M930 470H1130"/>
  <text class="small" x="1030" y="510" text-anchor="middle">NO HIDDEN SLOT</text>
  <text class="body" x="1030" y="548" text-anchor="middle">Boundary stays real</text>

  <rect class="card" x="150" y="635" width="900" height="98" rx="28" fill="#fffdf8"/>
  <text class="compact" x="600" y="675" text-anchor="middle">DECLINE OR DEFER EXPLICITLY</text>
  <text class="small" x="600" y="710" text-anchor="middle">DO NOT DISGUISE AN IMPOSSIBLE QUEUE AS COMMITMENT</text>
</svg>
