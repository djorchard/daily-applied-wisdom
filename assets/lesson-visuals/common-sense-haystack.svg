<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="cs-haystack-title cs-haystack-desc">
  <title id="cs-haystack-title">Broad ownership reduces dependence on guessing one winner</title>
  <desc id="cs-haystack-desc">The left panel shows a concentrated needle search that depends on selecting one future winner. The right panel shows broad ownership across many companies and groups, producing market exposure without a winner prediction. A warning states that breadth reduces specific risk but not market risk.</desc>
  <defs>
    <marker id="cs-haystack-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
      .heading { font-size: 31px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .holding { stroke: #18211d; stroke-width: 3; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="252" y="28" width="696" height="62" rx="31" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="600" y="68" text-anchor="middle">REMOVE THE NEED TO PICK THE WINNER</text>
  <line x1="600" y1="120" x2="600" y2="650" stroke="#18211d" stroke-width="3" stroke-dasharray="10 12"/>

  <rect x="54" y="116" width="492" height="62" rx="31" fill="#f5c79d" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="300" y="156" text-anchor="middle">NEEDLE SEARCH</text>
  <text class="small" x="124" y="222" text-anchor="middle">CANDIDATES</text>
  <circle class="holding" cx="84" cy="270" r="22" fill="#b8d5e5"/>
  <circle class="holding" cx="148" cy="270" r="22" fill="#bdd9bf"/>
  <circle class="holding" cx="212" cy="270" r="22" fill="#d7c4e8"/>
  <circle class="holding" cx="84" cy="334" r="22" fill="#e9d17f"/>
  <circle class="holding" cx="148" cy="334" r="22" fill="#f5c79d"/>
  <circle class="holding" cx="212" cy="334" r="22" fill="#b8d5e5"/>
  <circle class="holding" cx="84" cy="398" r="22" fill="#bdd9bf"/>
  <circle class="holding" cx="148" cy="398" r="22" fill="#d7c4e8"/>
  <circle class="holding" cx="212" cy="398" r="22" fill="#e9d17f"/>
  <path class="line" d="M244 334H322" marker-end="url(#cs-haystack-arrow)"/>
  <rect class="card" x="340" y="244" width="162" height="180" rx="26" fill="#e9d17f"/>
  <text class="small" x="421" y="288" text-anchor="middle">ONE PICK</text>
  <text class="heading" x="421" y="344" text-anchor="middle">GUESS</text>
  <text class="body" x="421" y="386" text-anchor="middle">must be right</text>
  <rect x="74" y="470" width="432" height="124" rx="24" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="heading" x="290" y="518" text-anchor="middle">CONCENTRATED RESULT</text>
  <text class="body" x="290" y="560" text-anchor="middle">One selection carries the outcome</text>

  <rect x="654" y="116" width="492" height="62" rx="31" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="900" y="156" text-anchor="middle">BROAD OWNERSHIP</text>
  <text class="small" x="790" y="222" text-anchor="middle">MANY HOLDINGS</text>
  <rect class="holding" x="668" y="250" width="48" height="48" rx="8" fill="#b8d5e5"/>
  <rect class="holding" x="730" y="250" width="48" height="48" rx="8" fill="#bdd9bf"/>
  <rect class="holding" x="792" y="250" width="48" height="48" rx="8" fill="#d7c4e8"/>
  <rect class="holding" x="854" y="250" width="48" height="48" rx="8" fill="#e9d17f"/>
  <rect class="holding" x="668" y="312" width="48" height="48" rx="8" fill="#f5c79d"/>
  <rect class="holding" x="730" y="312" width="48" height="48" rx="8" fill="#e9d17f"/>
  <rect class="holding" x="792" y="312" width="48" height="48" rx="8" fill="#b8d5e5"/>
  <rect class="holding" x="854" y="312" width="48" height="48" rx="8" fill="#bdd9bf"/>
  <rect class="holding" x="668" y="374" width="48" height="48" rx="8" fill="#d7c4e8"/>
  <rect class="holding" x="730" y="374" width="48" height="48" rx="8" fill="#f5c79d"/>
  <rect class="holding" x="792" y="374" width="48" height="48" rx="8" fill="#bdd9bf"/>
  <rect class="holding" x="854" y="374" width="48" height="48" rx="8" fill="#e9d17f"/>
  <path class="line" d="M924 334H984" marker-end="url(#cs-haystack-arrow)"/>
  <rect class="card" x="1002" y="244" width="144" height="180" rx="26" fill="#b8d5e5"/>
  <text class="small" x="1074" y="288" text-anchor="middle">NO PICK</text>
  <text class="heading" x="1074" y="344" text-anchor="middle">MARKET</text>
  <text class="body" x="1074" y="386" text-anchor="middle">minus costs</text>
  <rect x="674" y="470" width="432" height="124" rx="24" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="heading" x="890" y="518" text-anchor="middle">DISTRIBUTED RESULT</text>
  <text class="body" x="890" y="560" text-anchor="middle">Many holdings share the outcome</text>

  <rect x="148" y="676" width="904" height="52" rx="26" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="710" text-anchor="middle">Breadth reduces specific risk; it does not remove broad market risk</text>
</svg>
