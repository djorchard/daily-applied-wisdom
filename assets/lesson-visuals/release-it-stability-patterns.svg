<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="release-patterns-title release-patterns-desc">
  <title id="release-patterns-title">Three stability patterns protect different dimensions of a remote call</title>
  <desc id="release-patterns-desc">A request passes through three coordinated controls. A timeout bounds one attempt, a circuit breaker suppresses repeated likely failures and allows a trial after recovery, and a bulkhead limits how much shared capacity the dependency may consume. A refusal policy defines the caller's degraded outcome.</desc>
  <defs>
    <marker id="release-patterns-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; font-weight: 700; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <rect x="322" y="28" width="556" height="62" rx="31" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="label" x="600" y="68" text-anchor="middle">THREE CONTROLS, THREE JOBS</text>
  <rect class="card" x="40" y="286" width="146" height="92" rx="20" fill="#fffdf8"/>
  <text class="heading" x="113" y="326" text-anchor="middle">CALL</text>
  <text class="body" x="113" y="360" text-anchor="middle">request</text>
  <path class="line" d="M186 332H228" marker-end="url(#release-patterns-arrow)"/>

  <rect class="card" x="232" y="138" width="250" height="388" rx="26" fill="#e9d17f"/>
  <text class="label" x="357" y="188" text-anchor="middle">TIMEOUT</text>
  <circle cx="357" cy="294" r="70" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <line x1="357" y1="294" x2="357" y2="248" stroke="#18211d" stroke-width="6" stroke-linecap="round"/>
  <line x1="357" y1="294" x2="398" y2="318" stroke="#18211d" stroke-width="6" stroke-linecap="round"/>
  <circle cx="357" cy="294" r="8" fill="#18211d"/>
  <text class="heading" x="357" y="404" text-anchor="middle">LIMIT ONE WAIT</text>
  <text class="body" x="357" y="448" text-anchor="middle">attempt budget</text>
  <text class="small" x="357" y="490" text-anchor="middle">CANCEL REAL WORK</text>
  <path class="line" d="M482 332H524" marker-end="url(#release-patterns-arrow)"/>

  <rect class="card" x="528" y="138" width="250" height="388" rx="26" fill="#f5c79d"/>
  <text class="label" x="653" y="188" text-anchor="middle">CIRCUIT BREAKER</text>
  <circle cx="594" cy="286" r="52" fill="#bdd9bf" stroke="#18211d" stroke-width="4"/>
  <text class="small" x="594" y="294" text-anchor="middle">CLOSED</text>
  <circle cx="712" cy="286" r="52" fill="#f3a8a0" stroke="#18211d" stroke-width="4"/>
  <text class="small" x="712" y="294" text-anchor="middle">OPEN</text>
  <path class="line" d="M646 286H658" marker-end="url(#release-patterns-arrow)"/>
  <path class="line" d="M712 338C712 378 594 378 594 338" marker-end="url(#release-patterns-arrow)"/>
  <text class="small" x="653" y="390" text-anchor="middle">CONTROLLED TRIAL</text>
  <text class="heading" x="653" y="432" text-anchor="middle">STOP REPEATS</text>
  <text class="body" x="653" y="474" text-anchor="middle">likely failures</text>
  <path class="line" d="M778 332H820" marker-end="url(#release-patterns-arrow)"/>

  <rect class="card" x="824" y="138" width="250" height="388" rx="26" fill="#b8d5e5"/>
  <text class="label" x="949" y="188" text-anchor="middle">BULKHEAD</text>
  <rect x="866" y="232" width="166" height="118" rx="16" fill="#fffdf8" stroke="#18211d" stroke-width="4"/>
  <line x1="921" y1="232" x2="921" y2="350" stroke="#18211d" stroke-width="4"/>
  <line x1="977" y1="232" x2="977" y2="350" stroke="#18211d" stroke-width="4"/>
  <circle cx="893" cy="291" r="14" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
  <circle cx="949" cy="291" r="14" fill="#bdd9bf" stroke="#18211d" stroke-width="3"/>
  <circle cx="1005" cy="291" r="14" fill="#f3a8a0" stroke="#18211d" stroke-width="3"/>
  <text class="heading" x="949" y="412" text-anchor="middle">LIMIT SHARING</text>
  <text class="body" x="949" y="454" text-anchor="middle">finite capacity</text>
  <text class="small" x="949" y="496" text-anchor="middle">SAVE CAPACITY</text>
  <path class="line" d="M1074 332H1114" marker-end="url(#release-patterns-arrow)"/>
  <rect class="card" x="1114" y="286" width="58" height="92" rx="18" fill="#d8cce8"/>
  <text class="small" x="1143" y="326" text-anchor="middle" transform="rotate(90 1143 326)">REMOTE</text>

  <rect x="180" y="604" width="840" height="106" rx="26" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="heading" x="600" y="648" text-anchor="middle">REFUSAL POLICY COMPLETES THE DESIGN</text>
  <text class="body" x="600" y="688" text-anchor="middle">Fail, queue, shed or degrade without inventing success</text>
  <path class="line" d="M357 526V570H600V596" marker-end="url(#release-patterns-arrow)"/>
  <path class="line" d="M653 526V570"/>
  <path class="line" d="M949 526V570H600"/>
</svg>
