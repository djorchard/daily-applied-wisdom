<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="measurement-decision-title measurement-decision-desc">
  <title id="measurement-decision-title">Turn a vague unknown into decision evidence</title>
  <desc id="measurement-decision-desc">A four-stage flow starts with a choice, defines an observable outcome, takes a focused observation and updates a wide range to a narrower range that can inform the choice.</desc>
  <defs>
    <marker id="measurement-decision-arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0 0 L18 9 L0 18 Z" fill="#356987"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: .04em; }
      .body { font-size: 24px; }
      .small { font-size: 22px; }
      .card { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #356987; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="36" fill="#f5f1e8"/>
  <text x="70" y="70" class="label">START WITH THE CHOICE</text>

  <rect class="card" x="55" y="145" width="245" height="210" rx="26" fill="#e8e0f2"/>
  <text x="177" y="195" class="label" text-anchor="middle">DECISION</text>
  <text x="177" y="243" class="body" text-anchor="middle">Choose A or B</text>
  <text x="177" y="286" class="small" text-anchor="middle">What outcome would</text>
  <text x="177" y="320" class="small" text-anchor="middle">change the choice?</text>

  <rect class="card" x="345" y="145" width="245" height="210" rx="26" fill="#ead9cb"/>
  <text x="467" y="195" class="label" text-anchor="middle">OBSERVABLE</text>
  <text x="467" y="243" class="body" text-anchor="middle">Name the quantity</text>
  <text x="467" y="286" class="small" text-anchor="middle">Add a time window</text>
  <text x="467" y="320" class="small" text-anchor="middle">and threshold</text>

  <rect class="card" x="635" y="145" width="245" height="210" rx="26" fill="#f2d6a2"/>
  <text x="757" y="195" class="label" text-anchor="middle">OBSERVATION</text>
  <text x="757" y="238" class="body" text-anchor="middle">Take a focused</text>
  <text x="757" y="274" class="body" text-anchor="middle">sample</text>
  <text x="757" y="316" class="small" text-anchor="middle">Update the range</text>

  <rect class="card" x="925" y="145" width="220" height="210" rx="26" fill="#dbe8e2"/>
  <text x="1035" y="195" class="label" text-anchor="middle">UPDATE</text>
  <text x="1035" y="243" class="body" text-anchor="middle">Narrow the range</text>
  <text x="1035" y="286" class="small" text-anchor="middle">Choose, test again</text>
  <text x="1035" y="320" class="small" text-anchor="middle">or stop</text>

  <path class="line" d="M300 250 H329" marker-end="url(#measurement-decision-arrow)"/>
  <path class="line" d="M590 250 H619" marker-end="url(#measurement-decision-arrow)"/>
  <path class="line" d="M880 250 H909" marker-end="url(#measurement-decision-arrow)"/>

  <rect class="card" x="90" y="455" width="470" height="205" rx="28" fill="#fffdf8"/>
  <text x="325" y="505" class="label" text-anchor="middle">NOT PERFECT CERTAINTY</text>
  <path d="M155 570 H495" stroke="#18211d" stroke-width="4" stroke-linecap="round"/>
  <circle cx="205" cy="570" r="10" fill="#b04f77"/>
  <circle cx="445" cy="570" r="10" fill="#b04f77"/>
  <path d="M270 570 H390" stroke="#356987" stroke-width="16" stroke-linecap="round"/>
  <text x="325" y="625" class="small" text-anchor="middle">A narrower honest range is already learning</text>

  <rect class="card" x="640" y="455" width="470" height="205" rx="28" fill="#fffdf8"/>
  <text x="875" y="505" class="label" text-anchor="middle">NOT A CONVENIENT PROXY</text>
  <text x="875" y="558" class="body" text-anchor="middle">Keep the real outcome visible</text>
  <text x="875" y="600" class="small" text-anchor="middle">A precise metric can still measure</text>
  <text x="875" y="634" class="small" text-anchor="middle">the wrong consequence</text>
</svg>
