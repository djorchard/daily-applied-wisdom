<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="money-reasonable-title money-reasonable-desc">
  <title id="money-reasonable-title">The same financial event passes through different personal histories</title>
  <desc id="money-reasonable-desc">A shared market fall branches to three people shaped by different experiences and obligations. Each reaction is then converted into a financially sound rule that the person can sustain.</desc>
  <defs>
    <marker id="money-reasonable-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 28px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .card { stroke: #18211d; stroke-width: 4; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>

  <rect class="card" x="350" y="48" width="500" height="92" rx="46" fill="#f5c79d"/>
  <path d="M400 86H440L458 72L480 111L503 82L526 97L553 69" class="line"/>
  <text class="heading" x="690" y="105" text-anchor="middle">SAME MARKET FALL</text>

  <path class="line" d="M600 140V182H220V220" marker-end="url(#money-reasonable-arrow)"/>
  <path class="line" d="M600 140V220" marker-end="url(#money-reasonable-arrow)"/>
  <path class="line" d="M600 182H980V220" marker-end="url(#money-reasonable-arrow)"/>

  <rect class="card" x="50" y="230" width="340" height="355" rx="22" fill="#b8d5e5"/>
  <text class="heading" x="220" y="282" text-anchor="middle">RECENT STARTER</text>
  <text class="body" x="220" y="329" text-anchor="middle">History: long horizon</text>
  <text class="body" x="220" y="365" text-anchor="middle">and little market history</text>
  <line x1="82" y1="395" x2="358" y2="395" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="220" y="438" text-anchor="middle">Feels like: opportunity</text>
  <rect x="82" y="478" width="276" height="74" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="220" y="509" text-anchor="middle">Sound rule:</text>
  <text class="small" x="220" y="539" text-anchor="middle">keep regular contributions</text>

  <rect class="card" x="430" y="230" width="340" height="355" rx="22" fill="#e4cf8e"/>
  <text class="heading" x="600" y="282" text-anchor="middle">CAREGIVER</text>
  <text class="body" x="600" y="329" text-anchor="middle">History: variable income</text>
  <text class="body" x="600" y="365" text-anchor="middle">and near-term obligations</text>
  <line x1="462" y1="395" x2="738" y2="395" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="600" y="438" text-anchor="middle">Feels like: less flexibility</text>
  <rect x="462" y="478" width="276" height="74" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="600" y="509" text-anchor="middle">Sound rule:</text>
  <text class="small" x="600" y="539" text-anchor="middle">protect liquid reserves</text>

  <rect class="card" x="810" y="230" width="340" height="355" rx="22" fill="#d8cce8"/>
  <text class="heading" x="980" y="282" text-anchor="middle">CRASH SURVIVOR</text>
  <text class="body" x="980" y="329" text-anchor="middle">History: major loss</text>
  <text class="body" x="980" y="365" text-anchor="middle">followed by a forced sale</text>
  <line x1="842" y1="395" x2="1118" y2="395" stroke="#18211d" stroke-width="3"/>
  <text class="body" x="980" y="438" text-anchor="middle">Feels like: repeat danger</text>
  <rect x="842" y="478" width="276" height="74" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
  <text class="small" x="980" y="509" text-anchor="middle">Sound rule:</text>
  <text class="small" x="980" y="539" text-anchor="middle">hold tolerable risk</text>

  <path class="line" d="M220 585V630H600"/>
  <path class="line" d="M600 585V630"/>
  <path class="line" d="M980 585V630H600"/>
  <rect class="card" x="200" y="630" width="800" height="82" rx="22" fill="#bdd9bf"/>
  <text class="heading" x="600" y="680" text-anchor="middle">SOUND ENOUGH TO TRUST · FIT ENOUGH TO KEEP</text>
</svg>
