<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Code review turning local context into shared outcomes</title>
  <desc id="desc">An author submits a small change containing code, rationale, and tests. Review turns that local context into three explicit outcomes: defects caught, context shared, and decision history.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#18211d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #18211d; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 26px; }
      .small { font-size: 24px; }
      .node { stroke: #18211d; stroke-width: 4; }
      .line { fill: none; stroke: #18211d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#faf7f0"/>

  <rect class="node" x="50" y="285" width="190" height="150" rx="75" fill="#f5c79d"/>
  <text class="heading" x="145" y="350" text-anchor="middle">AUTHOR</text>
  <text class="small" x="145" y="392" text-anchor="middle">local context</text>
  <path class="line" d="M 240 360 H 315" marker-end="url(#arrow)"/>

  <rect class="node" x="315" y="230" width="280" height="260" rx="22" fill="#b8d5e5"/>
  <text class="heading" x="455" y="295" text-anchor="middle">SMALL CHANGE</text>
  <circle cx="380" cy="355" r="7" fill="#18211d"/>
  <text class="body" x="405" y="364">code</text>
  <circle cx="380" cy="410" r="7" fill="#18211d"/>
  <text class="body" x="405" y="419">rationale</text>
  <circle cx="380" cy="465" r="7" fill="#18211d"/>
  <text class="body" x="405" y="474">tests</text>
  <path class="line" d="M 595 360 H 670" marker-end="url(#arrow)"/>

  <rect class="node" x="670" y="285" width="190" height="150" rx="22" fill="#d8cce8"/>
  <text class="heading" x="765" y="350" text-anchor="middle">REVIEW</text>
  <text class="small" x="765" y="392" text-anchor="middle">shared scrutiny</text>

  <text class="heading" x="1020" y="70" text-anchor="middle">SHARED OUTCOMES</text>
  <path class="line" d="M 860 360 H 900 V 155 H 945" marker-end="url(#arrow)"/>
  <path class="line" d="M 900 360 H 945" marker-end="url(#arrow)"/>
  <path class="line" d="M 900 360 V 565 H 945" marker-end="url(#arrow)"/>

  <rect class="node" x="945" y="100" width="230" height="110" rx="20" fill="#e9d17f"/>
  <text class="heading" x="1060" y="145" text-anchor="middle">DEFECTS</text>
  <text class="body" x="1060" y="183" text-anchor="middle">caught early</text>
  <rect class="node" x="945" y="305" width="230" height="110" rx="20" fill="#bdd9bf"/>
  <text class="heading" x="1060" y="350" text-anchor="middle">CONTEXT</text>
  <text class="body" x="1060" y="388" text-anchor="middle">shared widely</text>
  <rect class="node" x="945" y="510" width="230" height="110" rx="20" fill="#b8d5e5"/>
  <text class="heading" x="1060" y="555" text-anchor="middle">DECISIONS</text>
  <text class="body" x="1060" y="593" text-anchor="middle">history retained</text>
</svg>
