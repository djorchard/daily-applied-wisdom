<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Three deliberate team interaction modes</title>
  <desc id="desc">Collaboration is high-bandwidth and time-boxed, X-as-a-Service uses a clear interface, and facilitation transfers capability temporarily.</desc>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <text x="600" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#18211d">Choose the interaction for the job</text>
  <g font-family="Arial, sans-serif" fill="#18211d" stroke="#18211d" stroke-width="3">
    <rect x="62" y="178" width="328" height="360" rx="24" fill="#d8cce8"/>
    <rect x="436" y="178" width="328" height="360" rx="24" fill="#b8d5e5"/>
    <rect x="810" y="178" width="328" height="360" rx="24" fill="#bdd9bf"/>
    <g stroke="none" text-anchor="middle">
      <text x="226" y="246" font-size="28" font-weight="700">COLLABORATION</text>
      <text x="226" y="306" font-size="21">discover together</text>
      <text x="226" y="343" font-size="21">high bandwidth</text>
      <text x="226" y="380" font-size="21">time-boxed</text>
      <text x="600" y="246" font-size="28" font-weight="700">X-AS-A-SERVICE</text>
      <text x="600" y="306" font-size="21">clear ownership</text>
      <text x="600" y="343" font-size="21">self-service interface</text>
      <text x="600" y="380" font-size="21">low coordination</text>
      <text x="974" y="246" font-size="28" font-weight="700">FACILITATION</text>
      <text x="974" y="306" font-size="21">remove an obstacle</text>
      <text x="974" y="343" font-size="21">transfer capability</text>
      <text x="974" y="380" font-size="21">temporary help</text>
    </g>
    <line x1="390" y1="450" x2="436" y2="450"/>
    <path d="M423 438l14 12-14 12" fill="none"/>
    <text x="413" y="424" text-anchor="middle" stroke="none" font-size="16" font-weight="700">boundary stabilises</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#18211d" text-anchor="middle">
    <text x="226" y="590" font-size="18" font-weight="700">EXIT: uncertainty falls</text>
    <text x="600" y="590" font-size="18" font-weight="700">SIGNAL: consumers move independently</text>
    <text x="974" y="590" font-size="18" font-weight="700">EXIT: capability is established</text>
    <text x="600" y="686" font-size="23">Mode + purpose + duration + exit condition = an interaction you can inspect and change.</text>
  </g>
</svg>
