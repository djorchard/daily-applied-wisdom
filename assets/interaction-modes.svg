<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Three deliberate team interaction modes</title>
  <desc id="desc">Collaboration supports joint discovery, X-as-a-Service supports independent consumption through a clear interface, and facilitation transfers capability temporarily.</desc>
  <rect width="1200" height="760" fill="#faf7f0"/>
  <g font-family="Arial, sans-serif" fill="#18211d" stroke="#18211d" stroke-width="4">
    <rect x="45" y="72" width="350" height="480" rx="26" fill="#d8cce8"/>
    <rect x="425" y="72" width="350" height="480" rx="26" fill="#b8d5e5"/>
    <rect x="805" y="72" width="350" height="480" rx="26" fill="#bdd9bf"/>
    <g stroke="none" text-anchor="middle">
      <text x="220" y="150" font-size="32" font-weight="700">COLLABORATION</text>
      <text x="220" y="210" font-size="27">Discover together</text>
      <text x="220" y="252" font-size="27">High bandwidth</text>
      <text x="220" y="294" font-size="27">Time-boxed</text>
      <rect x="70" y="395" width="300" height="105" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
      <text x="220" y="445" font-size="22" font-weight="700">EXIT WHEN</text>
      <text x="220" y="480" font-size="24">uncertainty falls</text>

      <text x="600" y="150" font-size="32" font-weight="700">X-AS-A-SERVICE</text>
      <text x="600" y="210" font-size="27">Clear ownership</text>
      <text x="600" y="252" font-size="27">Self-service interface</text>
      <text x="600" y="294" font-size="27">Low coordination</text>
      <rect x="450" y="395" width="300" height="105" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
      <text x="600" y="445" font-size="22" font-weight="700">HEALTHY WHEN</text>
      <text x="600" y="480" font-size="22">teams move independently</text>

      <text x="980" y="150" font-size="32" font-weight="700">FACILITATION</text>
      <text x="980" y="210" font-size="27">Remove an obstacle</text>
      <text x="980" y="252" font-size="27">Transfer capability</text>
      <text x="980" y="294" font-size="27">Temporary help</text>
      <rect x="830" y="395" width="300" height="105" rx="18" fill="#fffdf8" stroke="#18211d" stroke-width="3"/>
      <text x="980" y="445" font-size="22" font-weight="700">EXIT WHEN</text>
      <text x="980" y="480" font-size="22">capability is established</text>
    </g>
  </g>
  <rect x="160" y="600" width="880" height="112" rx="40" fill="#18211d"/>
  <text x="600" y="648" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="white">COMMON EVOLUTION</text>
  <text x="600" y="686" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="white">Collaborate while uncertain → stabilise a boundary → offer a service</text>
</svg>
